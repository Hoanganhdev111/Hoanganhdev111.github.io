<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --bg-elev:#212121; --bg-elev2:#272727; --hover:#3d3d3d;
  --fg:#f1f1f1; --fg-dim:#aaa; --fg-mut:#717171; --red:#ff0000;
  --border:rgba(255,255,255,.1);
  --sb-w:240px; --header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:14px/1.4 'Roboto',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);min-height:100vh;display:flex;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#6d6d6d}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input{font-family:inherit;outline:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* YOUTUBE LOGO */
.yt-logo{display:flex;align-items:center;gap:4px;text-decoration:none;color:#fff;cursor:pointer}
.yt-logo svg{width:90px;height:20px;display:block}
.yt-logo .region{font-size:10px;color:var(--fg-mut);margin-left:-2px;margin-top:-8px}
.premium-badge{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:18px;
  background:linear-gradient(135deg,#ff0000,#ff4444);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(255,0,0,.3);
  flex-shrink:0;
}
.premium-badge svg{width:22px;height:22px}

/* SIDEBAR */
.sidebar{
  width:var(--sb-w);flex-shrink:0;height:100vh;overflow-y:auto;
  padding:12px 12px 24px;position:fixed;top:0;left:0;z-index:80;
  background:var(--bg);
}
.sidebar::-webkit-scrollbar{width:6px}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.sb-logo .ham{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--fg-dim);cursor:pointer;
}
.sb-logo .ham:hover{background:var(--hover);color:var(--fg)}
.nav-item{
  display:flex;align-items:center;gap:16px;padding:9px 12px;
  border-radius:10px;font-size:14px;cursor:pointer;
  margin-bottom:2px;transition:background .15s;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--bg-elev2);font-weight:600}
.nav-item .ico{
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;
}
.nav-div{height:1px;background:var(--border);margin:10px 4px}
.nav-title{
  padding:8px 12px 6px;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-title .arr{font-size:10px;color:var(--fg-mut)}
.sub-item{
  display:flex;align-items:center;gap:14px;padding:8px 12px;
  border-radius:10px;font-size:13.5px;color:var(--fg-dim);
  cursor:pointer;transition:.15s;
}
.sub-item:hover{background:var(--hover);color:var(--fg)}
.sub-item.active{background:var(--bg-elev2);color:var(--fg);font-weight:600}
.sub-item .avt{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:700;flex-shrink:0;
}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sb-w);height:100vh;overflow-y:auto}
.main.full{margin-left:0}

/* TOPBAR */
.topbar{
  height:var(--header-h);flex-shrink:0;background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 16px;
  position:sticky;top:0;z-index:50;
}
.topbar .center{flex:1;display:flex;justify-content:center;max-width:720px;margin:0 auto}
.search-form{
  display:flex;width:100%;max-width:600px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:40px;overflow:hidden;height:40px;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--fg);padding:0 16px;font-size:15px;
}
.search-form input::placeholder{color:var(--fg-mut)}
.search-form button{
  width:64px;background:var(--bg-elev2);border-left:1px solid var(--border);
  color:var(--fg-dim);font-size:16px;
}
.topbar .right{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn-create{
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:20px;background:var(--bg-elev);color:var(--fg);
  font-size:13px;font-weight:500;
}
.btn-create:hover{background:var(--hover)}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-dim);font-size:18px;cursor:pointer;
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

/* CHIPS */
.chips{
  display:flex;gap:12px;padding:12px 24px 8px;overflow-x:auto;
  position:sticky;top:var(--header-h);background:var(--bg);z-index:40;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 14px;border-radius:16px;background:var(--bg-elev);
  color:var(--fg);font-size:13px;font-weight:500;
  white-space:nowrap;cursor:pointer;transition:background .15s;flex-shrink:0;
}
.chip:hover{background:var(--hover)}
.chip.active{background:#fff;color:#0f0f0f}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:28px 16px;padding:12px 24px 40px;
}
.card{cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.thumb{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:12px;overflow:hidden;background:#333;
}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .dur{
  position:absolute;bottom:6px;right:6px;
  background:rgba(0,0,0,.85);color:#fff;
  font-size:12px;font-weight:500;padding:2px 5px;border-radius:4px;
}
.thumb .badge-type{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;
  display:flex;align-items:center;gap:4px;
}
.thumb .badge-type.video{background:rgba(255,0,0,.9)}
.thumb .badge-type.tailieu{background:rgba(52,211,153,.9)}
.thumb .badge-type.btvn{background:rgba(251,191,36,.9);color:#000}
.meta{display:flex;gap:12px;margin-top:12px;padding:0 2px}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:700;
}
.info{flex:1;min-width:0}
.title{
  font-size:15px;font-weight:500;line-height:1.35;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:5px;
}
.author{font-size:13px;color:var(--fg-dim);display:flex;align-items:center;gap:4px}
.author .check{font-size:11px;color:var(--fg-mut)}
.stats{font-size:13px;color:var(--fg-dim);margin-top:2px}
.menu-btn{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-dim);font-size:16px;
}
.menu-btn:hover{background:var(--hover);color:var(--fg)}

/* BOTTOM NAV (mobile) */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  height:56px;background:var(--bg);border-top:1px solid var(--border);
  z-index:100;padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav .bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--fg-dim);font-size:10px;cursor:pointer;padding:4px 0;
}
.bottom-nav .bn-item.active{color:var(--fg)}
.bottom-nav .bn-item .bn-ico{font-size:22px;line-height:1}
.bottom-nav .bn-item.plus .bn-ico{
  background:#fff;color:#0f0f0f;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
}

/* MODAL PLAYER */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:999;display:none;align-items:flex-start;justify-content:center;
  padding:20px;overflow-y:auto;
}
.modal.active{display:flex}
.modal-inner{
  width:100%;max-width:1400px;
  display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;
}
.player-box{
  background:#000;border-radius:12px;overflow:hidden;position:relative;
  aspect-ratio:16/9;
}
.player-box iframe,.player-box video{
  width:100%;height:100%;display:block;border:none;background:#000;
}
.player-close{
  position:absolute;top:12px;right:12px;z-index:10;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
}
.player-close:hover{background:rgba(255,0,0,.9)}
.video-meta{padding:16px 4px}
.video-meta h1{font-size:18px;font-weight:600;line-height:1.35;margin-bottom:10px;color:#fff}
.video-meta .chips-row{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--fg-dim)}
.video-meta .chips-row span{
  background:var(--bg-elev);padding:4px 10px;border-radius:14px;font-size:12px;
}
.modal-playlist{
  background:var(--bg-elev);border-radius:12px;overflow:hidden;
  max-height:calc(100vh - 60px);display:flex;flex-direction:column;
}
.modal-playlist-head{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.modal-playlist-head .ico{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
}
.modal-playlist-head .txt{flex:1;min-width:0}
.modal-playlist-head .txt .t{font-size:14px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-playlist-head .txt .s{font-size:11.5px;color:var(--fg-dim);margin-top:2px}
.modal-playlist-body{flex:1;overflow-y:auto;padding:6px 0}
.modal-pl-item{
  display:flex;gap:10px;padding:8px 12px;cursor:pointer;transition:background .15s;
}
.modal-pl-item:hover{background:var(--hover)}
.modal-pl-item.active{background:var(--bg-elev2)}
.modal-pl-item .n{
  width:28px;flex-shrink:0;text-align:center;
  font-size:12px;color:var(--fg-dim);padding-top:4px;
}
.modal-pl-item.active .n{color:var(--red);font-weight:700}
.modal-pl-item .body{flex:1;min-width:0}
.modal-pl-item .body .nm{
  font-size:13px;color:var(--fg);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.modal-pl-item.active .body .nm{color:#fff;font-weight:600}
.modal-pl-item .body .mt{font-size:11px;color:var(--fg-mut);margin-top:3px}

/* MOBILE */
@media(max-width:800px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{padding:0 10px;gap:8px}
  .topbar .center{display:none}
  .btn-create span{display:none}
  .btn-create{padding:8px 12px}
  .premium-badge{padding:5px 8px;font-size:11px}
  .premium-badge svg{width:18px;height:18px}
  .grid{grid-template-columns:1fr;gap:18px;padding:12px 12px 80px}
  .chips{padding:12px 12px 8px}
  .bottom-nav{display:flex}
  .modal{padding:0}
  .modal-inner{grid-template-columns:1fr;gap:0;max-width:100%}
  .player-box{border-radius:0}
  .modal-playlist{border-radius:0;max-height:none}
  .video-meta{padding:12px 14px}
  .video-meta h1{font-size:15px}
  .modal-close{width:36px;height:36px;font-size:18px}
}
</style>
</head>

<!-- BOTTOM NAV (mobile) -->

<script src="data2.js"></script>
<script>
/* ============================================================
   GỘP TẤT CẢ KHÓA HỌC
   ============================================================ */
const ALL_SUBJECTS = [
  ...(typeof COURSES !== 'undefined' ? COURSES.map(c => ({
    id: 'course_' + c.name.slice(0, 20).replace(/\s+/g, '_'),
    name: c.name,
    desc: 'Khóa học · ' + c.lessons.length + ' bài',
    icon: '📚',
    color: 'red',
    group: 'main',
    lessons: c.lessons.map(l => ({
      name: l.n,
      date: l.c || '',
      link: l.v || '',
      type: l.v ? 'video' : 'tailieu'
    }))
  })) : []),
  ...(typeof MEGA_SUBJECTS !== 'undefined' ? MEGA_SUBJECTS : []),
  ...(typeof SGK_SUBJECTS !== 'undefined' ? SGK_SUBJECTS : []),
  ...(typeof THAY_CHI !== 'undefined' ? [THAY_CHI] : []),
  ...(typeof CO_SEN !== 'undefined' ? [CO_SEN] : [])
];

/* BUILD FLAT LIST */
const ALL_LESSONS = [];
ALL_SUBJECTS.forEach((sub, si) => {
  sub.lessons.forEach((l, li) => {
    ALL_LESSONS.push({
      ...l,
      subIdx: si,
      lesIdx: li,
      subjectId: sub.id,
      subjectName: sub.name,
      subjectIcon: sub.icon,
      subjectColor: sub.color,
      subjectDesc: sub.desc,
      group: sub.group,
      _i: ALL_LESSONS.length
    });
  });
});

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);

function getYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|playlist\?list=)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytThumb(url){
  const id = getYouTubeId(url);
  if(!id) return 'https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg';
  return `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
}
function ytThumbHq(url){
  const id = getYouTubeId(url);
  if(!id) return 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg';
  return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
}
function isYouTube(url){ return url && getYouTubeId(url); }
function isHls(url){ return url && url.includes('.m3u8'); }
function isDrive(url){ return url && url.includes('drive.google.com'); }

function fakeViews(i){
  const base = 1000 + i*137;
  if(base > 1000000) return (base/1000000).toFixed(1)+' Tr lượt xem';
  if(base > 1000) return (base/1000).toFixed(0)+' N lượt xem';
  return base + ' lượt xem';
}
function fakeTime(i){
  const arr = ['1 giờ trước','3 giờ trước','1 ngày trước','3 ngày trước','1 tuần trước','2 tuần trước','1 tháng trước','2 tháng trước'];
  return arr[i % arr.length];
}
function fakeDuration(i){
  const arr = ['12:34','25:18','8:45','42:10','15:22','32:05','18:50','7:33','28:14','55:30'];
  return arr[i % arr.length];
}
function colorGrad(c){
  const map = {
    green:'linear-gradient(135deg,#34d399,#10b981)',
    violet:'linear-gradient(135deg,#a78bfa,#7c3aed)',
    amber:'linear-gradient(135deg,#fbbf24,#f59e0b)',
    red:'linear-gradient(135deg,#f87171,#dc2626)',
    pink:'linear-gradient(135deg,#f472b6,#ec4899)'
  };
  return map[c] || 'linear-gradient(135deg,#ff0000,#a855f7)';
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   SIDEBAR NAV
   ============================================================ */
function renderCourseNav(){
  const nav = $('courseNav');
  nav.innerHTML = ALL_SUBJECTS.slice(0, 30).map((s, i) => `
    <div class="sub-item" data-sid="${s.id}">
      <div class="avt" style="background:${colorGrad(s.color)}">${s.icon || '📚'}</div>
      <span>${escapeHtml(s.name.length > 20 ? s.name.slice(0,20)+'...' : s.name)}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.sub-item').forEach(el => {
    el.onclick = () => {
      nav.querySelectorAll('.sub-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      filterBySubject(el.dataset.sid);
    };
  });
}

function toggleSidebar(){
  const sb = $('sidebar');
  const main = $('main');
  if(sb.style.display === 'none'){
    sb.style.display = 'block';
    main.style.marginLeft = 'var(--sb-w)';
  } else {
    sb.style.display = 'none';
    main.style.marginLeft = '0';
  }
}

/* ============================================================
   GRID RENDER
   ============================================================ */
let currentCat = 'all';
let currentSubjectId = null;
let searchTerm = '';

function filterBySubject(sid){
  currentSubjectId = sid;
  currentCat = 'all';
  searchTerm = '';
  $('search').value = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  renderGrid();
}
function filterHome(){
  currentSubjectId = null;
  currentCat = 'all';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.chip[data-cat="all"]').classList.add('active');
  renderGrid();
}
function filterShorts(){ alert('Shorts — sắp ra mắt!'); }
function filterSubs(){ alert('Kênh đăng ký — sắp ra mắt!'); }

function renderGrid(){
  let list = ALL_LESSONS.slice();

  if(currentSubjectId){
    list = list.filter(l => l.subjectId === currentSubjectId);
  } else if(currentCat !== 'all'){
    if(currentCat === 'video') list = list.filter(l => l.type === 'video');
    else if(currentCat === 'tailieu') list = list.filter(l => l.type === 'tailieu');
    else if(currentCat === 'btvn') list = list.filter(l => l.type === 'btvn');
    else if(currentCat === 'toan') list = list.filter(l => /toán/i.test(l.subjectName));
    else if(currentCat === 'van') list = list.filter(l => /văn/i.test(l.subjectName));
    else if(currentCat === 'anh') list = list.filter(l => /anh|tiếng anh/i.test(l.subjectName));
    else if(currentCat === 'ly_hoa_sinh') list = list.filter(l => /lý|vật lý|hoá|hóa|sinh/i.test(l.subjectName));
  }

  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(l =>
      l.name.toLowerCase().includes(q) ||
      l.subjectName.toLowerCase().includes(q) ||
      (l.date||'').toLowerCase().includes(q)
    );
  }

  $('grid').innerHTML = list.map((l, i) => {
    const isYT = isYouTube(l.link);
    const thumbUrl = isYT ? ytThumb(l.link) : 'https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg';
    const thumbHq = isYT ? ytThumbHq(l.link) : thumbUrl;
    const firstChar = l.subjectName.charAt(0);
    const typeLabel = l.type === 'video' ? '▶ Video' : l.type === 'tailieu' ? '📄 Tài liệu' : '📝 BTVN';
    const typeClass = l.type;
    const dur = fakeDuration(i);

    return `
      <div class="card" onclick='openVideo(${ALL_LESSONS.indexOf(l)})'>
        <div class="thumb">
          <img src="${thumbUrl}" onerror="this.src='${thumbHq}'" alt="${escapeHtml(l.name)}" loading="lazy">
          <div class="badge-type ${typeClass}">${typeLabel}</div>
          <div class="dur">${dur}</div>
        </div>
        <div class="meta">
          <div class="avatar" style="background:${colorGrad(l.subjectColor)}">${firstChar}</div>
          <div class="info">
            <div class="title" title="${escapeHtml(l.name)}">${escapeHtml(l.name)}</div>
            <div class="author">
              ${escapeHtml(l.subjectName)}
              <span class="check">✓</span>
            </div>
            <div class="stats">${fakeViews(i)} · ${fakeTime(i)}</div>
          </div>
          <button class="menu-btn" onclick="event.stopPropagation()">⋮</button>
        </div>
      </div>
    `;
  }).join('') || '<div style="padding:80px 20px;text-align:center;color:#717171;grid-column:1/-1;font-size:15px"><div style="font-size:48px;margin-bottom:14px;opacity:.4">🔍</div>Không tìm thấy video nào</div>';
}

/* ============================================================
   MODAL PLAYER
   ============================================================ */
let HLS = null;

function openVideo(flatIdx){
  const l = ALL_LESSONS[flatIdx];
  if(!l) return;

  // Update info
  $('mTitle').textContent = l.name;
  $('mMeta').innerHTML = `
    <span>${escapeHtml(l.subjectName)}</span>
    <span>${escapeHtml(l.date || '')}</span>
    <span>${l.type === 'video' ? 'Video' : l.type === 'tailieu' ? 'Tài liệu' : 'BTVN'}</span>
  `;
  $('mCourseName').textContent = l.subjectName;
  $('mCourseSub').textContent = l.subjectDesc || '';

  // Build playlist — các bài cùng môn
  const sameSubject = ALL_LESSONS.filter(x => x.subjectId === l.subjectId);
  $('mPlaylist').innerHTML = sameSubject.map((x, i) => {
    const xIdx = ALL_LESSONS.findIndex(y => y.subjectId === x.subjectId && y.name === x.name && y.date === x.date);
    return `
      <div class="modal-pl-item ${x.name === l.name ? 'active' : ''}" onclick="openVideo(${xIdx})">
        <div class="n">${x.name === l.name ? '▶' : i+1}</div>
        <div class="body">
          <div class="nm">${escapeHtml(x.name)}</div>
          <div class="mt">${escapeHtml(x.date || '')}</div>
        </div>
      </div>
    `;
  }).join('');

  const holder = $('playerHolder');

  // Destroy old HLS
  if(HLS){ HLS.destroy(); HLS = null; }

  if(!l.link){
    // Không có link → hiện thông báo
    holder.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;background:#000;padding:20px;text-align:center">
        <div style="font-size:48px;opacity:.6;margin-bottom:14px">📄</div>
        <div style="font-size:15px;font-weight:600">Bài này không có video</div>
        <div style="color:#aaa;font-size:13px;margin-top:8px">Vui lòng chọn bài khác trong danh sách</div>
      </div>`;
  } else if(isYouTube(l.link)){
    // YouTube → iframe
    const id = getYouTubeId(l.link);
    holder.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  } else if(isHls(l.link)){
    // HLS → video + hls.js
    holder.innerHTML = `<video id="hlsVideo" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
    const v = $('hlsVideo');
    if(window.Hls && Hls.isSupported()){
      HLS = new Hls({ enableWorker:true, lowLatencyMode:false });
      HLS.loadSource(l.link);
      HLS.attachMedia(v);
      HLS.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
      HLS.on(Hls.Events.ERROR, (_, data) => {
        if(data.fatal) console.error('HLS error:', data);
      });
    } else {
      v.src = l.link;
    }
  } else {
    // Link trực tiếp (mp4)
    holder.innerHTML = `<video src="${l.link}" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
  }

  $('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  $('modal').classList.remove('active');
  document.body.style.overflow = '';
  if(HLS){ HLS.destroy(); HLS = null; }
  $('playerHolder').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

/* CHIPS */
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentCat = c.dataset.cat;
    currentSubjectId = null;
    document.querySelectorAll('#courseNav .sub-item').forEach(x => x.classList.remove('active'));
    renderGrid();
  };
});

/* SEARCH */
$('search').oninput = e => {
  searchTerm = e.target.value;
  renderGrid();
};

/* ============================================================
   BOOT
   ============================================================ */
renderCourseNav();
renderGrid();

// Kiểm tra mobile để hiện nút ham
if(window.innerWidth <= 800){
  $('mobileHam').style.display = 'flex';
  $('mobileLogo').style.display = 'flex';
}
</script>
</body>
