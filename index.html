<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WeX Education · Học trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#0a0a12;
  --surface:#13131f;
  --surface-2:#1a1a2a;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.13);
  --primary:#8b5cf6;
  --primary-2:#a78bfa;
  --green:#34d399;
  --amber:#fbbf24;
  --red:#f87171;
  --pink:#ec4899;
  --text:#f1f5f9;
  --text-2:#cbd5e1;
  --text-3:#94a3b8;
  --text-4:#64748b;
  --radius:16px;
  --header-h:64px;
  --sidebar-w:268px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:15px/1.55 'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(700px 500px at 12% 8%, rgba(139,92,246,.13), transparent 60%),
    radial-gradient(800px 600px at 88% 20%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(900px 700px at 50% 95%, rgba(236,72,153,.08), transparent 60%);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input{font-family:inherit;outline:none}

.header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:var(--header-h);
  background:rgba(10,10,18,.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px;
  padding:0 18px;
}
.header .ham{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3); font-size:17px;
  transition:all .2s; flex-shrink:0;
  border:1px solid transparent;
}
.header .ham:hover{background:rgba(255,255,255,.05); color:var(--text); border-color:var(--border-2)}
.logo{display:flex; align-items:center; gap:10px; flex-shrink:0; cursor:pointer}
.logo-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#ec4899,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-size:19px; font-weight:900;
  box-shadow:0 0 24px rgba(139,92,246,.5);
}
.logo-text{
  font-size:17px; font-weight:800; letter-spacing:-.03em;
  background:linear-gradient(120deg,#fff 20%,#a78bfa 60%,#67e8f9 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.logo-text small{
  display:block; font-size:10px; font-weight:500;
  color:var(--text-4); letter-spacing:.3px;
  -webkit-text-fill-color:initial; background:none; margin-top:1px;
}
.search-wrap{flex:1; max-width:520px; margin:0 auto; position:relative}
.search-wrap i{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--text-4); font-size:14px; pointer-events:none;
}
.search-input{
  width:100%; height:42px;
  padding:0 18px 0 44px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-2);
  border-radius:12px;
  font-size:14px; color:var(--text);
  transition:all .25s;
}
.search-input::placeholder{color:var(--text-4)}
.search-input:focus{
  background:rgba(139,92,246,.08);
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(139,92,246,.15);
}
.header-right{display:flex; align-items:center; gap:8px; flex-shrink:0}
.icon-btn{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3); font-size:17px;
  transition:all .2s; border:1px solid transparent;
}
.icon-btn:hover{background:rgba(255,255,255,.05); color:var(--text); border-color:var(--border-2)}
.btn-premium{
  display:flex; align-items:center; gap:7px;
  padding:10px 16px; border-radius:12px;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#fff; font-size:13px; font-weight:700;
  box-shadow:0 4px 20px rgba(245,158,11,.4);
  transition:transform .2s;
}
.btn-premium:hover{transform:translateY(-2px)}
.btn-premium i{font-size:12px}

@media(max-width:900px){
  .header{padding:0 12px; gap:10px}
  .search-wrap{display:none}
  .logo-text{font-size:15px}
  .logo-text small{display:none}
  .logo-mark{width:36px;height:36px;font-size:17px}
  .btn-premium span{display:none}
  .btn-premium{padding:10px 12px}
}

.app{
  display:flex;
  width:100%;
  height:100vh;
  padding-top:var(--header-h);
  position:relative; z-index:1;
}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto; overflow-x:hidden;
  border-right:1px solid var(--border);
  padding:20px 14px 40px;
  transition:transform .25s, width .25s;
}
.sidebar::-webkit-scrollbar{width:6px}

.sb-title{
  font-size:10.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:1.2px; color:var(--text-4);
  padding:0 12px; margin:18px 0 10px;
}
.sb-title:first-child{margin-top:0}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:12px;
  font-size:14px; color:var(--text-2); font-weight:500;
  cursor:pointer; margin-bottom:3px;
  transition:all .15s;
  white-space:nowrap; overflow:hidden;
  border:1px solid transparent;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.04); color:var(--text); border-color:var(--border)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.08));
  color:#fff; font-weight:600;
  border-color:rgba(139,92,246,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 20px rgba(139,92,246,.15);
}
.nav-item.active::before{
  content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:3px; height:20px; background:linear-gradient(180deg,#8b5cf6,#22d3ee);
  border-radius:3px; box-shadow:0 0 12px rgba(139,92,246,.8);
}
.nav-item > i:first-child{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px; flex-shrink:0;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  color:var(--primary-2);
}
.nav-item[data-color="violet"] > i:first-child{color:#c4b5fd}
.nav-item[data-color="green"] > i:first-child{color:#34d399}
.nav-item[data-color="amber"] > i:first-child{color:#fbbf24}
.nav-item[data-color="red"] > i:first-child{color:#f87171}
.nav-item[data-color="pink"] > i:first-child{color:#f472b6}
.nav-item .nav-count{
  margin-left:auto; font-size:10.5px; font-weight:700;
  background:rgba(255,255,255,.05); color:var(--text-4);
  padding:2px 8px; border-radius:20px;
}
.nav-item.active .nav-count{background:rgba(139,92,246,.25); color:#c4b5fd}
.sidebar-divider{
  height:1px; margin:14px 12px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
}

.main{
  flex:1; min-width:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:26px 30px 80px;
}
.toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:12px;
  margin-bottom:24px;
}
.view-toggle{
  display:flex; gap:4px;
  background:rgba(255,255,255,.03);
  padding:4px; border-radius:12px;
  border:1px solid var(--border-2);
  overflow-x:auto; scrollbar-width:none;
}
.view-toggle::-webkit-scrollbar{display:none}
.view-btn{
  padding:9px 16px; border-radius:9px;
  color:var(--text-3); font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.view-btn:hover{color:var(--text)}
.view-btn.active{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  color:#fff;
  box-shadow:0 4px 14px rgba(139,92,246,.4);
}
.info-bar{
  display:flex; flex-wrap:wrap; gap:12px 20px;
  background:rgba(255,255,255,.025);
  padding:12px 20px; border-radius:14px; margin-bottom:24px;
  border:1px solid var(--border);
  font-size:12.5px; color:var(--text-3);
}
.info-bar strong{color:var(--text); font-weight:700}
.info-bar .dot{
  display:inline-block; width:7px;height:7px; border-radius:50%;
  background:var(--green); margin-right:6px;
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content-head{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin-bottom:20px; gap:12px;
}
.content-head h2{
  font-size:22px; font-weight:800; letter-spacing:-.03em;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(120deg,#fff 30%,#c4b5fd 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.content-head h2 i{
  -webkit-text-fill-color:var(--primary-2);
  color:var(--primary-2); font-size:19px;
}
.content-head .meta{
  font-size:12.5px; color:var(--text-4);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.content-head .meta i{color:var(--primary-2); font-size:11px}

.subjects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:18px;
}
@media(max-width:1400px){.subjects-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media(max-width:600px){.subjects-grid{grid-template-columns:1fr;gap:14px}}

.subject-card{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 22px 16px;
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.subject-card::before{
  content:''; position:absolute; inset:0; border-radius:var(--radius);
  padding:1px; pointer-events:none;
  background:linear-gradient(135deg,rgba(139,92,246,.6),transparent 40%,transparent 60%,rgba(34,211,238,.6));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0; transition:opacity .3s;
}
.subject-card:hover{
  transform:translateY(-4px);
  box-shadow:0 24px 48px -12px rgba(0,0,0,.7), 0 0 40px rgba(139,92,246,.15);
}
.subject-card:hover::before{opacity:1}

.card-header{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px}
.subject-icon{
  width:46px;height:46px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:19px; flex-shrink:0;
  background:rgba(139,92,246,.12);
  border:1px solid rgba(139,92,246,.3);
  color:#c4b5fd;
}
.subject-icon.violet{background:rgba(167,139,250,.12); border-color:rgba(167,139,250,.3); color:#c4b5fd}
.subject-icon.green{background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.3); color:#34d399}
.subject-icon.amber{background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.3); color:#fbbf24}
.subject-icon.red{background:rgba(248,113,113,.12); border-color:rgba(248,113,113,.3); color:#f87171}
.subject-icon.pink{background:rgba(244,114,182,.12); border-color:rgba(244,114,182,.3); color:#f472b6}

.subject-title{flex:1; min-width:0}
.subject-title h3{
  font-weight:700; font-size:15px; letter-spacing:-.01em;
  color:var(--text); line-height:1.3;
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
}
.subject-title .desc{
  font-size:11.5px; color:var(--text-4); margin-top:4px; line-height:1.4;
}
.hsa-badge{
  background:rgba(52,211,153,.15);
  border:1px solid rgba(52,211,153,.35);
  color:#34d399; font-size:9.5px; font-weight:700;
  padding:2px 8px; border-radius:20px; letter-spacing:.4px;
}
.card-actions{display:flex; gap:4px; flex-shrink:0}
.icon-btn-sm{
  width:30px;height:30px; border-radius:9px;
  border:1px solid var(--border);
  background:transparent; color:var(--text-4);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .18s; font-size:12px;
}
.icon-btn-sm:hover{
  background:rgba(139,92,246,.15);
  color:#c4b5fd;
  border-color:rgba(139,92,246,.35);
}
.lesson-list{
  list-style:none; margin:4px 0 6px;
  max-height:260px; overflow-y:auto;
  padding-right:4px;
  scrollbar-width:thin;
}
.lesson-list::-webkit-scrollbar{width:4px}
.lesson-list::-webkit-scrollbar-thumb{background:var(--border-2); border-radius:20px}
.lesson-item{
  display:flex; align-items:flex-start; gap:9px;
  padding:8px 10px; border-radius:10px;
  font-size:12.5px; cursor:pointer;
  transition:all .15s;
  border-left:2px solid transparent;
  margin-bottom:2px;
}
.lesson-item:hover{
  background:rgba(139,92,246,.08);
  border-left-color:var(--primary);
  padding-left:14px;
}
.lesson-idx{
  color:var(--primary-2); font-weight:700; font-size:11px;
  min-width:22px; padding-top:2px;
  font-variant-numeric:tabular-nums;
}
.lesson-body{flex:1; min-width:0}
.lesson-name{
  color:var(--text-2); font-weight:400; line-height:1.42;
  word-break:break-word; display:block;
}
.lesson-item:hover .lesson-name{color:var(--text)}
.lesson-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:3px; font-size:10px; color:var(--text-4);
}
.lesson-type{
  display:inline-flex; align-items:center; gap:3px;
  font-size:9.5px; padding:1px 7px; border-radius:8px; font-weight:700;
}
.lesson-type.video{background:rgba(139,92,246,.15); color:#c4b5fd}
.lesson-type.tailieu{background:rgba(52,211,153,.15); color:#34d399}
.lesson-type.btvn{background:rgba(251,191,36,.15); color:#fbbf24}
.lesson-arrow{color:var(--text-4); font-size:10px; opacity:.5; padding-top:3px}
.card-footer{
  margin-top:auto; padding-top:12px; border-top:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.card-footer .count{
  font-size:11px; color:var(--text-4);
  display:flex; align-items:center; gap:5px; flex-wrap:wrap;
}
.card-footer .count i{color:var(--primary-2)}
.btn-ghost{
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(34,211,238,.08));
  border:1px solid rgba(139,92,246,.35);
  color:#c4b5fd;
  font-size:11px; padding:7px 14px; border-radius:30px; font-weight:600;
  cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.btn-ghost:hover{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  color:#fff; border-color:transparent;
  box-shadow:0 4px 14px rgba(139,92,246,.4);
}
.empty-state{
  text-align:center; padding:80px 20px; color:var(--text-4);
  font-size:14px; border:1px dashed var(--border-2);
  border-radius:var(--radius); grid-column:1/-1;
}
.empty-state i{font-size:42px; margin-bottom:16px; display:block; opacity:.3}

.modal-overlay{
  position:fixed; inset:0;
  background:rgba(5,5,12,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:9999; display:none;
  align-items:center; justify-content:center;
  padding:24px;
  animation:fadeIn .2s;
}
.modal-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%; max-width:920px; max-height:88vh;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border-2);
  border-radius:20px; overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.8), 0 0 80px rgba(139,92,246,.15);
  display:flex; flex-direction:column;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  padding:18px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.02);
}
.modal-head .subject-icon{width:42px;height:42px;font-size:17px}
.modal-head h3{
  font-size:16px; font-weight:700; flex:1;
  color:var(--text); letter-spacing:-.02em;
}
.modal-head h3 .desc{
  font-size:11.5px; color:var(--text-4);
  font-weight:400; margin-top:3px; display:block;
}
.modal-close{
  width:36px;height:36px; border-radius:50%;
  border:1px solid var(--border-2);
  background:transparent; color:var(--text-3);
  cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s;
}
.modal-close:hover{background:rgba(239,68,68,.9); color:#fff; border-color:transparent; transform:rotate(90deg)}
.modal-body{flex:1; overflow-y:auto; padding:12px 20px 20px}
.modal-body .lesson-item{padding:11px 14px; font-size:13px}
.modal-body .lesson-name{font-size:13.5px}

@media(max-width:900px){
  :root{--header-h:60px}
  .sidebar{
    position:fixed; top:var(--header-h); left:0; bottom:0;
    width:280px; z-index:90;
    background:linear-gradient(180deg,#0e0e1a,#13131f);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.6);
    height:calc(100vh - var(--header-h));
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{
    position:fixed; inset:0; top:var(--header-h);
    background:rgba(0,0,0,.6);
    z-index:85; display:none;
    animation:fadeIn .2s;
  }
  .sidebar-backdrop.show{display:block}
  .main{padding:16px 14px 60px}
  .toolbar{margin-bottom:16px; gap:8px}
  .view-btn{padding:8px 14px; font-size:12.5px}
  .info-bar{padding:10px 14px; font-size:11.5px; gap:8px 14px; margin-bottom:16px}
  .info-bar span:nth-child(4),.info-bar span:nth-child(5){display:none}
  .content-head h2{font-size:18px}
  .content-head h2 i{font-size:16px}
  .content-head .meta{font-size:11.5px}
  .subject-card{padding:16px 16px 14px; border-radius:14px}
  .subject-icon{width:40px;height:40px;font-size:16px;border-radius:11px}
  .subject-title h3{font-size:14px}
  .subject-title .desc{font-size:11px}
  .lesson-item{padding:7px 8px; font-size:12px}
  .lesson-idx{font-size:10.5px; min-width:20px}
  .lesson-list{max-height:240px}
  .card-footer{padding-top:10px}
  .btn-ghost{padding:6px 12px; font-size:10.5px}
  .modal-overlay{padding:0}
  .modal-box{max-width:100%; max-height:100vh; border-radius:0; min-height:100vh; border:none}
  .modal-head{padding:14px 18px}
  .modal-body{padding:8px 12px 16px}
}
@media(max-width:600px){
  .logo-text{font-size:14px}
  .logo-mark{width:34px;height:34px;font-size:15px}
  .header .ham{width:38px;height:38px;font-size:16px}
  .icon-btn{width:38px;height:38px;font-size:16px}
  .btn-premium{padding:9px 11px; font-size:12px}
}
</style>
</head>
<body>

<header class="header">
  <button class="ham" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="logo" onclick="goHome()">
    <div class="logo-mark">W</div>
    <div class="logo-text">
      WeX Education
      <small>Học trực tuyến · HSA · THPT</small>
    </div>
  </div>
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Tìm bài học, tài liệu, BTVN...">
  </div>
  <div class="header-right">
    <button class="btn-premium" onclick="alert('WeX Premium — sắp ra mắt!')">
      <i class="fas fa-crown"></i> <span>Premium</span>
    </button>
    <button class="icon-btn"><i class="fas fa-bell"></i></button>
    <button class="icon-btn"><i class="fas fa-user-circle"></i></button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div id="navList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div class="view-toggle">
        <button class="view-btn active" data-view="all"><i class="fas fa-th-large"></i> Tất cả</button>
        <button class="view-btn" data-view="video"><i class="fas fa-play-circle"></i> Video</button>
        <button class="view-btn" data-view="tailieu"><i class="fas fa-file-alt"></i> Tài liệu</button>
        <button class="view-btn" data-view="btvn"><i class="fas fa-pen-to-square"></i> BTVN</button>
      </div>
    </div>
    <div class="info-bar">
      <span><span class="dot"></span> <strong>Live</strong> · cập nhật 16/09/2026</span>
      <span>📚 <strong id="infoLessons">0</strong> mục</span>
      <span>🎓 <strong id="infoSubjects">0</strong> môn</span>
      <span>🔗 <strong id="infoLinks">0</strong> link</span>
      <span>⛶ Click <strong>phóng to</strong> để xem full danh sách</span>
    </div>
    <div id="contentArea"></div>
  </main>
</div>

<div class="modal-overlay" id="expandModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="subject-icon" id="modalIcon"><i class="fas fa-book"></i></div>
      <h3 id="modalTitle">Danh sách bài học<span class="desc" id="modalDesc"></span></h3>
      <button class="modal-close" onclick="closeExpand()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="data2.js"></script>
<script>
/* ============================================================
   STATE & LOGIC
   ============================================================ */
let activeFilter='all', activeTab='all', searchTerm='', activeView='all';

const contentArea=document.getElementById('contentArea');
const navList=document.getElementById('navList');
const searchInput=document.getElementById('searchInput');

const ALL_SUBJECTS=[
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

function countAllLessons(){return ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0);}
function countAllLinks(){let t=0; ALL_SUBJECTS.forEach(s=>s.lessons.forEach(l=>{if(l.link)t++})); return t;}

function getFilteredLessons(sub){
  let L=sub.lessons;
  if(activeView==='video') L=L.filter(l=>l.type==='video');
  if(activeView==='tailieu') L=L.filter(l=>l.type==='tailieu');
  if(activeView==='btvn') L=L.filter(l=>l.type==='btvn');
  if(searchTerm) L=L.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return L;
}

function renderNav(){
  const items=[
    {id:'all',label:'Tất cả',icon:'fa-th-large',color:'',count:countAllLessons()},
    {id:'hsa',label:'HSA (MegaEdu)',icon:'fa-graduation-cap',color:'violet',count:MEGA_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0)},
    {id:'video',label:'Video bài giảng',icon:'fa-play-circle',color:'green',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='video').length,0)},
    {id:'tailieu',label:'Tài liệu',icon:'fa-file-alt',color:'amber',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='tailieu').length,0)},
    {id:'btvn',label:'BTVN',icon:'fa-pen-to-square',color:'red',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='btvn').length,0)},
  ];
  let html='<div class="sb-title">Trang chính</div>';
  items.forEach(i=>{
    html+=`<div class="nav-item ${activeTab===i.id?'active':''}" data-tab="${i.id}" data-color="${i.color}">
      <i class="fas ${i.icon}"></i><span>${i.label}</span><span class="nav-count">${i.count}</span>
    </div>`;
  });
  html+='<div class="sidebar-divider"></div><div class="sb-title">Giáo viên</div>';
  html+=`<div class="nav-item ${activeTab==='thaychi'?'active':''}" data-tab="thaychi" data-color="red">
    <i class="fas fa-chalkboard-teacher"></i><span>Toán Thầy Chí</span><span class="nav-count">${THAY_CHI.lessons.length}</span></div>`;
  html+=`<div class="nav-item ${activeTab==='cosen'?'active':''}" data-tab="cosen" data-color="pink">
    <i class="fas fa-scroll"></i><span>Sử Cô Hương Sen</span><span class="nav-count">${CO_SEN.lessons.length}</span></div>`;
  html+='<div class="sidebar-divider"></div><div class="sb-title">Sách giáo khoa</div>';
  SGK_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i><span>${s.name}</span><span class="nav-count">${s.lessons.length}</span></div>`;
  });
  html+='<div class="sidebar-divider"></div><div class="sb-title">Môn học HSA</div>';
  MEGA_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i><span>${s.name}</span><span class="nav-count">${s.lessons.length}</span></div>`;
  });
  navList.innerHTML=html;

  navList.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.tab){
        activeTab=el.dataset.tab;
        activeFilter='all';
      } else if(el.dataset.filter){
        activeFilter=el.dataset.filter;
        activeTab='all';
      }
      renderNav();
      renderContent();
      if(window.innerWidth<=900) closeSidebar();
    });
  });
}

function renderContent(){
  const filtered=ALL_SUBJECTS.filter(s=>{
    if(activeTab==='thaychi') return s.group==='thaychi';
    if(activeTab==='cosen') return s.group==='cosen';
    if(activeTab==='hsa') return s.group==='hsa';
    if(activeTab==='video'||activeTab==='tailieu'||activeTab==='btvn') return true;
    if(activeFilter!=='all') return s.id===activeFilter;
    return true;
  }).filter(s=>{
    if(!searchTerm) return true;
    const t=searchTerm.toLowerCase();
    return s.name.toLowerCase().includes(t)||s.lessons.some(l=>l.name.toLowerCase().includes(t));
  });

  let title='Tất cả nội dung', titleIcon='fa-th-large';
  if(activeTab==='thaychi'){title='Toán Thầy Chí 12'; titleIcon='fa-chalkboard-teacher';}
  else if(activeTab==='cosen'){title='Sử Cô Hương Sen'; titleIcon='fa-scroll';}
  else if(activeTab==='hsa'){title='HSA (MegaEdu)'; titleIcon='fa-graduation-cap';}
  else if(activeTab==='video'){title='Video bài giảng'; titleIcon='fa-play-circle';}
  else if(activeTab==='tailieu'){title='Tài liệu học tập'; titleIcon='fa-file-alt';}
  else if(activeTab==='btvn'){title='BTVN & Chữa BTVN'; titleIcon='fa-pen-to-square';}
  else if(activeFilter!=='all'){
    const s=ALL_SUBJECTS.find(x=>x.id===activeFilter);
    if(s){title=s.name; titleIcon=s.icon;}
  }

  let html=`<div class="content-head">
    <h2><i class="fas ${titleIcon}"></i> ${title}</h2>
    <div class="meta">
      <span><i class="fas fa-book"></i> <strong>${filtered.reduce((a,s)=>a+getFilteredLessons(s).length,0)}</strong> mục</span>
      <span><i class="fas fa-layer-group"></i> ${filtered.length} môn</span>
    </div>
  </div>`;

  if(filtered.length===0){
    html+=`<div class="empty-state"><i class="fas fa-folder-open"></i>Chưa có nội dung trong mục này.</div>`;
    contentArea.innerHTML=html;
    return;
  }

  html+='<div class="subjects-grid">';
  filtered.forEach(sub=>{
    const lessons=getFilteredLessons(sub);
    if(lessons.length===0) return;
    const color=sub.color||'';
    const videoCount=sub.lessons.filter(l=>l.type==='video').length;
    const tlCount=sub.lessons.filter(l=>l.type==='tailieu').length;
    const btCount=sub.lessons.filter(l=>l.type==='btvn').length;

    const displayLessons=lessons.slice(0,6);
    let li=displayLessons.map((l)=>{
      const gi=sub.lessons.indexOf(l)+1;
      let typeLabel='', typeClass='';
      if(l.type==='tailieu'){typeLabel='Tài liệu'; typeClass='tailieu';}
      else if(l.type==='btvn'){typeLabel='BTVN'; typeClass='btvn';}
      else {typeLabel='Video'; typeClass='video';}
      return `<li class="lesson-item" onclick="window.open('${l.link}','_blank')">
        <span class="lesson-idx">${gi}.</span>
        <div class="lesson-body">
          <span class="lesson-name">${l.name}</span>
          <div class="lesson-meta">
            <span class="lesson-type ${typeClass}">${typeLabel}</span>
            <span>${l.date}</span>
          </div>
        </div>
        <i class="fas fa-arrow-right lesson-arrow"></i>
      </li>`;
    }).join('');
    if(lessons.length>6){
      li+=`<li style="padding:10px;text-align:center;color:var(--primary-2);font-size:11.5px;cursor:pointer;font-weight:600" onclick="event.stopPropagation();openExpand('${sub.id}')">+ Xem thêm ${lessons.length-6} mục...</li>`;
    }

    const isHSA=sub.group==='hsa';

    html+=`<div class="subject-card" data-color="${color}">
      <div class="card-header">
        <div class="subject-icon ${color}"><i class="fas ${sub.icon}"></i></div>
        <div class="subject-title">
          <h3>${sub.name} ${isHSA?'<span class="hsa-badge">HSA</span>':''}</h3>
          <div class="desc">${sub.desc||''}</div>
        </div>
        <div class="card-actions">
          <button class="icon-btn-sm" title="Phóng to" onclick="openExpand('${sub.id}')"><i class="fas fa-expand-alt"></i></button>
        </div>
      </div>
      <ul class="lesson-list">${li}</ul>
      <div class="card-footer">
        <div class="count">
          <i class="fas fa-play-circle"></i> ${videoCount} video
          ${tlCount?`· <i class="fas fa-file-alt"></i> ${tlCount} TL`:''}
          ${btCount?`· <i class="fas fa-pen"></i> ${btCount} BTVN`:''}
        </div>
        <button class="btn-ghost" onclick="window.open('${sub.lessons[0]?.link||'#'}','_blank')"><i class="fas fa-play"></i> Bắt đầu</button>
      </div>
    </div>`;
  });
  html+='</div>';

  contentArea.innerHTML=html;
}

function openExpand(subId){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  document.getElementById('modalIcon').className=`subject-icon ${sub.color||''}`;
  document.getElementById('modalIcon').innerHTML=`<i class="fas ${sub.icon}"></i>`;
  document.getElementById('modalTitle').innerHTML=`${sub.name} ${sub.group==='hsa'?'<span class="hsa-badge">HSA</span>':''}<span class="desc">${sub.desc||''} · ${lessons.length} mục</span>`;
  let body='<ul class="lesson-list" style="max-height:none">';
  lessons.forEach((l)=>{
    const gi=sub.lessons.indexOf(l)+1;
    let typeLabel='', typeClass='';
    if(l.type==='tailieu'){typeLabel='Tài liệu'; typeClass='tailieu';}
    else if(l.type==='btvn'){typeLabel='BTVN'; typeClass='btvn';}
    else {typeLabel='Video'; typeClass='video';}
    body+=`<li class="lesson-item" onclick="window.open('${l.link}','_blank')">
      <span class="lesson-idx">${gi}.</span>
      <div class="lesson-body">
        <span class="lesson-name">${l.name}</span>
        <div class="lesson-meta">
          <span class="lesson-type ${typeClass}">${typeLabel}</span>
          <span>${l.date}</span>
        </div>
      </div>
      <i class="fas fa-arrow-right lesson-arrow"></i>
    </li>`;
  });
  body+='</ul>';
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('expandModal').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeExpand(){
  document.getElementById('expandModal').classList.remove('active');
  document.body.style.overflow='';
}
document.getElementById('expandModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeExpand()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeExpand()});

document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeView=btn.dataset.view;
    activeTab=btn.dataset.view;
    renderNav();
    renderContent();
  });
});

function updateStats(){
  const t=countAllLessons(),l=countAllLinks(),s=ALL_SUBJECTS.length;
  document.getElementById('infoLessons').textContent=t;
  document.getElementById('infoSubjects').textContent=s;
  document.getElementById('infoLinks').textContent=l;
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const bd=document.getElementById('sidebarBackdrop');
  sb.classList.toggle('open');
  bd.classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

function goHome(){
  activeTab='all'; activeFilter='all'; searchTerm='';
  searchInput.value='';
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.view-btn[data-view="all"]').classList.add('active');
  activeView='all';
  renderNav();
  renderContent();
}

searchInput.addEventListener('input',e=>{
  searchTerm=e.target.value;
  renderContent();
});

updateStats();
renderNav();
renderContent();
</script>
</body>
</html>
