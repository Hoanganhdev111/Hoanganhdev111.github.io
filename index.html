<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WeX Education · Học trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#0f0f0f;
  --bg-elev:#212121;
  --bg-elev2:#272727;
  --hover:#3d3d3d;
  --fg:#f1f1f1;
  --fg-dim:#aaa;
  --fg-mut:#717171;
  --red:#ff0000;
  --border:rgba(255,255,255,.1);
  --header-h:56px;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:14px/1.4 'Roboto',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--fg);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#6d6d6d}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input{font-family:inherit;outline:none}
img{display:block;max-width:100%}

/* ============ HEADER ============ */
.header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:var(--header-h);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px;
  padding:0 16px;
}
.header .ham{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-dim); font-size:18px;
  transition:background .15s;
}
.header .ham:hover{background:var(--hover);color:var(--fg)}
.logo{display:flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer}
.logo svg{width:90px;height:20px;display:block}
.logo .region{font-size:10px;color:var(--fg-mut);margin-left:-2px;margin-top:-8px}

.search-wrap{flex:1; max-width:640px; margin:0 auto; position:relative; display:flex}
.search-input{
  width:100%; height:40px;
  padding:0 16px;
  background:#121212;
  border:1px solid var(--border);
  border-radius:40px 0 0 40px;
  font-size:15px; color:var(--fg);
  transition:all .2s;
}
.search-input::placeholder{color:var(--fg-mut)}
.search-input:focus{border-color:#1c62b9}
.search-btn{
  width:64px; height:40px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-left:none;
  border-radius:0 40px 40px 0;
  color:var(--fg-dim); font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.search-btn:hover{background:var(--hover)}

.header-right{display:flex; align-items:center; gap:4px; flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-dim); font-size:18px; transition:background .15s;
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.btn-premium{
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:18px;
  background:linear-gradient(135deg,#ff0000,#ff4444);
  color:#fff; font-size:13px; font-weight:600;
  box-shadow:0 2px 8px rgba(255,0,0,.3);
}
.btn-premium svg{width:20px;height:20px}

@media(max-width:900px){
  .header{padding:0 8px; gap:8px}
  .search-wrap{display:none}
  .logo svg{width:78px}
  .btn-premium span{display:none}
  .btn-premium{padding:8px 10px}
}

/* ============ LAYOUT ============ */
.app{
  display:flex;
  width:100%;
  height:100vh;
  padding-top:var(--header-h);
}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto; overflow-x:hidden;
  background:var(--bg);
  padding:12px 12px 40px;
  transition:transform .25s, width .25s;
}
.sidebar::-webkit-scrollbar{width:6px}

.sb-title{
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.8px; color:var(--fg-mut);
  padding:0 12px; margin:16px 0 8px;
}
.sb-title:first-child{margin-top:0}

.nav-item{
  display:flex; align-items:center; gap:16px;
  padding:9px 12px; border-radius:10px;
  font-size:14px; color:var(--fg); font-weight:400;
  cursor:pointer; margin-bottom:2px;
  transition:background .15s;
  white-space:nowrap; overflow:hidden;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{
  background:var(--bg-elev2); font-weight:600;
}
.nav-item > i:first-child{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px; flex-shrink:0;
  color:var(--fg-dim);
}
.nav-item.active > i:first-child{color:var(--red)}
.nav-item[data-color="violet"] > i:first-child{color:#a78bfa}
.nav-item[data-color="green"] > i:first-child{color:#34d399}
.nav-item[data-color="amber"] > i:first-child{color:#fbbf24}
.nav-item[data-color="red"] > i:first-child{color:#f87171}
.nav-item[data-color="pink"] > i:first-child{color:#f472b6}
.nav-item .nav-count{
  margin-left:auto; font-size:11px; font-weight:500;
  background:var(--bg-elev);
  color:var(--fg-mut);
  padding:2px 8px; border-radius:20px;
}
.sidebar-divider{
  height:1px; margin:12px 12px;
  background:var(--border);
}

/* MAIN */
.main{
  flex:1; min-width:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:20px 24px 80px;
  background:var(--bg);
}

.toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin-bottom:24px;
}
.chip{
  padding:8px 14px; border-radius:20px;
  background:var(--bg-elev); color:var(--fg);
  font-size:13px; font-weight:500;
  cursor:pointer; transition:all .15s;
  white-space:nowrap; border:1px solid var(--border);
  display:flex; align-items:center; gap:6px;
}
.chip:hover{background:var(--hover)}
.chip.active{
  background:#fff; color:#0f0f0f; border-color:#fff;
}
.chip i{font-size:13px}

.info-bar{
  display:flex; flex-wrap:wrap; gap:12px 20px;
  background:var(--bg-elev);
  padding:10px 18px; border-radius:12px; margin-bottom:22px;
  font-size:12.5px; color:var(--fg-dim);
}
.info-bar strong{color:var(--fg); font-weight:600}
.info-bar .dot{
  display:inline-block; width:7px;height:7px; border-radius:50%;
  background:#34d399; margin-right:6px;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content-head{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin-bottom:18px; gap:12px;
}
.content-head h2{
  font-size:20px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; gap:10px;
}
.content-head h2 i{color:var(--red)}
.content-head .meta{
  font-size:13px; color:var(--fg-dim);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.content-head .meta i{color:var(--fg-mut); font-size:11px}

/* ============ VIDEO GRID ============ */
.subjects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:28px 16px;
}
@media(max-width:900px){
  .subjects-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
}
@media(max-width:600px){
  .subjects-grid{grid-template-columns:1fr;gap:18px}
}

.subject-card{
  cursor:pointer;
  transition:transform .15s;
  display:flex; flex-direction:column;
}
.subject-card:active{transform:scale(.98)}

.thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(135deg,#1a1a28,#22222f);
  display:flex; align-items:center; justify-content:center;
}
.thumb-wrap img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .3s;
}
.subject-card:hover .thumb-wrap img{transform:scale(1.05)}

/* Fallback khi không có thumbnail YouTube */
.thumb-fallback{
  position:relative;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;text-align:center;gap:10px;
  color:#fff;
}
.thumb-fallback::before{
  content:''; position:absolute; inset:0;
  background:var(--thumb-grad,linear-gradient(135deg,#ff0000,#a855f7));
  opacity:.85;
}
.thumb-fallback > *{position:relative;z-index:1}
.thumb-fallback .tf-icon{
  font-size:42px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
}
.thumb-fallback .tf-cat{
  font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.2px;
  padding:3px 10px;border-radius:20px;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);
}
.thumb-fallback .tf-title{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}

/* Badge loại bài */
.thumb-badge{
  position:absolute;top:8px;left:8px;z-index:2;
  padding:3px 8px;border-radius:6px;
  font-size:11px;font-weight:600;
  display:flex;align-items:center;gap:4px;
  color:#fff;
}
.thumb-badge.video{background:rgba(255,0,0,.9)}
.thumb-badge.tailieu{background:rgba(16,185,129,.9)}
.thumb-badge.btvn{background:rgba(245,158,11,.95);color:#000}

/* Số bài */
.thumb-count{
  position:absolute;bottom:8px;right:8px;z-index:2;
  padding:3px 8px;border-radius:4px;
  background:rgba(0,0,0,.85);color:#fff;
  font-size:11px;font-weight:500;
}

.play-overlay{
  position:absolute;inset:0;z-index:2;
  background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.subject-card:hover .play-overlay{opacity:1}
.play-overlay svg{
  width:60px;height:60px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
}

.subject-info{
  display:flex; gap:12px; margin-top:12px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:700;
}
.subject-title{flex:1; min-width:0}
.subject-title h3{
  font-weight:500; font-size:15px; line-height:1.35;
  color:var(--fg); margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.subject-title .desc{
  font-size:13px;color:var(--fg-dim);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.subject-title .desc .dot{opacity:.6;margin:0 4px}
.subject-title .desc .meta-lite{
  display:inline-flex;align-items:center;gap:4px;
}

.empty-state{
  text-align:center; padding:80px 20px; color:var(--fg-mut);
  font-size:14px; grid-column:1/-1;
}
.empty-state i{font-size:48px; margin-bottom:16px; display:block; opacity:.3}

/* ============ PLAYER PAGE ============ */
.player-page{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:200;
  display:none;
  overflow:hidden;
}
.player-page.active{display:flex}

.pp-layout{
  display:flex;
  width:100%;height:100%;
  padding-top:var(--header-h);
}

/* Cột trái: player + info */
.pp-main{
  flex:1;min-width:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:24px 24px 40px;
}
.pp-player-box{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  aspect-ratio:16/9;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  position:relative;
}
.pp-player-box iframe,
.pp-player-box video{
  width:100%;height:100%;display:block;border:none;background:#000;
}

.pp-info{max-width:1100px;margin:16px auto 0}
.pp-info h1{
  font-size:20px;font-weight:700;line-height:1.35;
  margin-bottom:10px;
}
.pp-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  font-size:13px;color:var(--fg-dim);margin-bottom:16px;
}
.pp-meta .chip-sm{
  background:var(--bg-elev);
  padding:4px 10px;border-radius:14px;
  font-size:12px;font-weight:500;
}

.pp-actions{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
}
.pp-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:18px;
  background:var(--bg-elev);color:var(--fg);
  font-size:13px;font-weight:500;
  transition:background .15s;
}
.pp-btn:hover{background:var(--hover)}
.pp-btn.primary{
  background:linear-gradient(135deg,#ff0000,#ff4444);
  color:#fff;
}

.pp-desc{
  background:var(--bg-elev);
  border-radius:12px;
  padding:14px 16px;
  font-size:13.5px;color:var(--fg);
  line-height:1.6;
}
.pp-desc strong{color:#fff}

/* Cột phải: playlist */
.pp-side{
  width:402px;flex-shrink:0;
  height:calc(100vh - var(--header-h));
  background:var(--bg);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}
.pp-side-head{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.pp-side-head .ico{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#ff0000,#a855f7);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
}
.pp-side-head .txt{flex:1;min-width:0}
.pp-side-head .txt .t{
  font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pp-side-head .txt .s{font-size:11.5px;color:var(--fg-mut);margin-top:2px}

.pp-playlist{
  flex:1;overflow-y:auto;
  padding:6px 0 40px;
}
.pp-item{
  display:flex;gap:10px;padding:8px 12px;
  cursor:pointer;transition:background .15s;
  position:relative;
}
.pp-item:hover{background:var(--bg-elev)}
.pp-item.active{background:var(--bg-elev2)}
.pp-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--red);
}
.pp-item .pp-n{
  width:24px;flex-shrink:0;text-align:center;
  font-size:12px;color:var(--fg-mut);padding-top:4px;
}
.pp-item.active .pp-n{color:var(--red);font-weight:700}
.pp-item .pp-body{flex:1;min-width:0}
.pp-item .pp-name{
  font-size:13px;line-height:1.4;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px;
}
.pp-item.active .pp-name{color:#fff;font-weight:600}
.pp-item .pp-date{
  font-size:11px;color:var(--fg-mut);
}

.pp-close{
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-elev);
  color:var(--fg);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.pp-close:hover{background:var(--red);color:#fff}

/* ============ MOBILE ============ */
@media(max-width:900px){
  :root{--header-h:56px}

  /* Ẩn sidebar desktop, dùng off-canvas */
  .sidebar{
    position:fixed; top:var(--header-h); left:0; bottom:0;
    width:280px; z-index:95;
    background:var(--bg);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.6);
    height:calc(100vh - var(--header-h));
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{
    position:fixed; inset:0; top:var(--header-h);
    background:rgba(0,0,0,.6);
    z-index:85; display:none;
    animation:fadeIn .2s;
  }
  .sidebar-backdrop.show{display:block}

  .main{padding:16px 14px 60px}

  .toolbar{
    overflow-x:auto; scrollbar-width:none;
    margin:0 -14px 16px; padding:0 14px 4px;
    flex-wrap:nowrap;
  }
  .toolbar::-webkit-scrollbar{display:none}

  .info-bar{font-size:11.5px;padding:8px 14px;gap:8px 12px;margin-bottom:16px}
  .info-bar span:nth-child(4),
  .info-bar span:nth-child(5){display:none}

  .content-head h2{font-size:18px}
  .content-head .meta{font-size:12px}

  /* Player mobile: xếp dọc */
  .pp-layout{flex-direction:column}

  .pp-main{
    height:auto;
    padding:0 0 20px;
    overflow:visible;
  }
  .pp-player-box{
    border-radius:0;
    max-width:100%;
  }
  .pp-info{padding:0 14px}
  .pp-info h1{font-size:16px}

  .pp-side{
    width:100%;
    height:auto;
    border-left:none;
    border-top:1px solid var(--border);
  }

  .player-page{
    overflow-y:auto;
  }
  .pp-layout{
    height:auto;
    min-height:100vh;
  }
}
@media(max-width:600px){
  .logo svg{width:70px}
  .header .ham,.icon-btn{width:36px;height:36px;font-size:16px}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

<script src="data2.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let activeFilter='all', activeTab='all', searchTerm='', activeView='all';
let currentLesson = null;
let currentLessonIdx = -1;

const contentArea=document.getElementById('contentArea');
const navList=document.getElementById('navList');
const searchInput=document.getElementById('searchInput');

const ALL_SUBJECTS=[
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

/* ============================================================
   HELPERS
   ============================================================ */
function getYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytThumb(url, quality='max'){
  const id = getYouTubeId(url);
  if(!id) return null;
  return `https://i.ytimg.com/vi/${id}/${quality}resdefault.jpg`;
}
function isYouTube(url){ return url && !!getYouTubeId(url); }
function isHls(url){ return url && url.includes('.m3u8'); }
function isDriveFolder(url){ return url && url.includes('drive.google.com/drive/folders'); }
function isDriveFile(url){ return url && url.includes('drive.google.com/file/d/'); }

function colorGrad(c){
  const map = {
    green:'linear-gradient(135deg,#10b981,#059669)',
    violet:'linear-gradient(135deg,#8b5cf6,#7c3aed)',
    amber:'linear-gradient(135deg,#f59e0b,#d97706)',
    red:'linear-gradient(135deg,#ef4444,#dc2626)',
    pink:'linear-gradient(135deg,#ec4899,#db2777)'
  };
  return map[c] || 'linear-gradient(135deg,#ff0000,#a855f7)';
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fakeTime(i){
  const arr=['1 giờ trước','3 giờ trước','1 ngày trước','3 ngày trước','1 tuần trước','2 tuần trước'];
  return arr[i % arr.length];
}

function countAllLessons(){return ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0);}
function countAllLinks(){let t=0; ALL_SUBJECTS.forEach(s=>s.lessons.forEach(l=>{if(l.link)t++})); return t;}

function getFilteredLessons(sub){
  let L=sub.lessons;
  if(activeView==='video') L=L.filter(l=>l.type==='video');
  if(activeView==='tailieu') L=L.filter(l=>l.type==='tailieu');
  if(activeView==='btvn') L=L.filter(l=>l.type==='btvn');
  if(activeView==='toan') L=L.filter(l=>/toán/i.test(sub.name));
  if(activeView==='van') L=L.filter(l=>/văn/i.test(sub.name));
  if(activeView==='anh') L=L.filter(l=>/anh|tiếng anh/i.test(sub.name));
  if(searchTerm) L=L.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return L;
}

/* ============================================================
   NAV SIDEBAR
   ============================================================ */
function renderNav(){
  const items=[
    {id:'all',label:'Trang chủ',icon:'fa-home',color:'',count:countAllLessons()},
    {id:'video',label:'Video',icon:'fa-play-circle',color:'red',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='video').length,0)},
    {id:'tailieu',label:'Tài liệu',icon:'fa-file-alt',color:'green',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='tailieu').length,0)},
    {id:'btvn',label:'BTVN',icon:'fa-pen-to-square',color:'amber',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='btvn').length,0)},
  ];
  let html='';
  items.forEach(i=>{
    html+=`<div class="nav-item ${activeTab===i.id?'active':''}" data-tab="${i.id}" data-color="${i.color}">
      <i class="fas ${i.icon}"></i><span>${i.label}</span><span class="nav-count">${i.count}</span>
    </div>`;
  });
  html+='<div class="sidebar-divider"></div><div class="sb-title">Giáo viên</div>';
  html+=`<div class="nav-item ${activeTab==='thaychi'?'active':''}" data-tab="thaychi" data-color="red">
    <i class="fas fa-chalkboard-teacher"></i><span>Toán Thầy Chí</span><span class="nav-count">${THAY_CHI.lessons.length}</span></div>`;
  html+=`<div class="nav-item ${activeTab==='cosen'?'active':''}" data-tab="cosen" data-color="pink">
    <i class="fas fa-scroll"></i><span>Sử Cô Hương Sen</span><span class="nav-count">${CO_SEN.lessons.length}</span></div>`;
  html+='<div class="sidebar-divider"></div><div class="sb-title">Sách giáo khoa</div>';
  SGK_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i><span>${s.name}</span><span class="nav-count">${s.lessons.length}</span></div>`;
  });
  html+='<div class="sidebar-divider"></div><div class="sb-title">Môn học HSA</div>';
  MEGA_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i><span>${s.name}</span><span class="nav-count">${s.lessons.length}</span></div>`;
  });
  navList.innerHTML=html;

  navList.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.tab){
        activeTab=el.dataset.tab;
        activeFilter='all';
        activeView=el.dataset.tab;
        document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.view===el.dataset.tab));
      } else if(el.dataset.filter){
        activeFilter=el.dataset.filter;
        activeTab='all';
      }
      renderNav();
      renderContent();
      if(window.innerWidth<=900) closeSidebar();
    });
  });
}

/* ============================================================
   RENDER CONTENT
   ============================================================ */
function renderContent(){
  const filtered=ALL_SUBJECTS.filter(s=>{
    if(activeTab==='thaychi') return s.group==='thaychi';
    if(activeTab==='cosen') return s.group==='cosen';
    if(activeTab==='hsa') return s.group==='hsa';
    if(['video','tailieu','btvn','toan','van','anh'].includes(activeTab)) return true;
    if(activeFilter!=='all') return s.id===activeFilter;
    return true;
  }).filter(s=>{
    if(!searchTerm) return true;
    const t=searchTerm.toLowerCase();
    return s.name.toLowerCase().includes(t)||s.lessons.some(l=>l.name.toLowerCase().includes(t));
  });

  let title='Trang chủ', titleIcon='fa-home';
  if(activeTab==='thaychi'){title='Toán Thầy Chí 12'; titleIcon='fa-chalkboard-teacher';}
  else if(activeTab==='cosen'){title='Sử Cô Hương Sen'; titleIcon='fa-scroll';}
  else if(activeTab==='hsa'){title='HSA (MegaEdu)'; titleIcon='fa-graduation-cap';}
  else if(activeTab==='video'){title='Video bài giảng'; titleIcon='fa-play-circle';}
  else if(activeTab==='tailieu'){title='Tài liệu học tập'; titleIcon='fa-file-alt';}
  else if(activeTab==='btvn'){title='BTVN & Chữa BTVN'; titleIcon='fa-pen-to-square';}
  else if(activeFilter!=='all'){
    const s=ALL_SUBJECTS.find(x=>x.id===activeFilter);
    if(s){title=s.name; titleIcon=s.icon;}
  }

  let html=`<div class="content-head">
    <h2><i class="fas ${titleIcon}"></i> ${title}</h2>
    <div class="meta">
      <span><i class="fas fa-book"></i> <strong>${filtered.reduce((a,s)=>a+getFilteredLessons(s).length,0)}</strong> bài</span>
      <span><i class="fas fa-layer-group"></i> ${filtered.length} môn</span>
    </div>
  </div>`;

  if(filtered.length===0){
    html+=`<div class="empty-state"><i class="fas fa-folder-open"></i>Chưa có nội dung trong mục này.</div>`;
    contentArea.innerHTML=html;
    return;
  }

  html+='<div class="subjects-grid">';
  filtered.forEach((sub, idx)=>{
    const lessons=getFilteredLessons(sub);
    if(lessons.length===0) return;
    const color=sub.color||'';
    const firstLesson=lessons[0];

    // Thumbnail: nếu có YouTube → ảnh, ngược lại gradient
    const ytThumbUrl = ytThumb(firstLesson.link);
    let thumbContent;
    if(ytThumbUrl){
      thumbContent = `
        <img src="${ytThumbUrl}" onerror="this.src='${ytThumb(firstLesson.link,'hq')}'" alt="">
        <div class="play-overlay">
          <svg viewBox="0 0 24 24" fill="#fff">
            <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-width="1.5"/>
            <path d="M10 8l6 4-6 4V8z" fill="#fff"/>
          </svg>
        </div>`;
    } else {
      thumbContent = `
        <div class="thumb-fallback" style="--thumb-grad:${colorGrad(color)}">
          <div class="tf-icon">${firstLesson.type==='tailieu'?'📄':firstLesson.type==='btvn'?'📝':'🎬'}</div>
          <div class="tf-cat">${escapeHtml(sub.name)}</div>
          <div class="tf-title">${escapeHtml(firstLesson.name)}</div>
        </div>`;
    }

    const typeLabel = firstLesson.type==='tailieu'?'Tài liệu':firstLesson.type==='btvn'?'BTVN':'Video';

    html+=`<div class="subject-card" onclick="openExpand('${sub.id}')">
      <div class="thumb-wrap">
        ${thumbContent}
        <div class="thumb-badge ${firstLesson.type}"><i class="fas ${firstLesson.type==='video'?'fa-play':firstLesson.type==='tailieu'?'fa-file-alt':'fa-pen'}"></i> ${typeLabel}</div>
        <div class="thumb-count">${lessons.length} bài</div>
      </div>
      <div class="subject-info">
        <div class="avatar" style="background:${colorGrad(color)}">${escapeHtml(sub.name.charAt(0))}</div>
        <div class="subject-title">
          <h3>${escapeHtml(sub.name)}</h3>
          <div class="desc">
            ${escapeHtml(sub.desc||'')}
            <br>
            <span class="meta-lite"><i class="fas fa-play-circle"></i> ${sub.lessons.filter(l=>l.type==='video').length} video</span>
            ${sub.lessons.filter(l=>l.type==='tailieu').length ? `<span class="dot">•</span><span class="meta-lite"><i class="fas fa-file-alt"></i> ${sub.lessons.filter(l=>l.type==='tailieu').length} tài liệu</span>` : ''}
            ${sub.lessons.filter(l=>l.type==='btvn').length ? `<span class="dot">•</span><span class="meta-lite"><i class="fas fa-pen"></i> ${sub.lessons.filter(l=>l.type==='btvn').length} BTVN</span>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  });
  html+='</div>';

  contentArea.innerHTML=html;
}

/* ============================================================
   PLAYER PAGE
   ============================================================ */
function openExpand(subId){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  if(lessons.length===0) return;

  // Build playlist bên phải
  document.getElementById('ppSideTitle').textContent = sub.name;
  document.getElementById('ppSideSub').textContent = `${lessons.length} bài · ${sub.desc||''}`;

  let listHtml='';
  lessons.forEach((l, i)=>{
    const isActive = i===0;
    listHtml+=`<div class="pp-item ${isActive?'active':''}" data-idx="${i}" onclick="playLesson('${subId}', ${i})">
      <div class="pp-n">${isActive?'▶':(i+1)}</div>
      <div class="pp-body">
        <div class="pp-name">${escapeHtml(l.name)}</div>
        <div class="pp-date">${escapeHtml(l.date||'')}</div>
      </div>
    </div>`;
  });
  document.getElementById('ppPlaylist').innerHTML = listHtml;

  // Phát bài đầu tiên
  playLesson(subId, 0);

  // Hiện player page
  document.getElementById('playerPage').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function playLesson(subId, lessonIdx){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  const l = lessons[lessonIdx];
  if(!l) return;

  currentLesson = l;
  currentLessonIdx = lessonIdx;

  // Update active item
  document.querySelectorAll('.pp-item').forEach((el, i)=>{
    el.classList.toggle('active', i===lessonIdx);
    const n = el.querySelector('.pp-n');
    if(n) n.textContent = i===lessonIdx ? '▶' : (i+1);
  });

  // Update info
  document.getElementById('ppTitle').textContent = l.name;
  document.getElementById('ppMeta').innerHTML = `
    <span class="chip-sm">${escapeHtml(sub.name)}</span>
    <span class="chip-sm">${escapeHtml(l.date||'Học liệu')}</span>
    <span class="chip-sm">${l.type==='video'?'Video':l.type==='tailieu'?'Tài liệu':'BTVN'}</span>
  `;
  document.getElementById('ppDesc').innerHTML = `
    <strong>${escapeHtml(l.name)}</strong><br>
    Khóa học: ${escapeHtml(sub.name)} · ${escapeHtml(sub.desc||'')}
  `;

  // Nhúng video
  const box = document.getElementById('playerBox');

  if(!l.link){
    box.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;background:#000;gap:14px;text-align:center;padding:20px">
      <div style="font-size:56px;opacity:.6">📄</div>
      <div style="font-size:16px;font-weight:600">Bài này không có video</div>
      <div style="color:#94a3b8;font-size:13px">Vui lòng chọn bài khác trong danh sách bên phải</div>
    </div>`;
  } else if(isYouTube(l.link)){
    const id = getYouTubeId(l.link);
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  } else if(isHls(l.link)){
    box.innerHTML = `<video id="hlsVideo" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
    const v = document.getElementById('hlsVideo');
    if(window.Hls && Hls.isSupported()){
      const hls = new Hls({enableWorker:true, lowLatencyMode:false});
      hls.loadSource(l.link);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>v.play().catch(()=>{}));
    } else {
      v.src = l.link;
    }
  } else if(isDriveFolder(l.link)){
    box.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;background:#000;gap:14px;text-align:center;padding:20px">
      <div style="font-size:64px">📁</div>
      <div style="font-size:16px;font-weight:600">Thư mục tài liệu trên Google Drive</div>
      <a href="${l.link}" target="_blank" rel="noopener" style="margin-top:8px;padding:10px 22px;border-radius:10px;background:#10b981;color:#fff;font-weight:600;font-size:14px;text-decoration:none">📁 Mở thư mục Drive</a>
    </div>`;
  } else if(isDriveFile(l.link)){
    const m = l.link.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
    if(m){
      box.innerHTML = `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    } else {
      box.innerHTML = `<video src="${l.link}" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
    }
  } else {
    box.innerHTML = `<video src="${l.link}" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
  }

  // Scroll player to top
  document.querySelector('.pp-main').scrollTop = 0;
}

function closePlayer(){
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('playerBox').innerHTML = '';
  document.body.style.overflow = '';
  currentLesson = null;
}
function openExternal(){
  if(currentLesson?.link) window.open(currentLesson.link,'_blank');
}
function copyLink(){
  if(!currentLesson?.link) return;
  navigator.clipboard.writeText(currentLesson.link).then(()=>alert('Đã copy link!'));
}

/* ESC để đóng player */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('playerPage').classList.contains('active')){
    closePlayer();
  }
});

/* ============================================================
   CHIP FILTER
   ============================================================ */
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    activeView=c.dataset.view;
    activeTab=c.dataset.view;
    activeFilter='all';
    renderNav();
    renderContent();
  };
});

/* ============================================================
   STATS + SIDEBAR + HOME
   ============================================================ */
function updateStats(){
  document.getElementById('infoLessons').textContent = countAllLessons();
  document.getElementById('infoSubjects').textContent = ALL_SUBJECTS.length;
  document.getElementById('infoLinks').textContent = countAllLinks();
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
function goHome(){
  activeTab='all'; activeFilter='all'; activeView='all'; searchTerm='';
  searchInput.value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.view==='all'));
  renderNav();
  renderContent();
}

searchInput.addEventListener('input', e=>{
  searchTerm=e.target.value;
  renderContent();
});

updateStats();
renderNav();
renderContent();
</script>
</body>
</html>
