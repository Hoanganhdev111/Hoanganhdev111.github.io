<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeX Education · HSA + Toán Thầy Chí + Sử Cô Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0D1A; --surface:#111628; --surface2:#161B30; --border:#1E2540; --border2:#2E3A60;
    --primary:#6C8EFF; --violet:#A78BFA; --green:#34D399; --amber:#FBBF24; --red:#F87171; --pink:#F472B6;
    --text:#F8FAFF; --text2:#C7D0E8; --text3:#8E9AC0; --muted:#6C7A9E;
    --radius:20px;
  }
  [data-theme="light"]{
    --bg:#f0f2f8; --surface:#ffffff; --surface2:#f8f9fc; --border:#d8dce8; --border2:#c0c6d8;
    --primary:#5b4bdb; --violet:#7c5cd6; --green:#10b981; --amber:#d97706; --red:#dc2626; --pink:#ec4899;
    --text:#1a1a2e; --text2:#4a4a6a; --text3:#6a6a8a; --muted:#8a8aaa;
  }
  body{
    background:var(--bg); font-family:'Inter',sans-serif; color:var(--text);
    line-height:1.5; padding:20px; min-height:100vh;
    transition:background .3s,color .3s;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(rgba(108,142,255,.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(108,142,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
  }
  [data-theme="light"] body::before{opacity:.3}
  .app{max-width:1600px; margin:0 auto; position:relative; z-index:2}

  /* ============ HEADER ============ */
  .header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    background:rgba(17,22,40,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 26px; margin-bottom:20px;
    box-shadow:0 20px 35px -12px rgba(0,0,0,.7),0 0 0 1px rgba(108,142,255,.08) inset;
  }
  [data-theme="light"] .header{background:rgba(255,255,255,.85)}
  .logo-area{display:flex; align-items:center; gap:14px}
  .logo-icon{
    width:48px;height:48px; background:linear-gradient(135deg,var(--primary),var(--violet));
    border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#0A0D1A; font-weight:800;
    box-shadow:0 0 24px rgba(108,142,255,.55);
  }
  .logo-text{font-weight:800; font-size:22px; letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--text) 20%,var(--violet) 80%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .logo-text small{display:block; font-weight:400; font-size:11px; color:var(--text3);
    background:none; -webkit-background-clip:unset; background-clip:unset; margin-top:2px; letter-spacing:.3px;}
  .header-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .stats-badge{
    display:flex; gap:16px; background:rgba(10,13,26,.8);
    padding:9px 20px; border-radius:40px; border:1px solid var(--border);
    font-size:12.5px; font-weight:500;
  }
  [data-theme="light"] .stats-badge{background:rgba(240,242,248,.9)}
  .stats-badge .badge-item{display:flex; align-items:center; gap:6px}
  .stats-badge i{color:var(--primary); font-size:12px}
  .stats-badge span{color:var(--text2)}
  .stats-badge strong{color:var(--text); font-weight:700; margin-left:3px}
  .theme-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text2);
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    transition:all .2s;
  }
  .theme-btn:hover{background:var(--border); color:var(--text)}

  /* ============ LAYOUT: SIDEBAR + MAIN ============ */
  .layout{display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}

  /* SIDEBAR */
  .sidebar{
    background:rgba(17,22,40,.75); backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 18px; position:sticky; top:20px;
    max-height:calc(100vh - 40px); overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
  }
  [data-theme="light"] .sidebar{background:rgba(255,255,255,.9)}
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border2); border-radius:20px}

  .sidebar-title{
    font-size:11px; font-weight:700; color:var(--text3);
    text-transform:uppercase; letter-spacing:.8px;
    margin-bottom:12px; padding-left:4px;
  }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:12px;
    cursor:pointer; transition:all .18s;
    color:var(--text2); font-size:13.5px; font-weight:500;
    margin-bottom:3px; border:1px solid transparent;
    position:relative;
  }
  .nav-item:hover{background:rgba(108,142,255,.08); color:var(--text)}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(108,142,255,.18),rgba(167,139,250,.12));
    color:var(--text); font-weight:600; border-color:rgba(108,142,255,.3);
  }
  .nav-item.active::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:20px; background:var(--primary); border-radius:3px;
  }
  .nav-item i:first-child{
    width:28px; height:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0;
    background:rgba(108,142,255,.1); color:var(--primary);
  }
  .nav-item[data-color="violet"] i:first-child{background:rgba(167,139,250,.12); color:var(--violet)}
  .nav-item[data-color="green"] i:first-child{background:rgba(52,211,153,.12); color:var(--green)}
  .nav-item[data-color="amber"] i:first-child{background:rgba(251,191,36,.12); color:var(--amber)}
  .nav-item[data-color="red"] i:first-child{background:rgba(248,113,113,.12); color:var(--red)}
  .nav-item[data-color="pink"] i:first-child{background:rgba(244,114,182,.12); color:var(--pink)}
  .nav-item .nav-count{
    margin-left:auto; font-size:10.5px; font-weight:600;
    background:var(--bg); padding:2px 8px; border-radius:20px;
    color:var(--text3); border:1px solid var(--border);
  }
  .nav-item.active .nav-count{background:var(--primary); color:#0A0D1A; border-color:var(--primary)}

  .sidebar-divider{
    height:1px; background:var(--border); margin:14px 4px;
  }

  /* MAIN */
  .main{min-width:0}

  /* TOOLBAR */
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    margin-bottom:20px;
  }
  .search-wrapper{flex:1; min-width:220px; position:relative}
  .search-wrapper i{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--primary); font-size:14px}
  .search-wrapper input{
    width:100%; background:rgba(17,22,40,.8); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:14px; padding:12px 20px 12px 46px;
    font-size:13.5px; color:var(--text); outline:none; transition:all .2s;
    font-family:'Inter',sans-serif;
  }
  [data-theme="light"] .search-wrapper input{background:rgba(255,255,255,.9)}
  .search-wrapper input::placeholder{color:var(--muted)}
  .search-wrapper input:focus{border-color:var(--primary); box-shadow:0 0 0 4px rgba(108,142,255,.12)}

  .view-toggle{
    display:flex; gap:2px; background:rgba(17,22,40,.7); padding:4px;
    border-radius:12px; border:1px solid var(--border);
  }
  [data-theme="light"] .view-toggle{background:rgba(255,255,255,.8)}
  .view-btn{
    padding:8px 14px; border-radius:9px; border:none; background:transparent;
    color:var(--text3); font-size:12.5px; font-weight:500; cursor:pointer;
    transition:all .2s; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px;
  }
  .view-btn.active{background:var(--primary); color:#0A0D1A; font-weight:600}

  /* CONTENT HEADER */
  .content-head{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:12px;
  }
  .content-head h2{
    font-size:19px; font-weight:700; letter-spacing:-.02em;
    display:flex; align-items:center; gap:10px;
  }
  .content-head h2 i{color:var(--primary)}
  .content-head .meta{
    font-size:12.5px; color:var(--text3);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .content-head .meta span{display:flex; align-items:center; gap:5px}
  .content-head .meta i{color:var(--primary); font-size:11px}

  /* ============ CARD GRID ============ */
  .subjects-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
    gap:18px;
  }
  @media(max-width:1400px){.subjects-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
  @media(max-width:600px){.subjects-grid{grid-template-columns:1fr}}

  .subject-card{
    background:rgba(17,22,40,.75); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px 16px;
    transition:transform .22s,border-color .22s,box-shadow .22s;
    display:flex; flex-direction:column;
    box-shadow:0 12px 24px -10px rgba(0,0,0,.5);
    position:relative; overflow:hidden;
  }
  [data-theme="light"] .subject-card{background:rgba(255,255,255,.9)}
  .subject-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--primary),var(--violet));
    opacity:.7; transition:opacity .2s;
  }
  .subject-card[data-color="violet"]::before{background:linear-gradient(90deg,var(--violet),var(--pink))}
  .subject-card[data-color="green"]::before{background:linear-gradient(90deg,var(--green),#22d3ee)}
  .subject-card[data-color="amber"]::before{background:linear-gradient(90deg,var(--amber),var(--red))}
  .subject-card[data-color="red"]::before{background:linear-gradient(90deg,var(--red),var(--pink))}
  .subject-card[data-color="pink"]::before{background:linear-gradient(90deg,var(--pink),var(--violet))}
  .subject-card:hover{
    border-color:var(--border2); transform:translateY(-3px);
    box-shadow:0 22px 32px -12px rgba(0,0,0,.75),0 0 0 1px rgba(108,142,255,.18);
  }
  .subject-card:hover::before{opacity:1}

  .card-header{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px}
  .subject-icon{
    width:46px;height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:20px; background:rgba(108,142,255,.12); color:var(--primary); border:1px solid var(--border);
    flex-shrink:0;
  }
  .subject-icon.violet{background:rgba(167,139,250,.12); color:var(--violet)}
  .subject-icon.green{background:rgba(52,211,153,.12); color:var(--green)}
  .subject-icon.amber{background:rgba(251,191,36,.12); color:var(--amber)}
  .subject-icon.red{background:rgba(248,113,113,.12); color:var(--red)}
  .subject-icon.pink{background:rgba(244,114,182,.12); color:var(--pink)}
  .subject-title{flex:1; min-width:0}
  .subject-title h3{font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--text); line-height:1.3; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .subject-title .desc{
    font-size:11.5px; color:var(--text3); margin-top:4px; line-height:1.4;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .subject-title .desc i{font-size:10px; color:var(--primary)}

  .hsa-badge{
    background:rgba(52,211,153,.15); border:1px solid rgba(52,211,153,.35);
    color:var(--green); font-size:9.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; letter-spacing:.4px;
  }
  .tag-badge{
    font-size:9.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; letter-spacing:.4px;
  }
  .tag-video{background:rgba(108,142,255,.15); border:1px solid rgba(108,142,255,.3); color:var(--primary)}
  .tag-tailieu{background:rgba(52,211,153,.15); border:1px solid rgba(52,211,153,.3); color:var(--green)}
  .tag-btvn{background:rgba(251,191,36,.15); border:1px solid rgba(251,191,36,.3); color:var(--amber)}

  .card-actions{
    display:flex; gap:4px; flex-shrink:0;
  }
  .icon-btn{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
    background:transparent; color:var(--text3); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s; font-size:12px;
  }
  .icon-btn:hover{background:var(--border); color:var(--text); border-color:var(--border2)}
  .icon-btn.expand:hover{background:var(--primary); color:#0A0D1A; border-color:var(--primary)}

  .lesson-list{
    list-style:none; margin-top:4px;
    max-height:280px; overflow-y:auto;
    padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
    margin-bottom:6px;
  }
  .lesson-list::-webkit-scrollbar{width:4px}
  .lesson-list::-webkit-scrollbar-thumb{background:var(--border2); border-radius:20px}

  .lesson-item{
    display:flex; align-items:flex-start; gap:9px; padding:8px 10px;
    border-radius:10px; font-size:12.5px; cursor:pointer;
    transition:all .15s;
    border-left:2px solid transparent;
  }
  .lesson-item:hover{
    background:rgba(108,142,255,.09);
    border-left-color:var(--primary);
    padding-left:14px;
  }
  .lesson-idx{
    color:var(--primary); font-weight:700; font-size:11px;
    min-width:22px; opacity:.9; padding-top:2px; font-variant-numeric:tabular-nums;
  }
  .lesson-body{flex:1; min-width:0}
  .lesson-name{color:var(--text2); font-weight:400; line-height:1.42; word-break:break-word; display:block}
  .lesson-meta{display:flex; align-items:center; gap:8px; margin-top:3px; font-size:10px; color:var(--muted)}
  .lesson-type{
    display:inline-flex; align-items:center; gap:3px;
    font-size:9.5px; padding:1px 6px; border-radius:8px; font-weight:600;
  }
  .lesson-type.video{background:rgba(108,142,255,.12); color:var(--primary)}
  .lesson-type.tailieu{background:rgba(52,211,153,.12); color:var(--green)}
  .lesson-type.btvn{background:rgba(251,191,36,.12); color:var(--amber)}
  .lesson-arrow{color:var(--muted); font-size:10px; opacity:.5; padding-top:3px}

  .card-footer{
    margin-top:auto; padding-top:12px; border-top:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .card-footer .count{
    font-size:11px; color:var(--text3); display:flex; align-items:center; gap:5px;
  }
  .card-footer .count i{color:var(--primary)}
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text3);
    font-size:11px; padding:7px 14px; border-radius:30px; font-weight:500;
    cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px;
  }
  .btn-ghost i{font-size:11px; color:var(--primary)}
  .btn-ghost:hover{background:var(--border); color:var(--text); border-color:var(--border2)}

  /* EMPTY */
  .empty-state{
    text-align:center; padding:70px 20px; color:var(--muted);
    font-size:14px; border:1px dashed var(--border); border-radius:var(--radius);
    grid-column:1/-1;
  }
  .empty-state i{font-size:38px; margin-bottom:14px; display:block; opacity:.35}

  /* ============ MODAL EXPAND ============ */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,8,18,.88); backdrop-filter:blur(8px);
    z-index:9999; display:none; align-items:center; justify-content:center; padding:24px;
    animation:fadeIn .2s ease;
  }
  .modal-overlay.active{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-box{
    width:100%; max-width:920px; max-height:90vh;
    background:var(--surface); border:1px solid var(--border2);
    border-radius:24px; overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(0,0,0,.9);
    display:flex; flex-direction:column;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px); opacity:0}to{transform:translateY(0); opacity:1}}
  .modal-head{
    padding:18px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; background:var(--bg);
  }
  .modal-head .subject-icon{width:42px; height:42px; font-size:18px}
  .modal-head h3{font-size:16px; font-weight:700; flex:1}
  .modal-head h3 .desc{font-size:11.5px; color:var(--text3); font-weight:400; margin-top:2px; display:block}
  .modal-close{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:var(--text3); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:all .2s;
  }
  .modal-close:hover{background:var(--red); color:#fff; border-color:var(--red)}
  .modal-body{
    flex:1; overflow-y:auto; padding:12px 20px 20px;
    scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
  }
  .modal-body::-webkit-scrollbar{width:6px}
  .modal-body::-webkit-scrollbar-thumb{background:var(--border2); border-radius:20px}
  .modal-body .lesson-item{padding:10px 12px; font-size:13px}
  .modal-body .lesson-name{font-size:13.5px}

  /* INFO */
  .info-bar{
    display:flex; flex-wrap:wrap; gap:12px 20px;
    background:rgba(17,22,40,.6); backdrop-filter:blur(8px);
    padding:12px 20px; border-radius:14px; margin-bottom:20px;
    border:1px solid var(--border); font-size:12.5px; color:var(--text2);
  }
  [data-theme="light"] .info-bar{background:rgba(255,255,255,.9)}
  .info-bar span strong{color:var(--text); font-weight:600}
  .info-bar .dot{
    display:inline-block; width:7px;height:7px; border-radius:50%;
    background:var(--green); margin-right:5px; animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* RESPONSIVE */
  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static; max-height:none}
    .sidebar .nav-list{display:flex; overflow-x:auto; gap:6px; padding-bottom:6px}
    .sidebar .nav-item{flex-shrink:0; margin-bottom:0}
    .sidebar-divider{display:none}
  }
  @media(max-width:600px){
    body{padding:12px}
    .header{padding:12px 16px; border-radius:16px}
    .logo-text{font-size:18px}
    .stats-badge{display:none}
    .subjects-grid{grid-template-columns:1fr}
    .content-head h2{font-size:16px}
    .modal-box{max-height:95vh; border-radius:18px}
  }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">W</div>
      <div class="logo-text">
        WeX Education
        <small>HSA · Toán Thầy Chí · Sử Cô Sen · SGK</small>
      </div>
    </div>
    <div class="header-right">
      <div class="stats-badge">
        <div class="badge-item"><i class="fas fa-book-open"></i><span>Bài:</span><strong id="totalLessons">0</strong></div>
        <div class="badge-item"><i class="fas fa-layer-group" style="color:#A78BFA"></i><span>Môn:</span><strong id="totalSubjects">0</strong></div>
        <div class="badge-item"><i class="fas fa-link" style="color:#34D399"></i><span>Link:</span><strong id="totalLinks">0</strong></div>
      </div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">Danh mục chính</div>
      <div class="nav-list" id="navList"></div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="toolbar">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Tìm bài học, tài liệu, BTVN...">
        </div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="all"><i class="fas fa-th-large"></i> Tất cả</button>
          <button class="view-btn" data-view="video"><i class="fas fa-play-circle"></i> Video</button>
          <button class="view-btn" data-view="tailieu"><i class="fas fa-file-alt"></i> Tài liệu</button>
          <button class="view-btn" data-view="btvn"><i class="fas fa-pen-to-square"></i> BTVN</button>

/* ============================================================
   STATE & RENDER
   ============================================================ */
let activeFilter='all', activeTab='all', searchTerm='', activeView='all';

const contentArea=document.getElementById('contentArea');
const navList=document.getElementById('navList');
const searchInput=document.getElementById('searchInput');

const ALL_SUBJECTS=[
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

function countAllLessons(){return ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0);}
function countAllLinks(){let t=0; ALL_SUBJECTS.forEach(s=>s.lessons.forEach(l=>{if(l.link)t++})); return t;}

function getFilteredLessons(sub){
  let L=sub.lessons;
  if(activeView==='video') L=L.filter(l=>l.type==='video');
  if(activeView==='tailieu') L=L.filter(l=>l.type==='tailieu');
  if(activeView==='btvn') L=L.filter(l=>l.type==='btvn');
  if(searchTerm) L=L.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return L;
}

/* NAV SIDEBAR */
function renderNav(){
  const items=[
    {id:'all',label:'Tất cả',icon:'fa-th-large',color:'',count:countAllLessons()},
    {id:'hsa',label:'HSA (MegaEdu)',icon:'fa-graduation-cap',color:'violet',count:MEGA_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0)},
    {id:'video',label:'Video bài giảng',icon:'fa-play-circle',color:'green',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='video').length,0)},
    {id:'tailieu',label:'Tài liệu',icon:'fa-file-alt',color:'amber',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='tailieu').length,0)},
    {id:'btvn',label:'BTVN',icon:'fa-pen-to-square',color:'red',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='btvn').length,0)},
  ];
  let html='';
  items.forEach(i=>{
    html+=`<div class="nav-item ${activeTab===i.id?'active':''}" data-tab="${i.id}" data-color="${i.color}">
      <i class="fas ${i.icon}"></i>
      <span>${i.label}</span>
      <span class="nav-count">${i.count}</span>
    </div>`;
  });
  html+='<div class="sidebar-divider"></div>';
  html+='<div class="sidebar-title">Giáo viên</div>';
  html+=`<div class="nav-item ${activeTab==='thaychi'?'active':''}" data-tab="thaychi" data-color="red">
    <i class="fas fa-chalkboard-teacher"></i>
    <span>Toán Thầy Chí</span>
    <span class="nav-count">${THAY_CHI.lessons.length}</span>
  </div>`;
  html+=`<div class="nav-item ${activeTab==='cosen'?'active':''}" data-tab="cosen" data-color="pink">
    <i class="fas fa-scroll"></i>
    <span>Sử Cô Hương Sen</span>
    <span class="nav-count">${CO_SEN.lessons.length}</span>
  </div>`;
  html+='<div class="sidebar-divider"></div>';
  html+='<div class="sidebar-title">Sách giáo khoa</div>';
  SGK_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i>
      <span>${s.name}</span>
      <span class="nav-count">${s.lessons.length}</span>
    </div>`;
  });
  html+='<div class="sidebar-divider"></div>';
  html+='<div class="sidebar-title">Môn học HSA</div>';
  MEGA_SUBJECTS.forEach(s=>{
    html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
      <i class="fas ${s.icon}"></i>
      <span>${s.name}</span>
      <span class="nav-count">${s.lessons.length}</span>
    </div>`;
  });
  navList.innerHTML=html;

  navList.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.tab){
        activeTab=el.dataset.tab;
        activeFilter='all';
      } else if(el.dataset.filter){
        activeFilter=el.dataset.filter;
        activeTab='all';
      }
      renderNav();
      renderContent();
    });
  });
}

/* CONTENT */
function renderContent(){
  const filtered=ALL_SUBJECTS.filter(s=>{
    if(activeTab==='thaychi') return s.group==='thaychi';
    if(activeTab==='cosen') return s.group==='cosen';
    if(activeTab==='hsa') return s.group==='hsa';
    if(activeTab==='video'||activeTab==='tailieu'||activeTab==='btvn'){
      // filter by type only
      return true;
    }
    // filter by specific subject id
    if(activeFilter!=='all') return s.id===activeFilter;
    return true;
  }).filter(s=>{
    if(!searchTerm) return true;
    const t=searchTerm.toLowerCase();
    return s.name.toLowerCase().includes(t)||s.lessons.some(l=>l.name.toLowerCase().includes(t));
  });

  // title
  let title='Tất cả nội dung', titleIcon='fa-th-large';
  if(activeTab==='thaychi'){title='Toán Thầy Chí 12'; titleIcon='fa-chalkboard-teacher';}
  else if(activeTab==='cosen'){title='Sử Cô Hương Sen'; titleIcon='fa-scroll';}
  else if(activeTab==='hsa'){title='HSA (MegaEdu)'; titleIcon='fa-graduation-cap';}
  else if(activeTab==='video'){title='Video bài giảng'; titleIcon='fa-play-circle';}
  else if(activeTab==='tailieu'){title='Tài liệu học tập'; titleIcon='fa-file-alt';}
  else if(activeTab==='btvn'){title='BTVN & Chữa BTVN'; titleIcon='fa-pen-to-square';}
  else if(activeFilter!=='all'){
    const s=ALL_SUBJECTS.find(x=>x.id===activeFilter);
    if(s){title=s.name; titleIcon=s.icon;}
  }

  let totalShown=0;
  let html=`<div class="content-head">
    <h2><i class="fas ${titleIcon}"></i> ${title}</h2>
    <div class="meta">
      <span><i class="fas fa-book"></i> <strong>${filtered.reduce((a,s)=>a+getFilteredLessons(s).length,0)}</strong> mục</span>
      <span><i class="fas fa-layer-group"></i> ${filtered.length} môn</span>
    </div>
  </div>`;

  if(filtered.length===0){
    html+=`<div class="empty-state"><i class="fas fa-folder-open"></i>Chưa có nội dung trong mục này.</div>`;
    contentArea.innerHTML=html;
    return;
  }

  html+='<div class="subjects-grid">';
  filtered.forEach(sub=>{
    const lessons=getFilteredLessons(sub);
    if(lessons.length===0) return;
    const color=sub.color||'';
    const total=sub.lessons.length, shown=lessons.length;
    const videoCount=sub.lessons.filter(l=>l.type==='video').length;
    const tlCount=sub.lessons.filter(l=>l.type==='tailieu').length;
    const btCount=sub.lessons.filter(l=>l.type==='btvn').length;

    const displayLessons = lessons.slice(0, 6);
    let li='';
    if(lessons.length===0){
      li='<li style="padding:12px 8px;color:var(--muted);font-size:12px">Không có nội dung.</li>';
    } else {
      li=displayLessons.map((l,idx)=>{
        const gi=sub.lessons.indexOf(l)+1;
        let typeLabel='', typeClass='';
        if(l.type==='tailieu'){typeLabel='Tài liệu'; typeClass='tailieu';}
        else if(l.type==='btvn'){typeLabel='BTVN'; typeClass='btvn';}
        else {typeLabel='Video'; typeClass='video';}
        return `<li class="lesson-item" onclick="window.open('${l.link}','_blank')">
          <span class="lesson-idx">${gi}.</span>
          <div class="lesson-body">
            <span class="lesson-name">${l.name}</span>
            <div class="lesson-meta">
              <span class="lesson-type ${typeClass}">${typeLabel}</span>
              <span>${l.date}</span>
            </div>
          </div>
          <i class="fas fa-arrow-right lesson-arrow"></i>
        </li>`;
      }).join('');
      if(lessons.length>6){
        li+=`<li style="padding:10px;text-align:center;color:var(--primary);font-size:11.5px;cursor:pointer;font-weight:600" onclick="event.stopPropagation();openExpand('${sub.id}')">+ Xem thêm ${lessons.length-6} mục...</li>`;
      }
    }

    const isHSA=sub.group==='hsa';

    html+=`<div class="subject-card" data-color="${color}">
      <div class="card-header">
        <div class="subject-icon ${color}"><i class="fas ${sub.icon}"></i></div>
        <div class="subject-title">
          <h3>${sub.name} ${isHSA?'<span class="hsa-badge">HSA</span>':''}</h3>
          <div class="desc">${sub.desc||''}</div>
        </div>
        <div class="card-actions">
          <button class="icon-btn expand" title="Phóng to" onclick="openExpand('${sub.id}')"><i class="fas fa-expand-alt"></i></button>
        </div>
      </div>
      <ul class="lesson-list">${li}</ul>
      <div class="card-footer">
        <div class="count">
          <i class="fas fa-play-circle"></i> ${videoCount} video
          ${tlCount?`· <i class="fas fa-file-alt"></i> ${tlCount} TL`:''}
          ${btCount?`· <i class="fas fa-pen"></i> ${btCount} BTVN`:''}
        </div>
        <button class="btn-ghost" onclick="window.open('${sub.lessons[0]?.link||'#'}','_blank')"><i class="fas fa-play"></i> Bắt đầu</button>
      </div>
    </div>`;
    totalShown+=shown;
  });
  html+='</div>';

  contentArea.innerHTML=html;
}

/* MODAL EXPAND */
function openExpand(subId){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  document.getElementById('modalIcon').className=`subject-icon ${sub.color||''}`;
  document.getElementById('modalIcon').innerHTML=`<i class="fas ${sub.icon}"></i>`;
  document.getElementById('modalTitle').innerHTML=`${sub.name} ${sub.group==='hsa'?'<span class="hsa-badge">HSA</span>':''}<span class="desc">${sub.desc||''} · ${lessons.length} mục</span>`;
  let body='<ul class="lesson-list" style="max-height:none">';
  lessons.forEach((l,idx)=>{
    const gi=sub.lessons.indexOf(l)+1;
    let typeLabel='', typeClass='';
    if(l.type==='tailieu'){typeLabel='Tài liệu'; typeClass='tailieu';}
    else if(l.type==='btvn'){typeLabel='BTVN'; typeClass='btvn';}
    else {typeLabel='Video'; typeClass='video';}
    body+=`<li class="lesson-item" onclick="window.open('${l.link}','_blank')">
      <span class="lesson-idx">${gi}.</span>
      <div class="lesson-body">
        <span class="lesson-name">${l.name}</span>
        <div class="lesson-meta">
          <span class="lesson-type ${typeClass}">${typeLabel}</span>
          <span>${l.date}</span>
        </div>
      </div>
      <i class="fas fa-arrow-right lesson-arrow"></i>
    </li>`;
  });
  body+='</ul>';
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('expandModal').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeExpand(){
  document.getElementById('expandModal').classList.remove('active');
  document.body.style.overflow='';
}
document.getElementById('expandModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeExpand()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeExpand()});

/* VIEW TOGGLE */
document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab=btn.dataset.view;
    renderNav();
    renderContent();
  });
});

function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='light'?'dark':'light';
  h.setAttribute('data-theme',next);
  document.getElementById('themeBtn').innerHTML=next==='light'?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
  localStorage.setItem('theme',next);
}

function init(){
  const saved=localStorage.getItem('theme');
  if(saved==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.getElementById('themeBtn').innerHTML='<i class="fas fa-sun"></i>';
  }
  updateStats();
  renderNav();
  renderContent();

  searchInput.addEventListener('input',e=>{
    searchTerm=e.target.value;
    renderContent();
  });
}

init();
</script>
</body>
</html>
