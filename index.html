<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>WeX Study · Học trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#0b0d14;
  --bg-2:#12141c;
  --bg-3:#1a1d28;
  --bg-4:#222633;
  --hover:#2a2f3f;
  --fg:#f0f2f8;
  --fg-2:#b8bcc8;
  --fg-3:#7a7f8f;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --green:#10b981;
  --amber:#f59e0b;
  --red:#ef4444;
  --pink:#ec4899;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);
  --header-h:60px;
  --sidebar-w:260px;
  --radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font:14px/1.5 'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--fg);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3f4f;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#4a5060}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input{font-family:inherit;outline:none;border:none;background:none}
img{display:block;max-width:100%}

/* ============ HEADER ============ */
.header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:var(--header-h);
  background:rgba(11,13,20,.85);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
  padding:0 16px;
}
.ham{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-2); font-size:18px;
  transition:all .18s;
}
.ham:hover{background:var(--hover);color:var(--fg)}

.logo{display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0; user-select:none}
.logo-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:800; font-size:18px;
  box-shadow:0 4px 16px rgba(99,102,241,.4);
  position:relative; overflow:hidden;
}
.logo-mark::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 60%);
}
.logo-text{display:flex; flex-direction:column; line-height:1}
.logo-text .t{font-weight:800; font-size:17px; letter-spacing:-.02em}
.logo-text .t span{background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-text .s{font-size:10.5px; color:var(--fg-3); font-weight:500; margin-top:2px; letter-spacing:.3px}

.search-wrap{flex:1; max-width:640px; margin:0 auto; position:relative; display:flex}
.search-input{
  width:100%; height:42px;
  padding:0 16px 0 44px;
  background:var(--bg-3);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14px; color:var(--fg);
  transition:all .2s;
}
.search-input::placeholder{color:var(--fg-3)}
.search-input:focus{border-color:var(--accent); background:var(--bg-2); box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.search-wrap .s-icon{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--fg-3); font-size:14px; pointer-events:none;
}
.search-clear{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  display:none; align-items:center; justify-content:center;
  color:var(--fg-3); font-size:12px;
  background:var(--hover);
}
.search-clear.show{display:flex}
.search-clear:hover{color:var(--fg)}

.header-right{display:flex; align-items:center; gap:6px; flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-2); font-size:16px; transition:all .18s;
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

@media(max-width:800px){
  .header{padding:0 10px; gap:8px}
  .logo-text .s{display:none}
  .logo-text .t{font-size:15px}
  .logo-mark{width:34px;height:34px;font-size:16px}
  .search-wrap{display:none}
}

/* ============ LAYOUT ============ */
.app{
  display:flex;
  width:100%;height:100vh;
  padding-top:var(--header-h);
}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto; overflow-x:hidden;
  background:var(--bg-2);
  border-right:1px solid var(--border);
  padding:14px 10px 40px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar::-webkit-scrollbar{width:5px}

.sb-title{
  font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; color:var(--fg-3);
  padding:0 12px; margin:18px 0 8px;
}
.sb-title:first-child{margin-top:4px}

.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:10px;
  font-size:13.5px; color:var(--fg-2); font-weight:500;
  cursor:pointer; margin-bottom:2px;
  transition:all .18s;
  white-space:nowrap; overflow:hidden;
}
.nav-item:hover{background:var(--hover); color:var(--fg)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.12));
  color:var(--fg); font-weight:600;
  border:1px solid rgba(99,102,241,.25);
}
.nav-item > i:first-child{
  width:20px; height:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0;
  color:var(--fg-3);
}
.nav-item.active > i:first-child{color:var(--accent)}
.nav-item[data-color="violet"] > i:first-child{color:var(--accent-2)}
.nav-item[data-color="green"] > i:first-child{color:var(--green)}
.nav-item[data-color="amber"] > i:first-child{color:var(--amber)}
.nav-item[data-color="red"] > i:first-child{color:var(--red)}
.nav-item[data-color="pink"] > i:first-child{color:var(--pink)}
.nav-item .nav-count{
  margin-left:auto; font-size:10.5px; font-weight:600;
  background:var(--bg-4);
  color:var(--fg-3);
  padding:2px 8px; border-radius:20px;
  min-width:28px; text-align:center;
}
.nav-item.active .nav-count{background:var(--accent); color:#fff}
.sidebar-divider{
  height:1px; margin:14px 12px;
  background:var(--border);
}

/* MAIN */
.main{
  flex:1; min-width:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:20px 24px 80px;
  background:var(--bg);
}

/* ============ TOOLBAR / CHIPS ============ */
.toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin-bottom:20px;
}
.chip{
  padding:8px 16px; border-radius:20px;
  background:var(--bg-3); color:var(--fg-2);
  font-size:13px; font-weight:500;
  cursor:pointer; transition:all .18s;
  white-space:nowrap; border:1px solid var(--border);
  display:flex; align-items:center; gap:7px;
}
.chip:hover{background:var(--hover); color:var(--fg); border-color:var(--border-2)}
.chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; border-color:transparent;
  box-shadow:0 4px 14px rgba(99,102,241,.35);
}
.chip i{font-size:12px}

/* ============ INFO BAR ============ */
.info-bar{
  display:flex; flex-wrap:wrap; gap:10px 18px;
  background:var(--bg-2);
  border:1px solid var(--border);
  padding:12px 18px; border-radius:12px; margin-bottom:20px;
  font-size:12.5px; color:var(--fg-2);
}
.info-bar strong{color:var(--fg); font-weight:600}
.info-bar .dot{
  display:inline-block; width:7px;height:7px; border-radius:50%;
  background:var(--green); margin-right:6px;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============ CONTENT HEAD ============ */
.content-head{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin-bottom:18px; gap:12px;
}
.content-head h2{
  font-size:20px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; gap:10px;
}
.content-head h2 i{color:var(--accent)}
.content-head .meta{
  font-size:13px; color:var(--fg-3);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.content-head .meta i{color:var(--fg-3); font-size:11px}

/* ============ VIDEO GRID ============ */
.subjects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:24px 18px;
}
@media(max-width:900px){
  .subjects-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 12px}
}
@media(max-width:600px){
  .subjects-grid{grid-template-columns:1fr;gap:16px}
}

.subject-card{
  cursor:pointer;
  transition:transform .18s;
  display:flex; flex-direction:column;
  animation:fadeUp .3s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.subject-card:active{transform:scale(.98)}

.thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--bg-3);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
}
.thumb-wrap img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .35s;
}
.subject-card:hover .thumb-wrap img{transform:scale(1.06)}

/* Fallback khi không có thumbnail */
.thumb-fallback{
  position:relative;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;text-align:center;gap:10px;
  color:#fff;
}
.thumb-fallback::before{
  content:''; position:absolute; inset:0;
  background:var(--thumb-grad,linear-gradient(135deg,#6366f1,#8b5cf6));
  opacity:.92;
}
.thumb-fallback::after{
  content:''; position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.12) 0, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.08) 0, transparent 50%);
}
.thumb-fallback > *{position:relative;z-index:1}
.thumb-fallback .tf-icon{
  font-size:40px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}
.thumb-fallback .tf-cat{
  font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.2px;
  padding:3px 10px;border-radius:20px;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(4px);
}
.thumb-fallback .tf-title{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* Badge */
.thumb-badge{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:4px 10px;border-radius:7px;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:4px;
  color:#fff;
  backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.thumb-badge.video{background:rgba(239,68,68,.92)}
.thumb-badge.tailieu{background:rgba(16,185,129,.92)}
.thumb-badge.btvn{background:rgba(245,158,11,.95);color:#1a1a1a}

.thumb-count{
  position:absolute;bottom:10px;right:10px;z-index:2;
  padding:4px 10px;border-radius:6px;
  background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:600;
  backdrop-filter:blur(8px);
}

.play-overlay{
  position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5));
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s;
}
.subject-card:hover .play-overlay{opacity:1}
.play-overlay svg{
  width:56px;height:56px;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));
}

/* Info */
.subject-info{
  display:flex; gap:12px; margin-top:12px;
}
.avatar{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.subject-title{flex:1; min-width:0}
.subject-title h3{
  font-weight:600; font-size:14.5px; line-height:1.4;
  color:var(--fg); margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.subject-title .desc{
  font-size:12.5px;color:var(--fg-3);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.subject-title .desc .dot{opacity:.5;margin:0 4px}
.subject-title .meta-lite{
  display:inline-flex;align-items:center;gap:4px;
}

.empty-state{
  text-align:center; padding:80px 20px; color:var(--fg-3);
  font-size:14px; grid-column:1/-1;
}
.empty-state i{font-size:48px; margin-bottom:16px; display:block; opacity:.3}

/* ============ PLAYER PAGE ============ */
.player-page{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:200;
  display:none;
  overflow:hidden;
}
.player-page.active{display:flex}

.pp-layout{
  display:flex;
  width:100%;height:100%;
  padding-top:var(--header-h);
}

/* Cột trái: player + info */
.pp-main{
  flex:1;min-width:0;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:24px 24px 40px;
}
.pp-player-box{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  aspect-ratio:16/9;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.pp-player-box iframe,
.pp-player-box video{
  width:100%;height:100%;display:block;border:none;background:#000;
}

.pp-info{max-width:1100px;margin:16px auto 0}
.pp-info h1{
  font-size:19px;font-weight:700;line-height:1.4;
  margin-bottom:12px;
}
.pp-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-size:13px;color:var(--fg-2);margin-bottom:16px;
}
.pp-meta .chip-sm{
  background:var(--bg-3);
  padding:5px 12px;border-radius:16px;
  font-size:12px;font-weight:500;
  border:1px solid var(--border);
}

.pp-actions{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
}
.pp-btn{
  display:flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:22px;
  background:var(--bg-3);color:var(--fg);
  font-size:13px;font-weight:500;
  border:1px solid var(--border);
  transition:all .18s;
}
.pp-btn:hover{background:var(--hover); border-color:var(--border-2); transform:translateY(-1px)}
.pp-btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; border-color:transparent;
  box-shadow:0 4px 14px rgba(99,102,241,.35);
}
.pp-btn.primary:hover{box-shadow:0 6px 20px rgba(99,102,241,.5)}

.pp-desc{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  font-size:13.5px;color:var(--fg-2);
  line-height:1.6;
}
.pp-desc strong{color:var(--fg)}

/* Cột phải: playlist */
.pp-side{
  width:400px;flex-shrink:0;
  height:calc(100vh - var(--header-h));
  background:var(--bg-2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}
.pp-side-head{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.pp-side-head .ico{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,.3);
}
.pp-side-head .txt{flex:1;min-width:0}
.pp-side-head .txt .t{
  font-size:14px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pp-side-head .txt .s{font-size:11.5px;color:var(--fg-3);margin-top:2px}

.pp-playlist{
  flex:1;overflow-y:auto;
  padding:6px 0 40px;
}
.pp-item{
  display:flex;gap:10px;padding:9px 12px;
  cursor:pointer;transition:background .15s;
  position:relative;
}
.pp-item:hover{background:var(--hover)}
.pp-item.active{background:var(--bg-3)}
.pp-item.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;background:var(--accent);border-radius:0 3px 3px 0;
}
.pp-item .pp-n{
  width:24px;flex-shrink:0;text-align:center;
  font-size:12px;color:var(--fg-3);padding-top:4px;
  font-weight:600;
}
.pp-item.active .pp-n{color:var(--accent)}
.pp-item .pp-body{flex:1;min-width:0}
.pp-item .pp-name{
  font-size:13px;line-height:1.4;color:var(--fg-2);
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px;
}
.pp-item.active .pp-name{color:var(--fg);font-weight:600}
.pp-item .pp-date{
  font-size:11px;color:var(--fg-3);
}

.pp-close{
  width:38px;height:38px;border-radius:10px;
  background:var(--bg-3);
  color:var(--fg-2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.pp-close:hover{background:var(--red);color:#fff}

/* ============ MOBILE ============ */
@media(max-width:900px){
  .sidebar{
    position:fixed; top:var(--header-h); left:0; bottom:0;
    width:280px; z-index:95;
    background:var(--bg-2);
    transform:translateX(-100%);
    box-shadow:8px 0 32px rgba(0,0,0,.6);
    height:calc(100vh - var(--header-h));
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{
    position:fixed; inset:0; top:var(--header-h);
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    z-index:85; display:none;
    animation:fadeIn .2s;
  }
  .sidebar-backdrop.show{display:block}

  .main{padding:14px 12px 60px}

  .toolbar{
    overflow-x:auto; scrollbar-width:none;
    margin:0 -12px 16px; padding:0 12px 6px;
    flex-wrap:nowrap;
  }
  .toolbar::-webkit-scrollbar{display:none}

  .info-bar{font-size:11.5px;padding:10px 14px;gap:8px 12px;margin-bottom:14px}
  .info-bar span:nth-child(4){display:none}

  .content-head h2{font-size:17px}
  .content-head .meta{font-size:12px}

  /* Player mobile: xếp dọc, player bên trên */
  .player-page{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .pp-layout{
    flex-direction:column;
    height:auto;
    min-height:100vh;
    padding-top:var(--header-h);
  }

  .pp-main{
    height:auto;
    padding:0 0 16px;
    overflow:visible;
  }
  .pp-player-box{
    border-radius:0;
    max-width:100%;
    box-shadow:none;
    /* Giữ 16:9 nhưng cho phép user pinch zoom */
    touch-action:pinch-zoom;
  }
  .pp-player-box iframe{
    touch-action:pan-x pan-y pinch-zoom;
  }
  .pp-info{padding:0 14px}
  .pp-info h1{font-size:16px;margin-bottom:10px}

  .pp-actions{
    overflow-x:auto; scrollbar-width:none;
    margin:0 -14px 14px; padding:0 14px 4px;
    flex-wrap:nowrap;
  }
  .pp-actions::-webkit-scrollbar{display:none}
  .pp-btn{flex-shrink:0}

  .pp-side{
    width:100%;
    height:auto;
    border-left:none;
    border-top:1px solid var(--border);
    max-height:none;
  }
  .pp-playlist{max-height:none}
}
@media(max-width:600px){
  .header{padding:0 8px}
  .ham,.icon-btn{width:36px;height:36px;font-size:16px}
  .logo-text .t{font-size:14px}
  .logo-mark{width:32px;height:32px;font-size:15px}

  .content-head h2{font-size:16px}
  .subject-title h3{font-size:14px}
  .subject-title .desc{font-size:12px}
  .avatar{width:34px;height:34px;font-size:14px}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="header">
  <button class="ham" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="logo" onclick="goHome()">
    <div class="logo-mark">W</div>
    <div class="logo-text">
      <div class="t">WeX <span>Study</span></div>
      <div class="s">Học trực tuyến</div>
    </div>
  </div>

  <div class="search-wrap">
    <i class="fas fa-search s-icon"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Tìm bài học, tài liệu, BTVN...">
    <button class="search-clear" id="searchClear" onclick="clearSearch()"><i class="fas fa-times"></i></button>
  </div>

  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()" title="Đổi giao diện"><i class="fas fa-moon" id="themeIcon"></i></button>
    <button class="icon-btn" onclick="scrollToTop()" title="Lên đầu trang"><i class="fas fa-arrow-up"></i></button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<!-- ============ APP ============ -->
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div id="navList"></div>
  </aside>
  <main class="main" id="mainArea">
    <div class="toolbar">
      <button class="chip active" data-view="all"><i class="fas fa-th-large"></i> Tất cả</button>
      <button class="chip" data-view="video"><i class="fas fa-play-circle"></i> Video</button>
      <button class="chip" data-view="tailieu"><i class="fas fa-file-alt"></i> Tài liệu</button>
      <button class="chip" data-view="btvn"><i class="fas fa-pen-to-square"></i> BTVN</button>
      <button class="chip" data-view="toan"><i class="fas fa-calculator"></i> Toán</button>
      <button class="chip" data-view="van"><i class="fas fa-feather-alt"></i> Văn</button>
      <button class="chip" data-view="anh"><i class="fas fa-language"></i> Anh</button>
    </div>
    <div class="info-bar">
      <span><span class="dot"></span> <strong>Live</strong> · cập nhật 16/09/2026</span>
      <span>📚 <strong id="infoLessons">0</strong> mục</span>
      <span>🎓 <strong id="infoSubjects">0</strong> môn</span>
      <span>🔗 <strong id="infoLinks">0</strong> link</span>
    </div>
    <div id="contentArea"></div>
  </main>
</div>

<!-- ============ PLAYER PAGE ============ -->
<div class="player-page" id="playerPage">
  <div class="pp-layout">
    <div class="pp-main">
      <div class="pp-player-box" id="playerBox"></div>
      <div class="pp-info">
        <h1 id="ppTitle">—</h1>
        <div class="pp-meta" id="ppMeta"></div>
        <div class="pp-actions">
          <button class="pp-btn primary" onclick="openExternal()"><i class="fas fa-external-link-alt"></i> Mở tab mới</button>
          <button class="pp-btn" onclick="copyLink()"><i class="fas fa-link"></i> Copy link</button>
          <button class="pp-btn" onclick="fullscreenPlayer()"><i class="fas fa-expand"></i> Toàn màn hình</button>
          <button class="pp-btn" onclick="closePlayer()"><i class="fas fa-times"></i> Đóng</button>
        </div>
        <div class="pp-desc" id="ppDesc"></div>
      </div>
    </div>
    <div class="pp-side">
      <div class="pp-side-head">
        <div class="ico"><i class="fas fa-list"></i></div>
        <div class="txt">
          <div class="t" id="ppSideTitle">—</div>
          <div class="s" id="ppSideSub">—</div>
        </div>
        <button class="pp-close" onclick="closePlayer()"><i class="fas fa-times"></i></button>
      </div>
      <div class="pp-playlist" id="ppPlaylist"></div>
    </div>
  </div>
</div>

<script src="data2.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let activeFilter='all', activeTab='all', searchTerm='', activeView='all';
let currentLesson = null;
let currentLessonIdx = -1;
let currentSubId = null;

const contentArea=document.getElementById('contentArea');
const navList=document.getElementById('navList');
const searchInput=document.getElementById('searchInput');
const searchClear=document.getElementById('searchClear');

/* Fallback data nếu data2.js chưa load */
if(typeof MEGA_SUBJECTS === 'undefined'){
  console.warn('data2.js chưa load — đang dùng fallback');
  window.MEGA_SUBJECTS = [];
  window.SGK_SUBJECTS = [];
  window.THAY_CHI = {id:'thay_chi',name:'TOÁN THẦY CHÍ',desc:'',icon:'fa-chalkboard-teacher',color:'red',lessons:[]};
  window.CO_SEN = {id:'co_sen',name:'SỬ CÔ HƯƠNG SEN',desc:'',icon:'fa-scroll',color:'pink',lessons:[]};
}

const ALL_SUBJECTS=[
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

/* ============================================================
   HELPERS
   ============================================================ */
function getYouTubeId(url){
  if(!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytThumb(url, quality='max'){
  const id = getYouTubeId(url);
  if(!id) return null;
  return `https://i.ytimg.com/vi/${id}/${quality}resdefault.jpg`;
}
function isYouTube(url){ return url && !!getYouTubeId(url); }
function isHls(url){ return url && String(url).includes('.m3u8'); }
function isDriveFolder(url){ return url && String(url).includes('drive.google.com/drive/folders'); }
function isDriveFile(url){ return url && String(url).includes('drive.google.com/file/d/'); }

function colorGrad(c){
  const map = {
    green:'linear-gradient(135deg,#10b981,#059669)',
    violet:'linear-gradient(135deg,#8b5cf6,#7c3aed)',
    amber:'linear-gradient(135deg,#f59e0b,#d97706)',
    red:'linear-gradient(135deg,#ef4444,#dc2626)',
    pink:'linear-gradient(135deg,#ec4899,#db2777)'
  };
  return map[c] || 'linear-gradient(135deg,#6366f1,#8b5cf6)';
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function countAllLessons(){return ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0);}
function countAllLinks(){let t=0; ALL_SUBJECTS.forEach(s=>s.lessons.forEach(l=>{if(l.link)t++})); return t;}

function getFilteredLessons(sub){
  let L=sub.lessons;
  if(activeView==='video') L=L.filter(l=>l.type==='video');
  if(activeView==='tailieu') L=L.filter(l=>l.type==='tailieu');
  if(activeView==='btvn') L=L.filter(l=>l.type==='btvn');
  if(activeView==='toan') L=L.filter(()=>/toán/i.test(sub.name));
  if(activeView==='van') L=L.filter(()=>/văn/i.test(sub.name));
  if(activeView==='anh') L=L.filter(()=>/anh|tiếng anh/i.test(sub.name));
  if(searchTerm) L=L.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return L;
}

/* ============================================================
   NAV SIDEBAR
   ============================================================ */
function renderNav(){
  const items=[
    {id:'all',label:'Trang chủ',icon:'fa-home',color:'',count:countAllLessons()},
    {id:'video',label:'Video bài giảng',icon:'fa-play-circle',color:'red',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='video').length,0)},
    {id:'tailieu',label:'Tài liệu',icon:'fa-file-alt',color:'green',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='tailieu').length,0)},
    {id:'btvn',label:'BTVN',icon:'fa-pen-to-square',color:'amber',count:ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.filter(l=>l.type==='btvn').length,0)},
  ];
  let html='';
  items.forEach(i=>{
    html+=`<div class="nav-item ${activeTab===i.id?'active':''}" data-tab="${i.id}" data-color="${i.color}">
      <i class="fas ${i.icon}"></i><span>${i.label}</span><span class="nav-count">${i.count}</span>
    </div>`;
  });
  html+='<div class="sidebar-divider"></div><div class="sb-title">Giáo viên</div>';
  html+=`<div class="nav-item ${activeTab==='thaychi'?'active':''}" data-tab="thaychi" data-color="red">
    <i class="fas fa-chalkboard-teacher"></i><span>Toán Thầy Chí</span><span class="nav-count">${THAY_CHI.lessons.length}</span></div>`;
  html+=`<div class="nav-item ${activeTab==='cosen'?'active':''}" data-tab="cosen" data-color="pink">
    <i class="fas fa-scroll"></i><span>Sử Cô Hương Sen</span><span class="nav-count">${CO_SEN.lessons.length}</span></div>`;

  if(SGK_SUBJECTS.length){
    html+='<div class="sidebar-divider"></div><div class="sb-title">Sách giáo khoa</div>';
    SGK_SUBJECTS.forEach(s=>{
      html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
        <i class="fas ${s.icon}"></i><span>${escapeHtml(s.name)}</span><span class="nav-count">${s.lessons.length}</span></div>`;
    });
  }
  if(MEGA_SUBJECTS.length){
    html+='<div class="sidebar-divider"></div><div class="sb-title">Môn học HSA</div>';
    MEGA_SUBJECTS.forEach(s=>{
      html+=`<div class="nav-item ${activeFilter===s.id?'active':''}" data-filter="${s.id}" data-color="${s.color}">
        <i class="fas ${s.icon}"></i><span>${escapeHtml(s.name)}</span><span class="nav-count">${s.lessons.length}</span></div>`;
    });
  }
  navList.innerHTML=html;

  navList.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.tab){
        activeTab=el.dataset.tab;
        activeFilter='all';
        activeView=el.dataset.tab;
        document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.view===el.dataset.tab));
      } else if(el.dataset.filter){
        activeFilter=el.dataset.filter;
        activeTab='all';
      }
      renderNav();
      renderContent();
      if(window.innerWidth<=900) closeSidebar();
    });
  });
}

/* ============================================================
   RENDER CONTENT
   ============================================================ */
function renderContent(){
  const filtered=ALL_SUBJECTS.filter(s=>{
    if(activeTab==='thaychi') return s.group==='thaychi';
    if(activeTab==='cosen') return s.group==='cosen';
    if(activeTab==='hsa') return s.group==='hsa';
    if(['video','tailieu','btvn','toan','van','anh'].includes(activeTab)) return true;
    if(activeFilter!=='all') return s.id===activeFilter;
    return true;
  }).filter(s=>{
    if(!searchTerm) return true;
    const t=searchTerm.toLowerCase();
    return s.name.toLowerCase().includes(t)||s.lessons.some(l=>l.name.toLowerCase().includes(t));
  });

  let title='Trang chủ', titleIcon='fa-home';
  if(activeTab==='thaychi'){title='Toán Thầy Chí 12'; titleIcon='fa-chalkboard-teacher';}
  else if(activeTab==='cosen'){title='Sử Cô Hương Sen'; titleIcon='fa-scroll';}
  else if(activeTab==='hsa'){title='HSA (MegaEdu)'; titleIcon='fa-graduation-cap';}
  else if(activeTab==='video'){title='Video bài giảng'; titleIcon='fa-play-circle';}
  else if(activeTab==='tailieu'){title='Tài liệu học tập'; titleIcon='fa-file-alt';}
  else if(activeTab==='btvn'){title='BTVN & Chữa BTVN'; titleIcon='fa-pen-to-square';}
  else if(activeFilter!=='all'){
    const s=ALL_SUBJECTS.find(x=>x.id===activeFilter);
    if(s){title=s.name; titleIcon=s.icon;}
  }

  let totalShown = 0;
  filtered.forEach(s => totalShown += getFilteredLessons(s).length);

  let html=`<div class="content-head">
    <h2><i class="fas ${titleIcon}"></i> ${escapeHtml(title)}</h2>
    <div class="meta">
      <span><i class="fas fa-book"></i> <strong>${totalShown}</strong> mục</span>
      <span><i class="fas fa-layer-group"></i> ${filtered.length} môn</span>
    </div>
  </div>`;

  if(filtered.length===0 || totalShown===0){
    html+=`<div class="empty-state"><i class="fas fa-folder-open"></i>Chưa có nội dung trong mục này.</div>`;
    contentArea.innerHTML=html;
    return;
  }

  html+='<div class="subjects-grid">';
  filtered.forEach(sub=>{
    const lessons=getFilteredLessons(sub);
    if(lessons.length===0) return;
    const color=sub.color||'';
    const firstLesson=lessons[0];

    const ytThumbUrl = ytThumb(firstLesson.link);
    let thumbContent;
    if(ytThumbUrl){
      thumbContent = `
        <img src="${ytThumbUrl}" onerror="this.onerror=null;this.src='${ytThumb(firstLesson.link,'hq')||''}'" alt="" loading="lazy">
        <div class="play-overlay">
          <svg viewBox="0 0 24 24" fill="#fff">
            <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.55)" stroke="#fff" stroke-width="1.5"/>
            <path d="M10 8l6 4-6 4V8z" fill="#fff"/>
          </svg>
        </div>`;
    } else {
      const iconMap = {tailieu:'📄', btvn:'📝', video:'🎬'};
      thumbContent = `
        <div class="thumb-fallback" style="--thumb-grad:${colorGrad(color)}">
          <div class="tf-icon">${iconMap[firstLesson.type]||'🎬'}</div>
          <div class="tf-cat">${escapeHtml(sub.name)}</div>
          <div class="tf-title">${escapeHtml(firstLesson.name)}</div>
        </div>`;
    }

    const typeLabel = firstLesson.type==='tailieu'?'Tài liệu':firstLesson.type==='btvn'?'BTVN':'Video';
    const typeIcon = firstLesson.type==='video'?'fa-play':firstLesson.type==='tailieu'?'fa-file-alt':'fa-pen';

    html+=`<div class="subject-card" onclick="openPlayer('${sub.id}')">
      <div class="thumb-wrap">
        ${thumbContent}
        <div class="thumb-badge ${firstLesson.type}"><i class="fas ${typeIcon}"></i> ${typeLabel}</div>
        <div class="thumb-count">${lessons.length} mục</div>
      </div>
      <div class="subject-info">
        <div class="avatar" style="background:${colorGrad(color)}">${escapeHtml(sub.name.charAt(0))}</div>
        <div class="subject-title">
          <h3>${escapeHtml(sub.name)}</h3>
          <div class="desc">
            ${escapeHtml(sub.desc||'')}
            <br>
            <span class="meta-lite"><i class="fas fa-play-circle"></i> ${sub.lessons.filter(l=>l.type==='video').length} video</span>
            ${sub.lessons.filter(l=>l.type==='tailieu').length ? `<span class="dot">•</span><span class="meta-lite"><i class="fas fa-file-alt"></i> ${sub.lessons.filter(l=>l.type==='tailieu').length} tài liệu</span>` : ''}
            ${sub.lessons.filter(l=>l.type==='btvn').length ? `<span class="dot">•</span><span class="meta-lite"><i class="fas fa-pen"></i> ${sub.lessons.filter(l=>l.type==='btvn').length} BTVN</span>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  });
  html+='</div>';

  contentArea.innerHTML=html;
}

/* ============================================================
   PLAYER PAGE
   ============================================================ */
function openPlayer(subId){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  if(lessons.length===0) return;

  currentSubId = subId;

  document.getElementById('ppSideTitle').textContent = sub.name;
  document.getElementById('ppSideSub').textContent = `${lessons.length} mục · ${sub.desc||''}`;

  let listHtml='';
  lessons.forEach((l, i)=>{
    const isActive = i===0;
    listHtml+=`<div class="pp-item ${isActive?'active':''}" data-idx="${i}" onclick="playLesson('${subId}', ${i})">
      <div class="pp-n">${isActive?'▶':(i+1)}</div>
      <div class="pp-body">
        <div class="pp-name">${escapeHtml(l.name)}</div>
        <div class="pp-date">${escapeHtml(l.date||'')}</div>
      </div>
    </div>`;
  });
  document.getElementById('ppPlaylist').innerHTML = listHtml;

  playLesson(subId, 0);

  document.getElementById('playerPage').classList.add('active');
  document.body.style.overflow = 'hidden';

  // Cleanup HLS cũ
  if(window._hlsInstance){ try{window._hlsInstance.destroy();}catch(e){} window._hlsInstance=null; }
}

function playLesson(subId, lessonIdx){
  const sub=ALL_SUBJECTS.find(s=>s.id===subId);
  if(!sub) return;
  const lessons=getFilteredLessons(sub);
  const l = lessons[lessonIdx];
  if(!l) return;

  currentLesson = l;
  currentLessonIdx = lessonIdx;

  document.querySelectorAll('.pp-item').forEach((el, i)=>{
    el.classList.toggle('active', i===lessonIdx);
    const n = el.querySelector('.pp-n');
    if(n) n.textContent = i===lessonIdx ? '▶' : (i+1);
  });

  document.getElementById('ppTitle').textContent = l.name;
  document.getElementById('ppMeta').innerHTML = `
    <span class="chip-sm">${escapeHtml(sub.name)}</span>
    <span class="chip-sm">${escapeHtml(l.date||'Học liệu')}</span>
    <span class="chip-sm">${l.type==='video'?'Video':l.type==='tailieu'?'Tài liệu':'BTVN'}</span>
  `;
  document.getElementById('ppDesc').innerHTML = `
    <strong>${escapeHtml(l.name)}</strong><br>
    Khóa học: ${escapeHtml(sub.name)} · ${escapeHtml(sub.desc||'')}
  `;

  const box = document.getElementById('playerBox');

  // Cleanup HLS cũ
  if(window._hlsInstance){ try{window._hlsInstance.destroy();}catch(e){} window._hlsInstance=null; }

  if(!l.link){
    box.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;background:#000;gap:14px;text-align:center;padding:20px">
      <div style="font-size:56px;opacity:.6">📄</div>
      <div style="font-size:16px;font-weight:600">Bài này không có video</div>
      <div style="color:#94a3b8;font-size:13px">Vui lòng chọn bài khác trong danh sách bên phải</div>
    </div>`;
  } else if(isYouTube(l.link)){
    const id = getYouTubeId(l.link);
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  } else if(isHls(l.link)){
    box.innerHTML = `<video id="hlsVideo" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
    const v = document.getElementById('hlsVideo');
    if(window.Hls && Hls.isSupported()){
      const hls = new Hls({enableWorker:true, lowLatencyMode:false});
      hls.loadSource(l.link);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>v.play().catch(()=>{}));
      window._hlsInstance = hls;
    } else {
      v.src = l.link;
    }
  } else if(isDriveFolder(l.link)){
    box.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;background:#000;gap:14px;text-align:center;padding:20px">
      <div style="font-size:64px">📁</div>
      <div style="font-size:16px;font-weight:600">Thư mục tài liệu trên Google Drive</div>
      <a href="${l.link}" target="_blank" rel="noopener" style="margin-top:8px;padding:10px 22px;border-radius:10px;background:#10b981;color:#fff;font-weight:600;font-size:14px;text-decoration:none">📁 Mở thư mục Drive</a>
    </div>`;
  } else if(isDriveFile(l.link)){
    const m = l.link.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
    if(m){
      box.innerHTML = `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    } else {
      box.innerHTML = `<video src="${l.link}" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
    }
  } else {
    box.innerHTML = `<video src="${l.link}" controls playsinline autoplay preload="auto" style="width:100%;height:100%;background:#000"></video>`;
  }

  // Scroll top
  const ppMain = document.querySelector('.pp-main');
  if(ppMain) ppMain.scrollTop = 0;
}

function closePlayer(){
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('playerBox').innerHTML = '';
  document.body.style.overflow = '';
  currentLesson = null;
  if(window._hlsInstance){ try{window._hlsInstance.destroy();}catch(e){} window._hlsInstance=null; }
}
function openExternal(){
  if(currentLesson?.link) window.open(currentLesson.link,'_blank');
}
function copyLink(){
  if(!currentLesson?.link) return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(currentLesson.link).then(()=>toast('Đã copy link!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = currentLesson.link;
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy'); toast('Đã copy link!');}catch(e){}
    document.body.removeChild(ta);
  }
}
function fullscreenPlayer(){
  const box = document.getElementById('playerBox');
  if(box.requestFullscreen) box.requestFullscreen();
  else if(box.webkitRequestFullscreen) box.webkitRequestFullscreen();
  else if(box.msRequestFullscreen) box.msRequestFullscreen();
}

/* Toast nhỏ */
function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1d28;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fadeIn .2s;';
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 1800);
}

/* ESC để đóng player */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('playerPage').classList.contains('active')){
    closePlayer();
  }
});

/* ============================================================
   CHIP FILTER
   ============================================================ */
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    activeView=c.dataset.view;
    activeTab=c.dataset.view;
    activeFilter='all';
    renderNav();
    renderContent();
  };
});

/* ============================================================
   STATS + SIDEBAR + HOME
   ============================================================ */
function updateStats(){
  document.getElementById('infoLessons').textContent = countAllLessons();
  document.getElementById('infoSubjects').textContent = ALL_SUBJECTS.length;
  document.getElementById('infoLinks').textContent = countAllLinks();
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
function goHome(){
  activeTab='all'; activeFilter='all'; activeView='all'; searchTerm='';
  searchInput.value='';
  searchClear.classList.remove('show');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.view==='all'));
  renderNav();
  renderContent();
}
function scrollToTop(){
  document.getElementById('mainArea').scrollTo({top:0,behavior:'smooth'});
}
function clearSearch(){
  searchInput.value='';
  searchTerm='';
  searchClear.classList.remove('show');
  renderContent();
}
function toggleTheme(){
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme')==='light';
  if(isLight){
    html.removeAttribute('data-theme');
    document.getElementById('themeIcon').className = 'fas fa-moon';
    localStorage.setItem('theme','dark');
  } else {
    html.setAttribute('data-theme','light');
    document.getElementById('themeIcon').className = 'fas fa-sun';
    localStorage.setItem('theme','light');
  }
}

searchInput.addEventListener('input', e=>{
  searchTerm=e.target.value.trim();
  searchClear.classList.toggle('show', !!searchTerm);
  renderContent();
});

/* Theme khởi tạo */
if(localStorage.getItem('theme')==='light'){
  document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeIcon').className = 'fas fa-sun';
}

/* Init */
updateStats();
renderNav();
renderContent();
</script>
</body>
</html>
