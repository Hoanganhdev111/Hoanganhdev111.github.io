<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeX Education · HSA + Toán Thầy Chí + Sử Cô Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0D1A; --surface:#111628; --border:#1E2540; --border2:#2E3A60;
    --primary:#6C8EFF; --violet:#A78BFA; --green:#34D399; --amber:#FBBF24; --red:#F87171;
    --text:#F8FAFF; --text2:#C7D0E8; --text3:#8E9AC0; --muted:#6C7A9E;
    --radius:28px;
  }
  [data-theme="light"]{
    --bg:#f0f2f8; --surface:#ffffff; --border:#d8dce8; --border2:#c0c6d8;
    --primary:#5b4bdb; --violet:#7c5cd6; --green:#10b981; --amber:#d97706; --red:#dc2626;
    --text:#1a1a2e; --text2:#4a4a6a; --text3:#6a6a8a; --muted:#8a8aaa;
  }
  body{
    background:var(--bg); font-family:'Inter',sans-serif; color:var(--text);
    line-height:1.5; padding:24px 20px 48px; min-height:100vh;
    transition:background .3s,color .3s;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(rgba(108,142,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(108,142,255,.03) 1px,transparent 1px);
    background-size:48px 48px;
  }
  [data-theme="light"] body::before{opacity:.4}
  .app{max-width:1500px; margin:0 auto; position:relative; z-index:2}

  /* HEADER */
  .header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    background:rgba(17,22,40,.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 26px; margin-bottom:20px;
    box-shadow:0 20px 35px -12px rgba(0,0,0,.7),0 0 0 1px rgba(108,142,255,.1) inset;
  }
  [data-theme="light"] .header{background:rgba(255,255,255,.85)}
  .logo-area{display:flex; align-items:center; gap:12px}
  .logo-icon{
    width:42px;height:42px; background:linear-gradient(135deg,var(--primary),var(--violet));
    border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#0A0D1A; font-weight:800;
    box-shadow:0 0 20px rgba(108,142,255,.5);
  }
  .logo-text{font-weight:700; font-size:20px; letter-spacing:-.02em;
    background:linear-gradient(120deg,var(--text) 20%,var(--violet) 80%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .logo-text span{font-weight:400; font-size:12px; color:var(--text3);
    background:none; -webkit-background-clip:unset; background-clip:unset; margin-left:8px;}
  .header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .stats-badge{
    display:flex; gap:18px; background:rgba(10,13,26,.7);
    padding:8px 20px; border-radius:40px; border:1px solid var(--border);
    font-size:12.5px; font-weight:500;
  }
  [data-theme="light"] .stats-badge{background:rgba(240,242,248,.7)}
  .stats-badge .badge-item{display:flex; align-items:center; gap:6px}
  .stats-badge i{color:var(--primary); font-size:12px}
  .stats-badge span{color:var(--text2)}
  .stats-badge strong{color:var(--text); font-weight:700; margin-left:4px}
  .theme-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text2);
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    transition:all .2s;
  }
  .theme-btn:hover{background:var(--border); color:var(--text)}

  /* TABS */
  .tabs{
    display:flex; gap:4px; margin-bottom:16px;
    background:rgba(17,22,40,.6); padding:5px; border-radius:48px;
    border:1px solid var(--border); width:fit-content; flex-wrap:wrap; max-width:100%;
  }
  [data-theme="light"] .tabs{background:rgba(255,255,255,.7)}
  .tab-btn{
    padding:9px 16px; border-radius:40px; border:none; background:transparent;
    color:var(--text3); font-size:12px; font-weight:500; cursor:pointer;
    transition:all .2s; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tab-btn i{font-size:12px}
  .tab-btn:hover{color:var(--text); background:rgba(108,142,255,.1)}
  .tab-btn.active{background:var(--primary); color:#0A0D1A; font-weight:600}
  .tab-btn.active i{color:#0A0D1A}

  /* TOOLBAR */
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    margin-bottom:20px; gap:14px;
  }
  .search-wrapper{flex:1; min-width:240px; position:relative}
  .search-wrapper i{position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--primary); font-size:15px}
  .search-wrapper input{
    width:100%; background:rgba(17,22,40,.8); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:48px; padding:13px 22px 13px 50px;
    font-size:14px; color:var(--text); outline:none; transition:all .2s;
    font-family:'Inter',sans-serif;
  }
  [data-theme="light"] .search-wrapper input{background:rgba(255,255,255,.9)}
  .search-wrapper input::placeholder{color:var(--muted)}
  .search-wrapper input:focus{border-color:var(--primary); box-shadow:0 0 0 4px rgba(108,142,255,.15)}

  .subject-filters{display:flex; flex-wrap:wrap; gap:8px}
  .filter-btn{
    background:rgba(17,22,40,.7); border:1px solid var(--border); color:var(--text2);
    padding:8px 16px; border-radius:40px; font-size:12px; font-weight:500;
    cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px;
  }
  [data-theme="light"] .filter-btn{background:rgba(255,255,255,.8)}
  .filter-btn i{font-size:11px; color:var(--primary)}
  .filter-btn:hover{background:var(--border); border-color:var(--border2); color:var(--text)}
  .filter-btn.active{background:var(--primary); border-color:var(--primary); color:#0A0D1A; font-weight:600}
  .filter-btn.active i{color:#0A0D1A}

  /* GRID */
  .subjects-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:22px; margin-bottom:32px}
  .subject-card{
    background:rgba(17,22,40,.75); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px 18px;
    transition:transform .2s,border-color .2s,box-shadow .2s;
    display:flex; flex-direction:column;
    box-shadow:0 15px 25px -12px rgba(0,0,0,.6);
  }
  [data-theme="light"] .subject-card{background:rgba(255,255,255,.9)}
  .subject-card:hover{
    border-color:var(--border2); transform:translateY(-3px);
    box-shadow:0 22px 30px -12px rgba(0,0,0,.8),0 0 0 1px rgba(108,142,255,.2);
  }
  .card-header{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .subject-icon{
    width:46px;height:46px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:20px; background:rgba(108,142,255,.12); color:var(--primary); border:1px solid var(--border);
    flex-shrink:0;
  }
  .subject-icon.violet{background:rgba(167,139,250,.12); color:var(--violet)}
  .subject-icon.green{background:rgba(52,211,153,.12); color:var(--green)}
  .subject-icon.amber{background:rgba(251,191,36,.12); color:var(--amber)}
  .subject-icon.red{background:rgba(248,113,113,.12); color:var(--red)}
  .subject-title{flex:1; min-width:0}
  .subject-title h3{font-weight:700; font-size:16px; letter-spacing:-.01em; color:var(--text); line-height:1.3}
  .subject-title .lesson-count{font-size:11px; color:var(--text3); display:flex; align-items:center; gap:5px; margin-top:3px}
  .lesson-count i{font-size:9px; color:var(--primary)}
  .progress-indicator{
    font-size:11px; background:var(--bg); padding:4px 10px; border-radius:40px;
    border:1px solid var(--border); color:var(--text2); font-weight:500;
    white-space:nowrap; flex-shrink:0;
  }
  .progress-indicator i{color:var(--green); font-size:9px; margin-right:3px}

  .lesson-list{
    list-style:none; margin-top:4px; max-height:220px; overflow-y:auto;
    padding-right:6px; scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
  }
  .lesson-list::-webkit-scrollbar{width:4px}
  .lesson-list::-webkit-scrollbar-thumb{background:var(--border2); border-radius:20px}
  .lesson-item{
    display:flex; align-items:flex-start; gap:9px; padding:7px 8px;
    border-bottom:1px solid rgba(30,37,64,.6); font-size:12.5px;
    transition:background .15s; cursor:pointer; border-radius:10px;
  }
  [data-theme="light"] .lesson-item{border-bottom-color:rgba(200,206,224,.6)}
  .lesson-item:hover{background:rgba(108,142,255,.08)}
  .lesson-item:last-child{border-bottom:none}
  .lesson-idx{color:var(--primary); font-weight:700; font-size:11px; min-width:22px; opacity:.9; padding-top:1px}
  .lesson-name{flex:1; color:var(--text2); font-weight:400; line-height:1.4; word-break:break-word}
  .lesson-date{font-size:10px; color:var(--muted); white-space:nowrap; margin-left:6px; padding-top:1px}
  .lesson-item i.fa-play-circle{color:var(--primary); font-size:11px; opacity:.6; margin-top:2px}
  .lesson-item i.fa-file-download{color:var(--green); font-size:11px; opacity:.6; margin-top:2px}
  .material-tag{font-size:9px; padding:1px 6px; border-radius:10px; background:var(--border); color:var(--text3); white-space:nowrap}

  .card-footer{margin-top:14px; display:flex; justify-content:flex-end; gap:8px}
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text3);
    font-size:11px; padding:7px 14px; border-radius:30px; font-weight:500;
    cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px;
  }
  .btn-ghost i{font-size:11px; color:var(--primary)}
  .btn-ghost:hover{background:var(--border); color:var(--text); border-color:var(--border2)}

  /* TABLE */
  .table-wrap{overflow-x:auto; border-radius:16px; border:1px solid var(--border); background:rgba(17,22,40,.75); backdrop-filter:blur(8px); margin-bottom:24px}
  [data-theme="light"] .table-wrap{background:rgba(255,255,255,.9)}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:600px}
  thead th{
    background:var(--border); color:var(--text); font-weight:600;
    padding:11px 14px; text-align:left; border-bottom:2px solid var(--border2);
    position:sticky; top:0; z-index:5; font-size:12px;
  }
  tbody td{
    padding:9px 14px; border-bottom:1px solid rgba(30,37,64,.6);
    color:var(--text2); vertical-align:middle;
  }
  [data-theme="light"] tbody td{border-bottom-color:rgba(200,206,224,.6)}
  tbody tr:hover td{background:rgba(108,142,255,.05)}
  .link-btn{
    display:inline-flex; align-items:center; gap:5px; padding:4px 12px;
    background:var(--primary); color:#fff !important; border-radius:20px;
    font-size:11px; font-weight:500; text-decoration:none; transition:all .2s;
    cursor:pointer; border:none; font-family:'Inter',sans-serif;
  }
  .link-btn:hover{background:var(--violet); transform:scale(1.05)}
  .link-btn.green{background:var(--green); color:#0A0D1A !important}
  .link-btn.green:hover{background:#10b981}

  .info-bar{
    display:flex; flex-wrap:wrap; gap:14px 22px; background:rgba(17,22,40,.75);
    padding:12px 20px; border-radius:14px; margin-bottom:18px;
    border:1px solid var(--border); font-size:13px; color:var(--text2);
  }
  [data-theme="light"] .info-bar{background:rgba(255,255,255,.9)}
  .info-bar span strong{color:var(--text); font-weight:600}
  .info-bar .dot{
    display:inline-block; width:7px;height:7px; border-radius:50%;
    background:var(--green); margin-right:5px; animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* FOOTER */
  .stats-footer{
    background:rgba(17,22,40,.6); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 28px; display:flex; flex-wrap:wrap; justify-content:space-between;
    align-items:center; font-size:13px; color:var(--text3); margin-top:24px;
  }
  [data-theme="light"] .stats-footer{background:rgba(255,255,255,.8)}
  .stats-footer .total-badge{display:flex; align-items:center; gap:16px}
  .total-badge .big-number{font-size:26px; font-weight:700; color:var(--primary); letter-spacing:-.02em}
  .total-badge .label{color:var(--text3); font-size:12px}
  .tag-web3{
    background:linear-gradient(135deg,rgba(108,142,255,.15),rgba(167,139,250,.15));
    border:1px solid rgba(108,142,255,.25); padding:6px 16px; border-radius:40px;
    font-size:11px; font-weight:600; color:var(--violet); letter-spacing:.3px;
    display:flex; align-items:center; gap:7px;
  }
  .tag-web3 i{color:var(--primary)}

  .hsa-badge{
    background:rgba(52,211,153,.15); border:1px solid rgba(52,211,153,.3);
    color:var(--green); font-size:9px; font-weight:700; padding:2px 8px;
    border-radius:30px; margin-left:6px; letter-spacing:.3px;
  }
  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted);
    font-size:15px; border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state i{font-size:38px; margin-bottom:14px; display:block; opacity:.4}

  @media(max-width:700px){
    body{padding:14px 10px 32px}
    .header{padding:12px 16px}
    .logo-text{font-size:16px}
    .logo-text span{display:none}
    .stats-badge{display:none}
    .subjects-grid{grid-template-columns:1fr}
    .toolbar{flex-direction:column; align-items:stretch}
    .subject-filters{overflow-x:auto; padding-bottom:4px}
    .tabs{width:100%; justify-content:flex-start; overflow-x:auto}
    .stats-footer{flex-direction:column; gap:14px; align-items:flex-start}
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">W</div>
      <div class="logo-text">WeX Education <span>HSA · Thầy Chí · Cô Sen</span></div>
    </div>
    <div class="header-right">
      <div class="stats-badge">
        <div class="badge-item"><i class="fas fa-book-open"></i><span>Tổng:</span><strong id="totalLessons">0</strong></div>
        <div class="badge-item"><i class="fas fa-layer-group" style="color:#A78BFA"></i><span>Môn:</span><strong id="totalSubjects">0</strong></div>
        <div class="badge-item"><i class="fas fa-link" style="color:#34D399"></i><span>Link:</span><strong id="totalLinks">0</strong></div>
      </div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <div class="tabs" id="tabContainer">
    <button class="tab-btn active" data-tab="all"><i class="fas fa-globe"></i> Tất cả</button>
    <button class="tab-btn" data-tab="hsa"><i class="fas fa-graduation-cap"></i> HSA</button>
    <button class="tab-btn" data-tab="thaychi"><i class="fas fa-chalkboard-teacher"></i> Toán Thầy Chí</button>
    <button class="tab-btn" data-tab="cosen"><i class="fas fa-scroll"></i> Sử Cô Sen</button>
    <button class="tab-btn" data-tab="sgk"><i class="fas fa-book"></i> SGK</button>
    <button class="tab-btn" data-tab="tailieu"><i class="fas fa-file-alt"></i> Tài liệu</button>
    <button class="tab-btn" data-tab="btvn"><i class="fas fa-pen-to-square"></i> BTVN</button>
  </div>

  <div class="toolbar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Tìm bài học, tài liệu, BTVN...">
    </div>
    <div class="subject-filters" id="filterContainer"></div>
  </div>

  <div class="info-bar">
    <span><span class="dot"></span> <strong>Live</strong> · cập nhật 16/09/2026</span>
    <span>📚 <strong id="infoLessons">0</strong> mục</span>
    <span>🎓 <strong id="infoSubjects">0</strong> môn</span>
    <span>🔗 <strong id="infoLinks">0</strong> link</span>
    <span>▶️ Click để mở bài giảng</span>
  </div>

  <div id="contentArea"></div>

  <div class="stats-footer">
    <div class="total-badge">
      <div>
        <div class="big-number" id="footerTotal">0</div>
        <div class="label">bài giảng · tài liệu · BTVN</div>
      </div>
      <div style="width:1px;height:30px;background:var(--border)"></div>
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--text)" id="footerSubjects">0</div>
        <div class="label">môn học / chuyên đề</div>
      </div>
    </div>
    <div class="tag-web3"><i class="fas fa-cube"></i> WeX Education · HSA · Toán · Sử</div>
  </div>
</div>

<script>

/* ============================================================
   STATE & RENDER
   ============================================================ */
let activeFilter='all', activeTab='all', searchTerm='';
const contentArea=document.getElementById('contentArea');
const filterContainer=document.getElementById('filterContainer');
const searchInput=document.getElementById('searchInput');
const tabContainer=document.getElementById('tabContainer');

const ALL_SUBJECTS=[
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

function countAllLessons(){return ALL_SUBJECTS.reduce((a,s)=>a+s.lessons.length,0);}
function countAllLinks(){let t=0; ALL_SUBJECTS.forEach(s=>s.lessons.forEach(l=>{if(l.link)t++})); return t;}

function getFilteredLessons(sub){
  let L=sub.lessons;
  if(activeTab==='video') L=L.filter(l=>l.type==='video');
  if(activeTab==='tailieu') L=L.filter(l=>l.type==='tailieu');
  if(activeTab==='btvn') L=L.filter(l=>l.type==='btvn');
  if(searchTerm) L=L.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return L;
}

function renderTabs(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
}

function renderFilters(){
  const groups=[
    {id:'all',label:'Tất cả',icon:'fa-layer-group'},
    {id:'hsa',label:'HSA',icon:'fa-graduation-cap'},
    {id:'thaychi',label:'Thầy Chí',icon:'fa-chalkboard-teacher'},
    {id:'cosen',label:'Cô Sen',icon:'fa-scroll'},
    {id:'sgk',label:'SGK',icon:'fa-book'}
  ];
  filterContainer.innerHTML='';
  groups.forEach(g=>{
    const b=document.createElement('button');
    b.className=`filter-btn ${activeFilter===g.id?'active':''}`;
    b.innerHTML=`<i class="fas ${g.icon}"></i> ${g.label}`;
    b.addEventListener('click',()=>{activeFilter=g.id;renderFilters();renderContent();});
    filterContainer.appendChild(b);
  });
}

function renderContent(){
  const filtered=ALL_SUBJECTS.filter(s=>{
    // Tab filter
    if(activeTab==='thaychi') return s.group==='thaychi';
    if(activeTab==='cosen') return s.group==='cosen';
    if(activeTab==='sgk') return s.group==='sgk';
    if(activeTab==='hsa') return s.group==='hsa';
    // 'all', 'video', 'tailieu', 'btvn' → apply activeFilter
    if(activeFilter==='hsa') return s.group==='hsa';
    if(activeFilter==='thaychi') return s.group==='thaychi';
    if(activeFilter==='cosen') return s.group==='cosen';
    if(activeFilter==='sgk') return s.group==='sgk';
    return true;
  }).filter(s=>{
    if(!searchTerm) return true;
    const t=searchTerm.toLowerCase();
    return s.name.toLowerCase().includes(t)||s.lessons.some(l=>l.name.toLowerCase().includes(t));
  });

  let html='',totalShown=0;

  // Bảng cho Thầy Chí & Cô Sen khi tab tương ứng
  if(activeTab==='thaychi'||activeTab==='cosen'){
    const sub = activeTab==='thaychi'?THAY_CHI:CO_SEN;
    let lessons=sub.lessons;
    if(searchTerm) lessons=lessons.filter(l=>l.name.toLowerCase().includes(searchTerm.toLowerCase()));
    html+='<div class="table-wrap"><table><thead><tr><th>#</th><th>Bài giảng</th><th>Chương</th><th>Link</th></tr></thead><tbody>';
    lessons.forEach((l,i)=>{
      html+=`<tr><td>${i+1}</td><td>${l.name}</td><td>${l.date}</td><td><a class="link-btn" href="${l.link}" target="_blank"><i class="fas fa-external-link-alt"></i> Mở</a></td></tr>`;
    });
    html+='</tbody></table></div>';
    totalShown=lessons.length;
  } else {
    html+='<div class="subjects-grid">';
    filtered.forEach(sub=>{
      const lessons=getFilteredLessons(sub);
      if(lessons.length===0&&searchTerm) return;
      if(lessons.length===0&&(activeTab==='tailieu'||activeTab==='btvn')) return;
      const iconColor=sub.color||'';
      const total=sub.lessons.length, shown=lessons.length;
      let li='';
      if(lessons.length===0){
        li='<li style="padding:12px 8px;color:var(--muted);font-size:12px">Không có nội dung.</li>';
      } else {
        li=lessons.map((l,idx)=>{
          const gi=sub.lessons.indexOf(l)+1;
          let tag='';
          let icon='fa-play-circle';
          if(l.type==='tailieu'){tag='<span class="material-tag">📄 TL</span>'; icon='fa-file-download';}
          if(l.type==='btvn'){tag='<span class="material-tag">✏️ BTVN</span>'; icon='fa-file-download';}
          return `<li class="lesson-item" onclick="window.open('${l.link}','_blank')">
            <span class="lesson-idx">${gi}.</span>
            <span class="lesson-name">${l.name} ${tag}</span>
            <span class="lesson-date">${l.date}</span>
            <i class="fas ${icon}"></i>
          </li>`;
        }).join('');
      }
      const isHSA=sub.group==='hsa';
      html+=`
        <div class="subject-card">
          <div class="card-header">
            <div class="subject-icon ${iconColor}"><i class="fas ${sub.icon}"></i></div>
            <div class="subject-title">
              <h3>${sub.name} ${isHSA?'<span class="hsa-badge">HSA</span>':''}</h3>
              <div class="lesson-count"><i class="fas fa-play-circle"></i> ${total} mục · hiển thị ${shown}</div>
            </div>
            <div class="progress-indicator"><i class="fas fa-check-circle"></i> 100%</div>
          </div>
          <ul class="lesson-list">${li}</ul>
          <div class="card-footer">
            <button class="btn-ghost" onclick="window.open('${lessons[0]?.link||sub.lessons[0]?.link||'#'}','_blank')"><i class="fas fa-play"></i> Học ngay</button>
          </div>
        </div>`;
      totalShown+=shown;
    });
    html+='</div>';
  }

  if(totalShown===0&&searchTerm) html=`<div class="empty-state"><i class="fas fa-search"></i>Không tìm thấy "<strong>${searchTerm}</strong>".</div>`;
  else if(totalShown===0) html=`<div class="empty-state"><i class="fas fa-folder-open"></i>Chưa có nội dung trong mục này.</div>`;

  contentArea.innerHTML=html;
}

function updateStats(){
  const t=countAllLessons(),l=countAllLinks(),s=ALL_SUBJECTS.length;
  document.getElementById('totalLessons').textContent=t;
  document.getElementById('totalSubjects').textContent=s;
  document.getElementById('totalLinks').textContent=l;
  document.getElementById('infoLessons').textContent=t;
  document.getElementById('infoSubjects').textContent=s;
  document.getElementById('infoLinks').textContent=l;
  document.getElementById('footerTotal').textContent=t;
  document.getElementById('footerSubjects').textContent=s;
}

function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='light'?'dark':'light';
  h.setAttribute('data-theme',next);
  document.getElementById('themeBtn').innerHTML=next==='light'?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
  localStorage.setItem('theme',next);
}

function init(){
  const saved=localStorage.getItem('theme');
  if(saved==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.getElementById('themeBtn').innerHTML='<i class="fas fa-sun"></i>';
  }
  updateStats();
  renderTabs();
  renderFilters();
  renderContent();

  tabContainer.addEventListener('click',e=>{
    const b=e.target.closest('.tab-btn');
    if(!b) return;
    activeTab=b.dataset.tab;
    renderTabs();
    renderContent();
  });

  searchInput.addEventListener('input',e=>{
    searchTerm=e.target.value;
    renderContent();
  });
}

init();
</script>
</body>
</html>
