<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WeX Education — Học trực tuyến</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --yt-bg:#0f0f0f;
  --yt-bg-elev:#212121;
  --yt-bg-elev2:#272727;
  --yt-hover:#3d3d3d;
  --yt-fg:#f1f1f1;
  --yt-fg-dim:#aaaaaa;
  --yt-fg-mut:#717171;
  --yt-red:#ff0000;
  --yt-border:rgba(255,255,255,.1);
  --sb-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:14px/1.4 'Roboto',system-ui,-apple-system,sans-serif;
  background:var(--yt-bg);color:var(--yt-fg);
  -webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#6d6d6d}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
img{display:block;max-width:100%}

/* ============ SIDEBAR ============ */
.sidebar{
  width:var(--sb-w);flex-shrink:0;height:100vh;overflow-y:auto;
  padding:12px 12px 24px;border-right:1px solid var(--yt-border);
  background:var(--yt-bg);
}
.sidebar::-webkit-scrollbar{width:6px}
.logo{
  display:flex;align-items:center;gap:6px;
  padding:4px 8px 18px;
  font-size:20px;font-weight:700;letter-spacing:-.5px;
  cursor:pointer;
}
.logo .mark{
  width:32px;height:32px;background:linear-gradient(135deg,#ff0000,#a855f7);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 2px 10px rgba(255,0,0,.35);
}
.logo .name{
  background:linear-gradient(120deg,#fff 30%,#c7d2fe 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;
}
.nav-item{
  display:flex;align-items:center;gap:16px;
  padding:9px 12px;border-radius:10px;
  font-size:14px;color:var(--yt-fg);
  cursor:pointer;margin-bottom:2px;transition:background .15s;
}
.nav-item:hover{background:var(--yt-hover)}
.nav-item.active{background:var(--yt-bg-elev2);font-weight:600}
.nav-item .ico{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.nav-divider{height:1px;background:var(--yt-border);margin:10px 4px}
.nav-title{
  padding:8px 12px 4px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-title .arr{font-size:10px;color:var(--yt-fg-mut)}
.sub-item{
  display:flex;align-items:center;gap:14px;
  padding:8px 12px;border-radius:10px;font-size:13.5px;
  color:var(--yt-fg-dim);cursor:pointer;transition:.15s;
}
.sub-item:hover{background:var(--yt-hover);color:var(--yt-fg)}
.sub-item.active{background:var(--yt-bg-elev2);color:var(--yt-fg);font-weight:600}
.sub-item .avt{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:700;flex-shrink:0;
}

/* ============ MAIN ============ */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden}

.topbar{
  height:56px;flex-shrink:0;
  background:var(--yt-bg);border-bottom:1px solid var(--yt-border);
  display:flex;align-items:center;gap:16px;padding:0 16px;
  position:sticky;top:0;z-index:50;
}
.topbar .ham{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--yt-fg-dim);cursor:pointer;
}
.topbar .ham:hover{background:var(--yt-hover);color:var(--yt-fg)}
.topbar .center{flex:1;display:flex;justify-content:center;max-width:720px;margin:0 auto}
.search-form{
  display:flex;width:100%;max-width:600px;
  background:var(--yt-bg-elev);border:1px solid var(--yt-border);
  border-radius:40px;overflow:hidden;height:40px;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--yt-fg);padding:0 16px;font-size:15px;font-family:inherit;
}
.search-form input::placeholder{color:var(--yt-fg-mut)}
.search-form button{
  width:64px;background:var(--yt-bg-elev2);border-left:1px solid var(--yt-border);
  color:var(--yt-fg-dim);font-size:16px;
}
.topbar .right{display:flex;gap:6px;align-items:center}
.btn-create{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;
  background:var(--yt-bg-elev);color:var(--yt-fg);
  font-size:13px;font-weight:500;
}
.btn-create:hover{background:var(--yt-hover)}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--yt-fg-dim);font-size:18px;cursor:pointer;
}
.icon-btn:hover{background:var(--yt-hover);color:var(--yt-fg)}

/* CHIPS */
.chips{
  display:flex;gap:12px;padding:12px 24px 8px;
  overflow-x:auto;position:sticky;top:56px;
  background:var(--yt-bg);z-index:40;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 14px;border-radius:16px;
  background:var(--yt-bg-elev);color:var(--yt-fg);
  font-size:13px;font-weight:500;white-space:nowrap;
  cursor:pointer;transition:background .15s;flex-shrink:0;
}
.chip:hover{background:var(--yt-hover)}
.chip.active{background:#fff;color:#0f0f0f}

/* VIDEO GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:28px 16px;
  padding:12px 24px 40px;
}
@media(max-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding:12px 12px 40px}}
@media(max-width:600px){.grid{grid-template-columns:1fr;gap:18px}}

.card{cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.thumb{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:12px;overflow:hidden;background:#333;
}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .dur{
  position:absolute;bottom:6px;right:6px;
  background:rgba(0,0,0,.85);color:#fff;
  font-size:12px;font-weight:500;
  padding:2px 5px;border-radius:4px;
}
.thumb .badge-type{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:6px;
  display:flex;align-items:center;gap:4px;
}
.thumb .badge-type.video{background:rgba(255,0,0,.9)}
.thumb .badge-type.tailieu{background:rgba(52,211,153,.9)}
.thumb .badge-type.btvn{background:rgba(251,191,36,.9);color:#000}

.meta{display:flex;gap:12px;margin-top:12px;padding:0 2px}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:700;
}
.info{flex:1;min-width:0}
.title{
  font-size:15px;font-weight:500;line-height:1.35;
  color:var(--yt-fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:5px;
}
.author{
  font-size:13px;color:var(--yt-fg-dim);
  display:flex;align-items:center;gap:4px;
}
.author .check{font-size:11px;color:var(--yt-fg-mut)}
.stats{font-size:13px;color:var(--yt-fg-dim);margin-top:2px}
.menu-btn{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--yt-fg-dim);font-size:16px;
}
.menu-btn:hover{background:var(--yt-hover);color:var(--yt-fg)}

/* ============ MODAL PLAYER ============ */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:999;display:none;align-items:flex-start;justify-content:center;
  padding:20px;overflow-y:auto;
}
.modal.active{display:flex}
.modal-inner{
  width:100%;max-width:1400px;
  display:grid;grid-template-columns:1fr 380px;gap:20px;
  align-items:start;
}
@media(max-width:1000px){.modal-inner{grid-template-columns:1fr}}

.player-box{background:#000;border-radius:12px;overflow:hidden;position:relative}
.player-box video{width:100%;aspect-ratio:16/9;display:block;background:#000;outline:none}
.player-close{
  position:absolute;top:12px;right:12px;z-index:10;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
}
.player-close:hover{background:rgba(255,0,0,.9)}

.video-meta{padding:16px 4px}
.video-meta h1{font-size:18px;font-weight:600;line-height:1.35;margin-bottom:10px;color:#fff}
.video-meta .chips-row{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--yt-fg-dim)}
.video-meta .chips-row span{
  background:var(--yt-bg-elev);padding:4px 10px;border-radius:14px;font-size:12px;
}

/* playlist trong modal */
.modal-playlist{
  background:var(--yt-bg-elev);border-radius:12px;overflow:hidden;
  max-height:calc(100vh - 60px);display:flex;flex-direction:column;
}
.modal-playlist-head{
  padding:14px 16px;border-bottom:1px solid var(--yt-border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.modal-playlist-head .ico{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
}
.modal-playlist-head .txt{flex:1;min-width:0}
.modal-playlist-head .txt .t{font-size:14px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-playlist-head .txt .s{font-size:11.5px;color:var(--yt-fg-dim);margin-top:2px}
.modal-playlist-body{
  flex:1;overflow-y:auto;padding:6px 0;
}
.modal-pl-item{
  display:flex;gap:10px;padding:8px 12px;cursor:pointer;
  transition:background .15s;
}
.modal-pl-item:hover{background:var(--yt-hover)}
.modal-pl-item.active{background:var(--yt-bg-elev2)}
.modal-pl-item .n{
  width:28px;flex-shrink:0;text-align:center;
  font-size:12px;color:var(--yt-fg-dim);padding-top:4px;
}
.modal-pl-item.active .n{color:var(--yt-red);font-weight:700}
.modal-pl-item .body{flex:1;min-width:0}
.modal-pl-item .body .nm{
  font-size:13px;color:var(--yt-fg);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.modal-pl-item.active .body .nm{color:#fff;font-weight:600}
.modal-pl-item .body .mt{font-size:11px;color:var(--yt-fg-mut);margin-top:3px}

/* mobile */
@media(max-width:800px){
  .sidebar{display:none}
  .topbar .center{display:none}
  .btn-create span{display:none}
  .modal{padding:0}
  .modal-inner{max-width:100%;gap:0}
  .player-box{border-radius:0}
  .modal-playlist{border-radius:0;max-height:none}
  .video-meta{padding:12px}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <div class="mark">W</div>
    <div class="name">WeX</div>
  </div>
  <div class="nav-item active" data-tab="all"><span class="ico">🏠</span> Trang chủ</div>
  <div class="nav-item" data-tab="video"><span class="ico">▶️</span> Video mới</div>
  <div class="nav-item" data-tab="tailieu"><span class="ico">📄</span> Tài liệu</div>
  <div class="nav-item" data-tab="btvn"><span class="ico">📝</span> BTVN</div>
  <div class="nav-divider"></div>
  <div class="nav-title">Khóa học <span class="arr">›</span></div>
  <div id="courseNav"></div>
</aside>

<!-- MAIN -->
<main>
  <div class="topbar">
    <div class="ham" onclick="document.querySelector('.sidebar').style.display = document.querySelector('.sidebar').style.display==='none'?'block':'none'">☰</div>
    <div class="center">
      <form class="search-form" onsubmit="return false">
        <input id="search" placeholder="Tìm kiếm bài học, khóa học...">
        <button type="button">🔍</button>
      </form>
    </div>
    <div class="right">
      <button class="btn-create">➕ <span>Tạo</span></button>
      <button class="icon-btn">🔔</button>
      <button class="icon-btn">👤</button>
    </div>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" data-cat="all">Tất cả</div>
    <div class="chip" data-cat="video">Video mới</div>
    <div class="chip" data-cat="tailieu">Tài liệu</div>
    <div class="chip" data-cat="btvn">BTVN</div>
    <div class="chip" data-cat="toan">Toán</div>
    <div class="chip" data-cat="van">Văn</div>
    <div class="chip" data-cat="anh">Tiếng Anh</div>
    <div class="chip" data-cat="ly_hoa_sinh">Lý - Hoá - Sinh</div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<!-- MODAL PLAYER -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div>
      <div class="player-box">
        <div class="player-close" onclick="closeModal()">✕</div>
        <video id="player" controls playsinline preload="auto"></video>
      </div>
      <div class="video-meta">
        <h1 id="mTitle">—</h1>
        <div class="chips-row" id="mMeta"></div>
      </div>
    </div>
    <div class="modal-playlist">
      <div class="modal-playlist-head">
        <div class="ico" id="mIco">📚</div>
        <div class="txt">
          <div class="t" id="mCourseName">—</div>
          <div class="s" id="mCourseSub">—</div>
        </div>
      </div>
      <div class="modal-playlist-body" id="mPlaylist"></div>
    </div>
  </div>
</div>

<script src="data2.js"></script>
<script>
/* ============================================================
   BUILD TẤT CẢ BÀI
   ============================================================ */
const ALL_SUBJECTS = [
  ...MEGA_SUBJECTS.map(s=>({...s,group:'hsa'})),
  ...SGK_SUBJECTS.map(s=>({...s,group:'sgk'})),
  THAY_CHI,
  CO_SEN
];

const ALL_LESSONS = [];
ALL_SUBJECTS.forEach((sub, si)=>{
  sub.lessons.forEach((l, li)=>{
    ALL_LESSONS.push({
      ...l,
      subIdx: si,
      lesIdx: li,
      subjectId: sub.id,
      subjectName: sub.name,
      subjectIcon: sub.icon,
      subjectColor: sub.color,
      subjectDesc: sub.desc,
      group: sub.group
    });
  });
});

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);

function getYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytThumb(url, quality='max'){
  const id = getYouTubeId(url);
  if(!id) return 'https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg';
  return `https://i.ytimg.com/vi/${id}/${quality}resdefault.jpg`;
}
function ytThumbHq(url){
  const id = getYouTubeId(url);
  if(!id) return 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg';
  return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
}
function isDrive(url){ return url && url.includes('drive.google.com'); }
function isYoutube(url){ return url && getYouTubeId(url); }
function isHls(url){ return url && url.includes('.m3u8'); }

function fakeViews(lesIdx){
  const base = 1000 + lesIdx*137;
  if(base > 1000000) return (base/1000000).toFixed(1)+' Tr lượt xem';
  if(base > 1000) return (base/1000).toFixed(0)+' N lượt xem';
  return base + ' lượt xem';
}
function fakeTime(i){
  const arr = ['1 giờ trước','3 giờ trước','1 ngày trước','3 ngày trước','1 tuần trước','2 tuần trước','1 tháng trước','2 tháng trước'];
  return arr[i % arr.length];
}
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) return '0:00';
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
             : `${m}:${String(s).padStart(2,'0')}`;
}
function fakeDuration(id){
  const durations = ['12:34','25:18','8:45','42:10','15:22','32:05','18:50','7:33','28:14','55:30'];
  return durations[id % durations.length];
}

/* ============================================================
   RENDER SIDEBAR COURSE NAV
   ============================================================ */
function renderCourseNav(){
  $('courseNav').innerHTML = ALL_SUBJECTS.map(s=>`
    <div class="sub-item" data-sid="${s.id}">
      <div class="avt" style="background:${colorGrad(s.color)}">${s.icon}</div>
      <span>${s.name}</span>
    </div>
  `).join('');
  document.querySelectorAll('#courseNav .sub-item').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('#courseNav .sub-item').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const sid = el.dataset.sid;
      filterBySubject(sid);
    };
  });
}
function colorGrad(c){
  const map = {
    green:'linear-gradient(135deg,#34d399,#10b981)',
    violet:'linear-gradient(135deg,#a78bfa,#7c3aed)',
    amber:'linear-gradient(135deg,#fbbf24,#f59e0b)',
    red:'linear-gradient(135deg,#f87171,#dc2626)',
    pink:'linear-gradient(135deg,#f472b6,#ec4899)'
  };
  return map[c] || 'linear-gradient(135deg,#6c8eff,#a855f7)';
}

/* ============================================================
   RENDER GRID
   ============================================================ */
let currentCat = 'all';
let currentSubjectId = null;
let searchTerm = '';

function filterBySubject(sid){
  currentSubjectId = sid;
  currentCat = 'all';
  searchTerm = '';
  $('search').value = '';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  renderGrid();
}

function renderGrid(){
  let list = ALL_LESSONS.slice();

  if(currentSubjectId){
    list = list.filter(l => l.subjectId === currentSubjectId);
  } else if(currentCat !== 'all'){
    if(currentCat === 'video') list = list.filter(l => l.type === 'video');
    else if(currentCat === 'tailieu') list = list.filter(l => l.type === 'tailieu');
    else if(currentCat === 'btvn') list = list.filter(l => l.type === 'btvn');
    else if(currentCat === 'toan') list = list.filter(l => /toán/i.test(l.subjectName));
    else if(currentCat === 'van') list = list.filter(l => /văn/i.test(l.subjectName));
    else if(currentCat === 'anh') list = list.filter(l => /anh|tiếng anh/i.test(l.subjectName));
    else if(currentCat === 'ly_hoa_sinh') list = list.filter(l => /lý|vật lý|hoá|hóa|sinh/i.test(l.subjectName));
  }

  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(l =>
      l.name.toLowerCase().includes(q) ||
      l.subjectName.toLowerCase().includes(q) ||
      (l.desc||'').toLowerCase().includes(q)
    );
  }

  $('grid').innerHTML = list.map((l, i)=>{
    const isYT = isYoutube(l.link);
    const thumbUrl = isYT ? ytThumb(l.link) : 'https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg';
    const thumbHq = isYT ? ytThumbHq(l.link) : thumbUrl;
    const firstChar = l.subjectName.charAt(0);
    const typeLabel = l.type === 'video' ? '▶ Video' : l.type === 'tailieu' ? '📄 Tài liệu' : '📝 BTVN';
    const typeClass = l.type;
    const dur = fakeDuration(i);

    return `
      <div class="card" onclick='openVideo(${ALL_LESSONS.indexOf(l)})'>
        <div class="thumb">
          <img src="${thumbUrl}" onerror="this.src='${thumbHq}'" alt="${escapeHtml(l.name)}" loading="lazy">
          <div class="badge-type ${typeClass}">${typeLabel}</div>
          <div class="dur">${dur}</div>
        </div>
        <div class="meta">
          <div class="avatar" style="background:${colorGrad(l.subjectColor)}">${firstChar}</div>
          <div class="info">
            <div class="title" title="${escapeHtml(l.name)}">${escapeHtml(l.name)}</div>
            <div class="author">
              ${escapeHtml(l.subjectName)}
              <span class="check">✓</span>
            </div>
            <div class="stats">${fakeViews(i)} · ${fakeTime(i)}</div>
          </div>
          <button class="menu-btn" onclick="event.stopPropagation()">⋮</button>
        </div>
      </div>
    `;
  }).join('') || '<div style="padding:80px 20px;text-align:center;color:#717171;grid-column:1/-1;font-size:15px"><div style="font-size:48px;margin-bottom:14px;opacity:.4">🔍</div>Không tìm thấy video nào</div>';
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   CHIPS
   ============================================================ */
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    currentCat = c.dataset.cat;
    currentSubjectId = null;
    document.querySelectorAll('#courseNav .sub-item').forEach(x=>x.classList.remove('active'));
    renderGrid();
  };
});

/* SIDEBAR TOP NAV */
document.querySelectorAll('.sidebar .nav-item').forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll('.sidebar .nav-item').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    const tab = el.dataset.tab;
    currentCat = tab === 'all' ? 'all' : tab;
    currentSubjectId = null;
    searchTerm = '';
    $('search').value = '';
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    const chip = document.querySelector(`.chip[data-cat="${currentCat}"]`);
    if(chip) chip.classList.add('active');
    renderGrid();
  };
});

/* SEARCH */
$('search').oninput = e=>{
  searchTerm = e.target.value;
  renderGrid();
};

/* ============================================================
   MODAL PLAYER
   ============================================================ */
let HLS = null;
let currentLesson = null;

function openVideo(flatIdx){
  const l = ALL_LESSONS[flatIdx];
  if(!l) return;
  currentLesson = l;

  // update modal info
  $('mTitle').textContent = l.name;
  $('mMeta').innerHTML = `
    <span>${escapeHtml(l.subjectName)}</span>
    <span>${escapeHtml(l.date)}</span>
    <span>${l.type === 'video' ? 'Video' : l.type === 'tailieu' ? 'Tài liệu' : 'BTVN'}</span>
  `;
  $('mCourseName').textContent = l.subjectName;
  $('mCourseSub').textContent = l.subjectDesc || '';

  // build playlist trong modal: chỉ hiện các bài CÙNG MÔN
  const sameSubject = ALL_LESSONS.filter(x => x.subjectId === l.subjectId);
  $('mPlaylist').innerHTML = sameSubject.map((x, i)=>{
    const active = x._i === l._i || (x.name === l.name && x.subjectId === l.subjectId);
    const xIdx = ALL_LESSONS.findIndex(y => y.subjectId === x.subjectId && y.name === x.name && y.date === x.date);
    return `
      <div class="modal-pl-item ${x.name === l.name ? 'active' : ''}" onclick="openVideo(${xIdx})">
        <div class="n">${x.name === l.name ? '▶' : i+1}</div>
        <div class="body">
          <div class="nm">${escapeHtml(x.name)}</div>
          <div class="mt">${escapeHtml(x.date)}</div>
        </div>
      </div>
    `;
  }).join('');

  // load video
  const v = $('player');
  if(HLS){ HLS.destroy(); HLS = null; }

  if(isHls(l.link)){
    if(window.Hls && Hls.isSupported()){
      HLS = new Hls({ enableWorker:true, lowLatencyMode:false });
      HLS.loadSource(l.link);
      HLS.attachMedia(v);
      HLS.on(Hls.Events.MANIFEST_PARSED, ()=> v.play().catch(()=>{}));
    } else {
      v.src = l.link;
    }
  } else if(isYoutube(l.link)){
    const id = getYouTubeId(l.link);
    v.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    // YouTube embed không phát qua thẻ video — mở iframe thay thế
    replacePlayerWithIframe(id);
    return;
  } else {
    v.src = l.link;
    v.play().catch(()=>{});
  }

  $('modal').classList.add('active');
}

function replacePlayerWithIframe(id){
  const box = document.querySelector('.player-box');
  const old = box.querySelector('video, iframe');
  if(old) old.remove();
  const close = box.querySelector('.player-close');
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.style.cssText = 'width:100%;aspect-ratio:16/9;display:block;border:none;background:#000';
  box.insertBefore(iframe, close);
}

function closeModal(){
  $('modal').classList.remove('active');
  if(HLS){ HLS.destroy(); HLS = null; }
  const v = $('player');
  if(v){ v.pause(); v.src = ''; }
  // xoá iframe nếu có
  const box = document.querySelector('.player-box');
  const iframe = box.querySelector('iframe');
  if(iframe) iframe.remove();
  // thêm lại video element
  if(!box.querySelector('video')){
    const close = box.querySelector('.player-close');
    const newV = document.createElement('video');
    newV.id = 'player';
    newV.controls = true;
    newV.playsInline = true;
    newV.preload = 'auto';
    box.insertBefore(newV, close);
  }
  document.body.style.overflow = '';
}

$('modal').addEventListener('click', e=>{
  if(e.target === $('modal')) closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

/* ============================================================
   BOOT
   ============================================================ */
renderCourseNav();
renderGrid();
</script>
</body>
</html>
