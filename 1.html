<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WeX Education — Web3 Learning Hub</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WEX EDUCATION — YOUTUBE-STYLE DARK THEME
   ============================================================ */
:root{
  --yt-bg:#0f0f0f;
  --yt-bg-elev:#212121;
  --yt-bg-elev2:#272727;
  --yt-hover:#3d3d3d;
  --yt-fg:#f1f1f1;
  --yt-fg-dim:#aaaaaa;
  --yt-fg-mut:#717171;
  --yt-red:#ff0000;
  --yt-blue:#3ea6ff;
  --yt-border:rgba(255,255,255,.1);
  --yt-border2:rgba(255,255,255,.18);
  --yt-header-h:60px;
  --yt-sidebar-w:410px;
  --thumb:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0ItcOTprzbFzg6OtStUTkPpA7NSNvBe0Lw8n-fJG8bh8iVQXH2b4U3CeN&s=10');
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:14px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--yt-bg); color:var(--yt-fg); overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#6d6d6d}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input{font-family:inherit;outline:none}
img{display:block;max-width:100%}

/* ============================================================
   TOP HEADER
   ============================================================ */
.topbar{
  height:var(--yt-header-h); flex-shrink:0;
  background:var(--yt-bg); border-bottom:1px solid var(--yt-border);
  display:flex; align-items:center; gap:16px;
  padding:0 18px; z-index:50;
}
.topbar .logo{
  display:flex; align-items:center; gap:8px; flex-shrink:0;
  font-size:19px; font-weight:800; letter-spacing:-.04em;
  text-decoration:none; color:var(--yt-fg);
  cursor:pointer;
}
.topbar .logo .mark{
  width:32px;height:32px;background:linear-gradient(135deg,#ff0000,#a855f7);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:800;flex-shrink:0;
  box-shadow:0 2px 10px rgba(255,0,0,.35);
  letter-spacing:-.05em;
}
.topbar .logo .name{
  background:linear-gradient(120deg,#fff 30%,#c7d2fe 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;
}

.topbar .center{
  flex:1; display:flex; justify-content:center; max-width:720px; margin:0 auto;
}
.search-form{
  display:flex; width:100%; max-width:600px;
  background:var(--yt-bg-elev); border:1px solid var(--yt-border);
  border-radius:40px; overflow:hidden; height:42px;
  transition:border-color .15s,box-shadow .15s;
}
.search-form:focus-within{
  border-color:#1c62b9;
  box-shadow:0 0 0 3px rgba(62,166,255,.12);
}
.search-form input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--yt-fg); padding:0 18px; font-size:14.5px;
  font-weight:400;
}
.search-form input::placeholder{color:var(--yt-fg-mut)}
.search-form button{
  width:64px; background:var(--yt-bg-elev2); border-left:1px solid var(--yt-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--yt-fg-dim); font-size:16px;
}
.search-form button:hover{background:var(--yt-hover)}

.topbar .right{
  display:flex; align-items:center; gap:4px; flex-shrink:0;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--yt-fg-dim); font-size:18px; transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--yt-hover);color:var(--yt-fg)}

@media(max-width:700px){
  .topbar .center{display:none}
  .topbar{padding:0 10px;gap:8px}
  .topbar .logo{font-size:17px}
  .topbar .logo .mark{width:28px;height:28px;font-size:13px}
}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.layout{
  flex:1; display:flex; min-height:0; overflow:hidden;
}
.player-col{
  flex:1; min-width:0; display:flex; flex-direction:column;
  background:var(--yt-bg); overflow-y:auto;
}
.side-col{
  width:var(--yt-sidebar-w); flex-shrink:0;
  background:var(--yt-bg); border-left:1px solid var(--yt-border);
  display:flex; flex-direction:column; min-height:0;
}
@media(max-width:1000px){
  .layout{flex-direction:column}
  .side-col{width:100%; height:55vh; border-left:none; border-top:1px solid var(--yt-border)}
  .player-col{height:45vh}
}
@media(max-width:600px){
  .side-col{height:60vh}
  .player-col{height:40vh}
}

/* ============================================================
   PLAYER
   ============================================================ */
.player-wrap{
  position:relative; width:100%; background:#000;
  aspect-ratio:16/9; flex-shrink:0;
}
.player-wrap video{
  width:100%; height:100%; display:block; background:#000; outline:none;
}
.player-wrap:fullscreen{aspect-ratio:auto;height:100vh}

.ctrl-overlay{
  position:absolute; inset:0; z-index:5;
  display:flex; flex-direction:column; justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,transparent 20%,transparent 70%,rgba(0,0,0,.75) 100%);
  opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.player-wrap:hover .ctrl-overlay,
.player-wrap.paused .ctrl-overlay,
.player-wrap.show-ctrl .ctrl-overlay{
  opacity:1; pointer-events:auto;
}
.ctrl-top{
  display:flex; align-items:center; gap:12px;
  padding:14px 18px; color:#fff;
}
.ctrl-top .ttl{
  flex:1; font-size:15px; font-weight:600; letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.ctrl-top .ttl small{display:block;font-size:12px;color:#ddd;font-weight:400;margin-top:2px}
.ctrl-bottom{padding:0 14px 10px}
.progress{
  position:relative; height:5px; background:rgba(255,255,255,.25);
  border-radius:3px; cursor:pointer; margin-bottom:8px;
  transition:height .1s;
}
.progress:hover{height:8px}
.progress .buf{
  position:absolute; left:0; top:0; bottom:0;
  background:rgba(255,255,255,.4); border-radius:3px;
}
.progress .played{
  position:absolute; left:0; top:0; bottom:0;
  background:var(--yt-red); border-radius:3px;
}
.progress .knob{
  position:absolute; top:50%; transform:translate(-50%,-50%);
  width:0;height:0;border-radius:50%; background:var(--yt-red);
  transition:width .1s,height .1s;
}
.progress:hover .knob{width:14px;height:14px}
.progress .hover-time{
  position:absolute; bottom:16px; transform:translateX(-50%);
  background:rgba(0,0,0,.85); color:#fff; font-size:12px;
  padding:3px 7px; border-radius:4px; pointer-events:none;
  opacity:0; transition:opacity .1s; white-space:nowrap;
}
.progress:hover .hover-time{opacity:1}

.ctrl-row{
  display:flex; align-items:center; gap:4px; color:#fff;
}
.ctrl-row .spacer{flex:1}
.ctrl-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px; color:#fff; transition:background .15s;
}
.ctrl-btn:hover{background:rgba(255,255,255,.15)}
.ctrl-btn.sm{width:36px;height:36px;font-size:16px}
.time{
  font-size:13px; color:#fff; font-variant-numeric:tabular-nums;
  padding:0 6px; user-select:none; font-weight:500;
}
.volume-wrap{
  display:flex; align-items:center; gap:4px;
}
.volume-slider{
  width:0; overflow:hidden; transition:width .2s;
}
.volume-wrap:hover .volume-slider{width:70px}
.volume-slider input{
  width:70px; accent-color:#fff; cursor:pointer;
}
.settings-pop{
  position:absolute; bottom:60px; right:14px;
  background:rgba(28,28,28,.98); border-radius:10px;
  padding:8px 0; min-width:200px; font-size:13px;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  display:none;
}
.settings-pop.show{display:block}
.settings-pop .row{
  padding:8px 14px; display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; color:#eee;
}
.settings-pop .row:hover{background:rgba(255,255,255,.1)}
.settings-pop .row .val{color:#aaa;font-size:12px}
.settings-pop .sep{height:1px;background:rgba(255,255,255,.1);margin:4px 0}

.player-msg{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
  color:#fff; text-align:center; padding:24px; z-index:3;
  background:rgba(0,0,0,.85);
}
.player-msg .spinner{
  width:44px;height:44px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--yt-red);border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.player-msg .big{font-size:48px;opacity:.6}
.player-msg .sub{font-size:13px;color:#aaa;max-width:520px;line-height:1.6}
.player-msg .sub code{
  word-break:break-all;font-size:11px;background:rgba(255,255,255,.08);
  padding:6px 10px;border-radius:6px;display:inline-block;margin-top:6px;
}

/* ============================================================
   INFO UNDER PLAYER
   ============================================================ */
.video-info{
  padding:18px 22px 28px; border-bottom:1px solid var(--yt-border);
}
.video-info h1{
  font-size:18px; font-weight:700; line-height:1.35; margin-bottom:10px;
  letter-spacing:-.02em;
}
.video-meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  font-size:13px; color:var(--yt-fg-dim); margin-bottom:14px;
}
.video-meta .chip{
  background:var(--yt-bg-elev); padding:4px 10px; border-radius:14px;
  font-size:12px; color:var(--yt-fg-dim); font-weight:500;
}
.video-actions{
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;
}
.action-btn{
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:18px;
  background:var(--yt-bg-elev); color:var(--yt-fg);
  font-size:13px; font-weight:600;
  transition:background .15s;
}
.action-btn:hover{background:var(--yt-hover)}
.action-btn.active{background:#fff;color:#0f0f0f}

.info-desc{
  background:var(--yt-bg-elev); border-radius:12px;
  padding:14px 16px; font-size:13.5px; color:var(--yt-fg);
  line-height:1.65;
}
.info-desc .h{font-weight:700;margin-bottom:6px;font-size:13.5px;letter-spacing:-.01em}
.info-desc .muted{color:var(--yt-fg-dim);font-size:12.5px}

@media(max-width:600px){
  .video-info{padding:12px 14px 22px}
  .video-info h1{font-size:15px}
  .action-btn{padding:6px 10px;font-size:12px}
}

/* ============================================================
   SIDEBAR PLAYLIST
   ============================================================ */
.side-head{
  padding:14px 16px 12px; border-bottom:1px solid var(--yt-border);
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.side-head .ico{
  width:38px;height:38px;border-radius:11px; overflow:hidden; flex-shrink:0;
  background:linear-gradient(135deg,#ff0000,#a855f7);
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:0 2px 10px rgba(255,0,0,.25);
}
.side-head .txt{flex:1;min-width:0}
.side-head .txt .t{
  font-size:14px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.side-head .txt .s{font-size:11.5px;color:var(--yt-fg-dim);margin-top:3px;font-weight:500}
.side-head .toggle{
  font-size:12px; color:var(--yt-fg-dim); cursor:pointer;
  padding:5px 9px; border-radius:6px;
}
.side-head .toggle:hover{background:var(--yt-hover);color:var(--yt-fg)}

.side-tabs{
  display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--yt-border);
  flex-shrink:0; overflow-x:auto; scrollbar-width:none;
}
.side-tabs::-webkit-scrollbar{display:none}
.side-tabs button{
  padding:6px 13px; border-radius:16px; font-size:12px; font-weight:600;
  color:var(--yt-fg-dim); background:var(--yt-bg-elev); white-space:nowrap;
  transition:background .15s,color .15s;
}
.side-tabs button.active{background:#fff;color:#0f0f0f}
.side-tabs button:hover:not(.active){background:var(--yt-hover);color:var(--yt-fg)}

.playlist{
  flex:1; overflow-y:auto; padding:6px 0 40px;
}
.pl-item{
  display:flex; gap:10px; padding:8px 12px; cursor:pointer;
  transition:background .15s; position:relative;
}
.pl-item:hover{background:var(--yt-bg-elev)}
.pl-item.active{background:var(--yt-bg-elev2)}
.pl-item.active .pl-title{color:#fff;font-weight:600}
.pl-thumb{
  width:100px; height:56px; flex-shrink:0; border-radius:6px;
  background:#333 var(--thumb) center/cover no-repeat;
  position:relative; overflow:hidden;
}
.pl-thumb.has-video::after{
  content:'▶'; position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.45); color:#fff; font-size:20px;
  opacity:0; transition:opacity .15s;
}
.pl-item:hover .pl-thumb.has-video::after{opacity:1}
.pl-body{flex:1;min-width:0;padding-top:2px}
.pl-title{
  font-size:13px; line-height:1.4; color:var(--yt-fg);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; margin-bottom:4px;
  font-weight:500; letter-spacing:-.01em;
}
.pl-chap{
  font-size:11.5px; color:var(--yt-fg-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:500;
}
.pl-now{
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--yt-red); display:none;
}
.pl-item.active .pl-now{display:block}

/* Course group accordion */
.course-group-head{
  padding:12px 16px 8px; font-size:11px; text-transform:uppercase;
  letter-spacing:.8px; color:var(--yt-fg-mut); font-weight:700;
  border-top:1px solid var(--yt-border); margin-top:4px;
  cursor:pointer; display:flex; align-items:center; gap:9px;
  user-select:none; transition:color .15s;
}
.course-group-head:first-child{border-top:none;margin-top:0}
.course-group-head .arrow{
  transition:transform .2s; font-size:9px; color:var(--yt-fg-mut);
  display:inline-flex; width:12px; justify-content:center;
}
.course-group-head.collapsed .arrow{transform:rotate(-90deg)}
.course-group-head:hover{color:var(--yt-fg)}
.course-group-head .name{
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.course-group-head .cnt{
  font-size:10px; color:var(--yt-fg-mut);
  font-weight:600; padding:2px 7px; border-radius:10px;
  background:var(--yt-bg-elev);
  flex-shrink:0;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  padding:12px 22px; background:#fff; color:#0f0f0f;
  border-radius:10px; font-size:13px; font-weight:600;
  box-shadow:0 8px 28px rgba(0,0,0,.55);
  opacity:0; transition:.25s; pointer-events:none; z-index:200;
  max-width:90vw; letter-spacing:-.01em;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   MOBILE OPTIMIZATIONS
   ============================================================ */
@media(max-width:600px){
  .player-wrap{aspect-ratio:16/9}
  .ctrl-btn{width:36px;height:36px;font-size:16px}
  .ctrl-btn.sm{width:32px;height:32px;font-size:14px}
  .time{font-size:12px;padding:0 4px}
  .ctrl-top .ttl{font-size:13px}
  .ctrl-top .ttl small{font-size:10px}
  .volume-slider{display:none}
  .pl-thumb{width:80px;height:45px}
  .side-head{padding:12px 12px 10px}
  .side-head .txt .t{font-size:13px}
  .video-info h1{font-size:15px}
  .search-form button{width:48px}
  .progress{height:4px}
  .progress:hover{height:6px}
}
</style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
  <a class="logo" href="#">
    <span class="mark">W</span>
    <span class="name">WeX Education</span>
  </a>
  <div class="center">
    <form class="search-form" onsubmit="return false">
      <input id="search" placeholder="Tìm bài học, chương, khóa học…" autocomplete="off">
      <button type="button" title="Tìm">🔎</button>
    </form>
  </div>
  <div class="right">
    <button class="icon-btn" id="sideBtn" title="Ẩn/hiện playlist">☰</button>
  </div>
</div>

<!-- ================= LAYOUT ================= -->
<div class="layout">

  <!-- PLAYER COLUMN -->
  <div class="player-col" id="playerCol">
    <div class="player-wrap" id="playerWrap">
      <div class="player-msg" id="playerMsg">
        <div class="big">🎬</div>
        <div style="font-size:15px;font-weight:600">Chọn một bài học có video</div>
        <div class="sub">Danh sách bài giảng nằm ở cột bên phải · hỗ trợ HLS, phím tắt, tua nhanh, PIP, fullscreen</div>
      </div>
    </div>

    <div class="video-info" id="videoInfo">
      <h1 id="videoTitle">Chưa chọn bài</h1>
      <div class="video-meta" id="videoMeta">
        <span class="chip">—</span>
      </div>
      <div class="video-actions">
        <button class="action-btn" id="btnCopy">📋 Copy URL</button>
        <button class="action-btn" id="btnOpen">↗ Mở tab mới</button>
        <button class="action-btn" id="btnPip">⧉ PIP</button>
        <button class="action-btn" id="btnFs">⛶ Toàn màn hình</button>
      </div>
      <div class="info-desc">
        <div class="h">Mô tả</div>
        <div class="muted" id="videoDesc">Chọn một bài học từ danh sách bên phải để bắt đầu xem.</div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR COLUMN -->
  <div class="side-col" id="sideCol">
    <div class="side-head">
      <div class="ico">📚</div>
      <div class="txt">
        <div class="t" id="sideTitle">Danh sách bài giảng</div>
        <div class="s" id="sideSub">Đang tải…</div>
      </div>
      <div class="toggle" id="sideToggle" title="Thu gọn">▾</div>
    </div>
    <div class="side-tabs" id="sideTabs">
      <button data-filter="all" class="active">Tất cả</button>
      <button data-filter="video">Có video</button>
      <button data-filter="course">Theo khóa</button>
    </div>
    <div class="playlist" id="playlist"></div>
  </div>

</div>

<div id="toast"></div>

<!-- ================= DATA + LOGIC ================= -->
<script src="data.js"></script>

<script>
/* ============================================================
   STATE
   ============================================================ */
let FLAT = [];
let FILTERED = [];
let CURRENT = -1;
let HLS = null;
let sideFilter = 'all';
let sideCollapsed = false;

/* Mặc định: TẤT CẢ các khóa đều bị thu gọn */
let collapsedGroups = new Set();

const $ = id => document.getElementById(id);
const video = () => $('playerWrap').querySelector('video');

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(t._tid);
  t._tid = setTimeout(()=> t.className = '', 2600);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) return '0:00';
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
             : `${m}:${String(s).padStart(2,'0')}`;
}

/* ============================================================
   BUILD FLAT LIST
   ============================================================ */
function buildFlat(){
  FLAT = [];
  COURSES.forEach((course, ci)=>{
    course.lessons.forEach((l)=>{
      FLAT.push({
        courseIdx: ci,
        courseName: course.name,
        chapterName: l.c || '',
        lessonName: l.n || '',
        videoUrl: l.v || '',
        hasVideo: !!l.v,
        totalExercise: l.e || 0,
        _i: FLAT.length
      });
    });
  });
  // Khởi tạo tất cả các khóa đều bị thu gọn
  collapsedGroups = new Set(COURSES.map((_,i)=>i));
}

/* ============================================================
   RENDER PLAYLIST
   ============================================================ */
function renderPlaylist(){
  const root = $('playlist');
  root.innerHTML = '';

  let list = FILTERED;
  if(sideFilter === 'video') list = list.filter(l=>l.hasVideo);

  // Group theo course (áp dụng cho cả 'all', 'video' và 'course')
  const map = new Map();
  list.forEach(l=>{
    if(!map.has(l.courseIdx)) map.set(l.courseIdx, []);
    map.get(l.courseIdx).push(l);
  });

  map.forEach((items, ci)=>{
    const isCollapsed = collapsedGroups.has(ci);
    const h = document.createElement('div');
    h.className = 'course-group-head' + (isCollapsed ? ' collapsed' : '');
    h.innerHTML = `
      <span class="arrow">▼</span>
      <span class="name" title="${esc(COURSES[ci].name)}">${esc(COURSES[ci].name)}</span>
      <span class="cnt">${items.length}</span>`;
    h.onclick = ()=>{
      if(isCollapsed) collapsedGroups.delete(ci);
      else collapsedGroups.add(ci);
      renderPlaylist();
    };
    root.appendChild(h);

    if(!isCollapsed){
      items.forEach(l => root.appendChild(makePlItem(l)));
    }
  });

  updateSideSub();
}

function makePlItem(l){
  const d = document.createElement('div');
  d.className = 'pl-item' + (l._i === CURRENT ? ' active' : '');
  d.dataset.idx = l._i;
  d.innerHTML = `
    <div class="pl-now"></div>
    <div class="pl-thumb ${l.hasVideo?'has-video':''}"></div>
    <div class="pl-body">
      <div class="pl-title" title="${esc(l.lessonName)}">${esc(l.lessonName)}</div>
      <div class="pl-chap" title="${esc(l.chapterName)}">${esc(l.chapterName)}</div>
    </div>`;
  d.onclick = ()=> l.hasVideo ? play(l._i) : toast('Bài này không có video');
  return d;
}

function updateSideSub(){
  const total = FLAT.length;
  const vids = FLAT.filter(x=>x.hasVideo).length;
  $('sideSub').textContent = `${COURSES.length} khóa · ${total} bài · ${vids} video`;
}

/* ============================================================
   PLAY VIDEO
   ============================================================ */
function play(idx){
  const l = FLAT[idx];
  if(!l || !l.hasVideo) return;
  CURRENT = idx;

  document.querySelectorAll('.pl-item').forEach(e=>{
    e.classList.toggle('active', +e.dataset.idx === idx);
  });

  $('videoTitle').textContent = l.lessonName;
  $('videoMeta').innerHTML = `
    <span class="chip">${esc(l.courseName)}</span>
    <span class="chip">${esc(l.chapterName)}</span>
    <span class="chip">${l.totalExercise} bài tập</span>
    <span class="chip">Video</span>`;
  $('videoDesc').textContent = `${l.courseName} — ${l.chapterName}. Bài giảng: ${l.lessonName}.`;

  const wrap = $('playerWrap');
  if(HLS){ HLS.destroy(); HLS = null; }

  wrap.innerHTML = `
    <div class="player-msg" id="playerMsg">
      <div class="spinner"></div>
      <div class="sub">Đang tải video…</div>
    </div>
    <video playsinline preload="auto" webkit-playsinline></video>
    <div class="ctrl-overlay" id="ctrlOverlay">
      <div class="ctrl-top">
        <div class="ttl">${esc(l.lessonName)}<small>${esc(l.courseName)} · ${esc(l.chapterName)}</small></div>
      </div>
      <div class="ctrl-bottom">
        <div class="progress" id="progress">
          <div class="buf" id="buf"></div>
          <div class="played" id="played"></div>
          <div class="knob" id="knob"></div>
          <div class="hover-time" id="hoverTime">0:00</div>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="btnPlay" title="Play/Pause (k)">▶</button>
          <button class="ctrl-btn sm" id="btnPrev" title="Bài trước">⏮</button>
          <button class="ctrl-btn sm" id="btnNext" title="Bài sau">⏭</button>
          <div class="volume-wrap">
            <button class="ctrl-btn sm" id="btnMute" title="Tắt tiếng (m)">🔊</button>
            <div class="volume-slider">
              <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
            </div>
          </div>
          <span class="time" id="time">0:00 / 0:00</span>
          <div class="spacer"></div>
          <button class="ctrl-btn sm" id="btnBack10" title="Lùi 10s (←)">↺10</button>
          <button class="ctrl-btn sm" id="btnFwd10" title="Tiến 10s (→)">10↻</button>
          <button class="ctrl-btn sm" id="btnSettings" title="Cài đặt">⚙</button>
          <button class="ctrl-btn sm" id="btnPipC" title="Picture-in-Picture">⧉</button>
          <button class="ctrl-btn sm" id="btnFsC" title="Toàn màn hình (f)">⛶</button>
        </div>
      </div>
      <div class="settings-pop" id="settingsPop">
        <div class="row" data-speed="0.5">0.5x</div>
        <div class="row" data-speed="0.75">0.75x</div>
        <div class="row" data-speed="1">1x <span class="val">Bình thường</span></div>
        <div class="row" data-speed="1.25">1.25x</div>
        <div class="row" data-speed="1.5">1.5x</div>
        <div class="row" data-speed="2">2x</div>
        <div class="sep"></div>
        <div class="row" data-loop="0">Tắt lặp</div>
        <div class="row" data-loop="1">Lặp lại</div>
      </div>
    </div>`;

  const v = video();
  bindPlayer(v, l);
}

/* ============================================================
   BIND PLAYER EVENTS
   ============================================================ */
function bindPlayer(v, l){
  const wrap = $('playerWrap');
  const msg = $('playerMsg');
  const overlay = $('ctrlOverlay');
  const progress = $('progress');
  const played = $('played');
  const buf = $('buf');
  const knob = $('knob');
  const hoverTime = $('hoverTime');
  const timeEl = $('time');
  const btnPlay = $('btnPlay');
  const btnMute = $('btnMute');
  const volume = $('volume');
  const settingsPop = $('settingsPop');

  let seeking = false;

  v.addEventListener('loadedmetadata', ()=>{
    msg.style.display = 'none';
    timeEl.textContent = `0:00 / ${fmtTime(v.duration)}`;
  });
  v.addEventListener('canplay', ()=>{ msg.style.display = 'none'; });
  v.addEventListener('waiting', ()=>{
    msg.style.display = 'flex';
    msg.innerHTML = '<div class="spinner"></div><div class="sub">Đang tải…</div>';
  });
  v.addEventListener('playing', ()=>{
    msg.style.display = 'none';
    wrap.classList.remove('paused');
  });
  v.addEventListener('pause', ()=> wrap.classList.add('paused'));
  v.addEventListener('play',  ()=> wrap.classList.remove('paused'));
  v.addEventListener('timeupdate', ()=>{
    if(!v.duration) return;
    const p = v.currentTime / v.duration;
    played.style.width = (p*100)+'%';
    knob.style.left = (p*100)+'%';
    timeEl.textContent = `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
  });
  v.addEventListener('progress', ()=>{
    if(!v.buffered.length || !v.duration) return;
    const end = v.buffered.end(v.buffered.length-1);
    buf.style.width = (end/v.duration*100)+'%';
  });
  v.addEventListener('error', ()=>{
    wrap.innerHTML = `
      <div class="player-msg">
        <div class="big">⚠️</div>
        <div style="font-weight:600">Không phát được video (403?)</div>
        <div class="sub">CDN có thể chặn Referer lạ. Hãy thử mở tab mới hoặc copy URL.<br>
          <code>${esc(l.videoUrl)}</code></div>
      </div>`;
    toast('Video lỗi — có thể do 403 / CORS');
  });
  v.addEventListener('ended', ()=>{
    const next = FLAT.findIndex((x,i)=> i>CURRENT && x.hasVideo);
    if(next > -1) setTimeout(()=> play(next), 800);
  });

  btnPlay.onclick = ()=> v.paused ? v.play() : v.pause();
  $('btnBack10').onclick = ()=> v.currentTime = Math.max(0, v.currentTime-10);
  $('btnFwd10').onclick  = ()=> v.currentTime = Math.min(v.duration||0, v.currentTime+10);
  $('btnPrev').onclick = ()=>{
    for(let i=CURRENT-1;i>=0;i--) if(FLAT[i].hasVideo){ play(i); return; }
  };
  $('btnNext').onclick = ()=>{
    for(let i=CURRENT+1;i<FLAT.length;i++) if(FLAT[i].hasVideo){ play(i); return; }
  };
  btnMute.onclick = ()=>{
    v.muted = !v.muted;
    btnMute.textContent = v.muted ? '🔇' : '🔊';
  };
  volume.oninput = ()=>{
    v.volume = +volume.value;
    v.muted = v.volume === 0;
    btnMute.textContent = v.muted ? '🔇' : '🔊';
  };
  $('btnFsC').onclick = ()=> toggleFs();
  $('btnPipC').onclick = ()=> togglePip(v);
  $('btnSettings').onclick = (e)=>{
    e.stopPropagation();
    settingsPop.classList.toggle('show');
  };
  document.addEventListener('click', ()=> settingsPop.classList.remove('show'));

  settingsPop.querySelectorAll('[data-speed]').forEach(el=>{
    el.onclick = ()=>{ v.playbackRate = +el.dataset.speed; settingsPop.classList.remove('show'); toast(`Tốc độ ${el.dataset.speed}x`); };
  });
  settingsPop.querySelectorAll('[data-loop]').forEach(el=>{
    el.onclick = ()=>{ v.loop = el.dataset.loop === '1'; settingsPop.classList.remove('show'); toast(v.loop?'Bật lặp lại':'Tắt lặp lại'); };
  });

  const seekFromEvent = (e)=>{
    const rect = progress.getBoundingClientRect();
    const x = (e.clientX ?? e.touches[0].clientX) - rect.left;
    const p = Math.min(1, Math.max(0, x/rect.width));
    if(v.duration) v.currentTime = p * v.duration;
  };
  progress.addEventListener('mousedown', (e)=>{ seeking = true; seekFromEvent(e); });
  document.addEventListener('mousemove', (e)=>{ if(seeking) seekFromEvent(e); });
  document.addEventListener('mouseup', ()=>{ seeking = false; });
  progress.addEventListener('mousemove', (e)=>{
    const rect = progress.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const p = Math.min(1, Math.max(0, x/rect.width));
    hoverTime.style.left = (p*100)+'%';
    hoverTime.textContent = fmtTime(p * (v.duration||0));
  });
  progress.addEventListener('touchstart', (e)=>{ seeking = true; seekFromEvent(e); }, {passive:true});
  progress.addEventListener('touchmove', (e)=>{ if(seeking) seekFromEvent(e); }, {passive:true});
  progress.addEventListener('touchend', ()=>{ seeking = false; });

  wrap.addEventListener('mousemove', ()=>{
    wrap.classList.add('show-ctrl');
    clearTimeout(wrap._hideT);
    wrap._hideT = setTimeout(()=> wrap.classList.remove('show-ctrl'), 2500);
  });

  document.onkeydown = (e)=>{
    if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
    const v = video(); if(!v) return;
    switch(e.key.toLowerCase()){
      case ' ': case 'k': e.preventDefault(); v.paused ? v.play() : v.pause(); break;
      case 'arrowleft':  v.currentTime = Math.max(0, v.currentTime-5); break;
      case 'arrowright': v.currentTime = Math.min(v.duration||0, v.currentTime+5); break;
      case 'j': v.currentTime = Math.max(0, v.currentTime-10); break;
      case 'l': v.currentTime = Math.min(v.duration||0, v.currentTime+10); break;
      case 'arrowup':   v.volume = Math.min(1, v.volume+0.05); volume.value = v.volume; break;
      case 'arrowdown': v.volume = Math.max(0, v.volume-0.05); volume.value = v.volume; break;
      case 'm': v.muted = !v.muted; btnMute.textContent = v.muted?'🔇':'🔊'; break;
      case 'f': toggleFs(); break;
      case 'i': togglePip(v); break;
      case '0': case '1': case '2': case '3': case '4': case '5':
      case '6': case '7': case '8': case '9':
        v.currentTime = (v.duration||0) * (+e.key/10); break;
    }
  };

  overlay.addEventListener('mousemove', ()=>{
    wrap.classList.add('show-ctrl');
    clearTimeout(wrap._hideT);
    wrap._hideT = setTimeout(()=> wrap.classList.remove('show-ctrl'), 2500);
  });
  wrap.addEventListener('mouseleave', ()=> wrap.classList.remove('show-ctrl'));

  if(l.videoUrl.endsWith('.m3u8') && window.Hls && Hls.isSupported()){
    HLS = new Hls({ enableWorker:true, lowLatencyMode:false, maxBufferLength:30 });
    HLS.loadSource(l.videoUrl);
    HLS.attachMedia(v);
    HLS.on(Hls.Events.MANIFEST_PARSED, ()=> v.play().catch(()=>{}));
    HLS.on(Hls.Events.ERROR, (_, data)=>{
      if(data.fatal){
        console.error('HLS fatal:', data);
        toast('HLS lỗi: ' + data.type);
      }
    });
  } else {
    v.src = l.videoUrl;
    v.play().catch(()=>{});
  }

  wrap.classList.remove('paused');
}

function toggleFs(){
  const wrap = $('playerWrap');
  if(!document.fullscreenElement) wrap.requestFullscreen?.();
  else document.exitFullscreen?.();
}
async function togglePip(v){
  try{
    if(document.pictureInPictureElement) await document.exitPictureInPicture();
    else await v.requestPictureInPicture();
  }catch(err){ toast('PIP không khả dụng: ' + err.message); }
}

/* ============================================================
   SIDEBAR FILTER + SEARCH
   ============================================================ */
function applyFilter(){
  const q = $('search').value.toLowerCase().trim();
  FILTERED = FLAT.filter(l=>{
    if(!q) return true;
    return l.lessonName.toLowerCase().includes(q)
        || l.chapterName.toLowerCase().includes(q)
        || l.courseName.toLowerCase().includes(q);
  });
  // Khi search, mở tất cả nhóm để thấy kết quả
  if(q) collapsedGroups.clear();
  else collapsedGroups = new Set(COURSES.map((_,i)=>i));
  renderPlaylist();
}
$('search').oninput = applyFilter;

document.querySelectorAll('#sideTabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#sideTabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    sideFilter = b.dataset.filter;
    // Khi chuyển tab, reset về trạng thái thu gọn
    collapsedGroups = new Set(COURSES.map((_,i)=>i));
    renderPlaylist();
  };
});

$('sideToggle').onclick = ()=>{
  sideCollapsed = !sideCollapsed;
  const col = $('sideCol');
  col.style.display = sideCollapsed ? 'none' : 'flex';
  $('sideToggle').textContent = sideCollapsed ? '▸' : '▾';
};
$('sideBtn').onclick = ()=> $('sideToggle').click();

$('btnCopy').onclick = ()=>{
  const l = FLAT[CURRENT];
  if(!l?.videoUrl) return toast('Chưa chọn bài có video');
  navigator.clipboard.writeText(l.videoUrl).then(()=>toast('Đã copy URL'), ()=>toast('Copy lỗi'));
};
$('btnOpen').onclick = ()=>{
  const l = FLAT[CURRENT];
  if(!l?.videoUrl) return toast('Chưa chọn bài có video');
  window.open(l.videoUrl, '_blank');
};
$('btnPip').onclick = ()=>{ const v = video(); if(v) togglePip(v); };
$('btnFs').onclick  = ()=> toggleFs();

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  if(typeof COURSES === 'undefined'){
    $('playlist').innerHTML = '<div style="padding:40px 20px;text-align:center;color:#717171;font-size:13px">❌ Không tìm thấy data.js. Hãy chắc chắn file data.js nằm cùng thư mục.</div>';
    $('sideSub').textContent = 'Lỗi dữ liệu';
    return;
  }
  buildFlat();
  FILTERED = FLAT.slice();
  renderPlaylist();
  toast(`✓ WeX Education · ${COURSES.length} khóa · ${FLAT.length} bài · ${FLAT.filter(x=>x.hasVideo).length} video`);
})();
</script>
